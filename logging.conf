[loggers]
keys=root,bmc

[logger_root]
level=INFO
handlers=consoleHandler

[logger_bmc]
level=INFO
handlers=bmcFileHandler
qualname=bmc
propagate=0

[handlers]
keys=consoleHandler,bmcFileHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=consoleFormatter

[handler_bmcFileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=consoleFormatter
args=('logs/bmc.log', 'a', 5242880, 5)

[formatters]
keys=consoleFormatter

[formatter_consoleFormatter]
format=%(asctime)s %(levelname)s [%(name)s] [%(filename)s:%(lineno)d] - %(message)s
datefmt=%H:%M:%S
