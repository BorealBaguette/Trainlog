{% extends "bootstrap/layout.html" %}
{% block content %}

{% include nav %}

<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="{{ url_for('static', filename='js/maplibre-utils.js') }}"></script>

<style>
  html, body { overflow: hidden; }
  #t3-wrap { position: relative; height: calc(100vh - 70px); display: flex; flex-direction: column; }
  #t3-map { flex: 1; min-height: 0; position: relative; }
  #t3-panel { position: absolute; top: 12px; left: 12px; z-index: 2; width: 300px; max-width: calc(100% - 24px);
    background: var(--bs-body-bg); border-radius: 8px; padding: 8px 10px; font-size: .85rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #t3-panel select { font-size: .8rem; }
  #t3-title { font-weight: 600; margin: 6px 0 2px; }
  #t3-note { color: var(--bs-secondary-color); font-size: .75rem; }
  .t3-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: .75rem; }
  .t3-legend span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 4px;
    vertical-align: middle; border-top: 3px solid #52b0fe; }
  .t3-legend .bridge::before { box-shadow: 0 0 0 2px #888; }
  .t3-legend .tunnel::before { border-top-width: 2px; border-top-style: dashed; opacity: .85; }
  .t3-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: .75rem; }
  .t3-ramp { height: 8px; margin-top: 4px; border-radius: 4px;
    background: linear-gradient(to right, #1a9641, #d9ef8b, #fdae61, #d7191c, #67001f); }
  .t3-ramp-ends { display: flex; justify-content: space-between; font-size: .7rem; color: var(--bs-secondary-color); }
  #t3-profile { height: 190px; flex-shrink: 0; border-top: 1px solid var(--bs-border-color);
    background: var(--bs-body-bg); position: relative; }
  #t3-profile svg { width: 100%; height: 100%; display: block; }
  #t3-tip { position: absolute; top: 6px; pointer-events: none; font-size: .75rem; padding: 2px 6px;
    background: rgba(0,0,0,.75); color: #fff; border-radius: 4px; white-space: nowrap; display: none; }
  .t3-axis { font-size: 10px; fill: var(--bs-secondary-color); }
  /* Cesium's credits, small and out of the profile's way */
  #t3-map .cesium-widget-credits { font-size: 10px; }
</style>

<div id="t3-wrap">
  <div id="t3-map"></div>
  <!-- Off-screen MapLibre map that draws the vector style into Cesium's tiles -->
  <div id="t3-tiler" style="position:absolute; left:-10000px; top:0; width:768px; height:768px;"></div>
  <div id="t3-panel">
    <select id="t3-pick" class="form-select form-select-sm">
      <option value="">Pick one of your trips…</option>
      {% for t in recent %}
      <option value="{{ t.trip_id }}" {% if t.trip_id == trip_id %}selected{% endif %}>#{{ t.trip_id }} {{ t.origin_station }} → {{ t.destination_station }}</option>
      {% endfor %}
    </select>
    <div id="t3-title"></div>
    <div id="t3-note">Rail trips saved with track heights (new router with elevation) are listed.</div>
    <div class="t3-legend"><span>open</span><span class="bridge">bridge</span><span class="tunnel">tunnel</span></div>
    <div class="t3-row">
      <label><input type="radio" name="t3-base" value="vector" checked> map</label>
      <label><input type="radio" name="t3-base" value="topo"> topo</label>
      <label><input type="radio" name="t3-base" value="satellite"> satellite</label>
    </div>
    <label class="t3-row"><input id="t3-raw" type="checkbox"> raw router heights in the profile</label>
    <label class="t3-row"><input id="t3-alt" type="checkbox"> colour by altitude</label>
    <label class="t3-row"><input id="t3-depth" type="checkbox"> show tunnels through the mountain</label>
    <div class="t3-row">CesiumJS · <a href="?engine=three">MapLibre + three.js version</a></div>
    <div id="t3-alt-legend" hidden><div class="t3-ramp"></div><div class="t3-ramp-ends"><span id="t3-alt-lo"></span><span id="t3-alt-hi"></span></div></div>
  </div>
  <div id="t3-profile"><svg id="t3-svg"></svg><div id="t3-tip"></div></div>
</div>

<script>
(async () => {
  const TRIP_ID = {{ trip_id | tojson }};
  const COLOR = { train: '#52b0fe', tram: '#a2d7ff', metro: '#004595', funicular: '#6495ed', rail: '#7ec8ff' };

  document.getElementById('t3-pick').addEventListener('change', e => {
    if (e.target.value) location.href = '/admin/trip3d/' + e.target.value;
  });

  // ── Terrain: the open Terrarium tiles (AWS / Mapzen), decoded here ──────────────
  // Cesium's Web Mercator tiles are numbered as Terrarium's, so a Cesium tile is a
  // Terrarium tile up to its zoom 15 and a piece of one beyond. Below sea level is
  // clamped to it: fjords are water to look at, not canyons.
  const TERRARIUM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
  const TERRARIUM_MAX = 15;
  const tileCache = new Map();
  function terrariumTile(z, x, y) {
    const key = `${z}/${x}/${y}`;
    if (!tileCache.has(key)) {
      if (tileCache.size > 250) tileCache.delete(tileCache.keys().next().value);
      tileCache.set(key, (async () => {
        try {
          const blob = await (await fetch(TERRARIUM.replace('{z}', z).replace('{x}', x).replace('{y}', y))).blob();
          const img = await createImageBitmap(blob);
          const canvas = new OffscreenCanvas(256, 256), ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const px = ctx.getImageData(0, 0, 256, 256).data, h = new Float32Array(256 * 256);
          for (let i = 0; i < h.length; i++) h[i] = Math.max(0, px[4 * i] * 256 + px[4 * i + 1] + px[4 * i + 2] / 256 - 32768);
          return h;
        } catch (e) { return null; }
      })());
    }
    return tileCache.get(key);
  }
  // Bilinear height at pixel position (px, py) of a decoded tile
  function sample(h, px, py) {
    const x0 = Math.min(255, Math.max(0, Math.floor(px))), y0 = Math.min(255, Math.max(0, Math.floor(py)));
    const x1 = Math.min(255, x0 + 1), y1 = Math.min(255, y0 + 1), fx = px - x0, fy = py - y0;
    const a = h[y0 * 256 + x0] * (1 - fx) + h[y0 * 256 + x1] * fx;
    const b = h[y1 * 256 + x0] * (1 - fx) + h[y1 * 256 + x1] * fx;
    return a * (1 - fy) + b * fy;
  }
  const SIZE = 65;
  const terrain = new Cesium.CustomHeightmapTerrainProvider({
    width: SIZE, height: SIZE,
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    credit: new Cesium.Credit('<a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank">Terrain: Mapzen, AWS Terrain Tiles</a>'),
    callback: async (x, y, level) => {
      const d = Math.max(0, level - TERRARIUM_MAX), z = level - d;
      const h = await terrariumTile(z, x >> d, y >> d);
      const out = new Float32Array(SIZE * SIZE);
      if (!h) return out;
      const scale = 256 / (1 << d), ox = (x & ((1 << d) - 1)) * scale, oy = (y & ((1 << d) - 1)) * scale;
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          out[r * SIZE + c] = sample(h, ox + c / (SIZE - 1) * scale, oy + r / (SIZE - 1) * scale);
      return out;
    },
  });

  // ── Imagery ──────────────────────────────────────────────────────────────────
  // Satellite: Sentinel-2 cloudless 2016 worldwide (CC BY 4.0; later editions are
  // non-commercial), with the national open orthophotos over it where they exist.
  const layer = (url, credit, opts = {}) => new Cesium.ImageryLayer(
    new Cesium.UrlTemplateImageryProvider({ url, credit: new Cesium.Credit(credit), ...opts }));
  // Topo: OpenTopoMap worldwide, with Kartverket's topographic map over it in Norway
  // (CC BY 4.0; its tiles outside Norway are blank, so the box around it can be loose).
  // Sharp at close zoom, where 10 m satellite imagery is a blur.
  const BASES = {
    topo: () => [
      layer('https://tile.opentopomap.org/{z}/{x}/{y}.png',
        'Map: © OpenStreetMap contributors, SRTM | style © <a href="https://opentopomap.org" target="_blank">OpenTopoMap</a> (CC-BY-SA)',
        { maximumLevel: 17 }),
      layer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',
        '© <a href="https://www.kartverket.no" target="_blank">Kartverket</a> (CC BY 4.0)',
        { maximumLevel: 18, rectangle: Cesium.Rectangle.fromDegrees(4, 57.8, 31.5, 71.5) }),
    ],
    satellite: () => [
      layer('https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg',
        '<a href="https://s2maps.eu" target="_blank">Sentinel-2 cloudless by EOX IT Services GmbH</a> (contains modified Copernicus Sentinel data 2016)',
        { maximumLevel: 15 }),
      layer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg',
        '© IGN', { maximumLevel: 19, rectangle: Cesium.Rectangle.fromDegrees(-5.2, 42.3, 8.3, 51.1) }),
      layer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
        '© swisstopo', { maximumLevel: 19, rectangle: Cesium.Rectangle.fromDegrees(5.95, 45.81, 10.5, 47.81) }),
    ],
    vector: () => [new Cesium.ImageryLayer(new StyleImageryProvider())],
  };

  // ── The site's own vector style, as imagery ──────────────────────────────────
  // Cesium only drapes pictures, so an off-screen MapLibre map draws each tile Cesium
  // asks for, one at a time, in the account's own style (Trainlog Light when the account
  // uses a raster base). It draws a 768 px square and keeps the middle 512, so labels
  // near a tile's edge are placed as on the full map rather than cut.
  const TILESERVER = {{ tileserver | tojson }} || '';
  const vectorBase = isVectorTileServer(TILESERVER.split('.').pop()) ? TILESERVER : 'trainlog-light';
  const { mapStyle } = await resolveBackground(vectorBase, { useGlobe: false });
  const tiler = new maplibregl.Map({
    container: 't3-tiler', style: mapStyle, interactive: false, attributionControl: false,
    preserveDrawingBuffer: true, pixelRatio: 2, fadeDuration: 0, center: [0, 0], zoom: 1,
  });
  await new Promise(r => tiler.loaded() ? r() : tiler.once('load', r));
  const styleCredit = [...new Set(Object.values(tiler.getStyle().sources)
    .map(src => src.attribution).filter(Boolean))].join(' | ') || '© OpenStreetMap contributors';
  let tileQueue = Promise.resolve();
  function renderTile(x, y, level) {
    const n = 2 ** level;
    const lng = (x + 0.5) / n * 360 - 180;
    const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + 0.5) / n))) * 180 / Math.PI;
    const job = tileQueue.then(() => new Promise(resolve => {
      // At MapLibre zoom `level` a tile of that level is 512 px across
      // The middle of the off-screen map as the tile. Its labels are painted into it, so
      // they turn with the ground as the camera turns, like a paper map's.
      tiler.once('idle', () => {
        const tile = document.createElement('canvas');
        // Drawn at twice the resolution (pixelRatio 2), so text and lines stay crisp
        tile.width = tile.height = 1024;
        const ctx = tile.getContext('2d');
        ctx.drawImage(tiler.getCanvas(), 256, 256, 1024, 1024, 0, 0, 1024, 1024);
        resolve(tile);
      });
      tiler.jumpTo({ center: [lng, lat], zoom: level });
      tiler.triggerRepaint();
    }));
    tileQueue = job.catch(() => {});
    return job;
  }
  class StyleImageryProvider {
    constructor() {
      this.tilingScheme = new Cesium.WebMercatorTilingScheme();
      this.rectangle = this.tilingScheme.rectangle;
      this.tileWidth = 512; this.tileHeight = 512;
      this.minimumLevel = 0; this.maximumLevel = 18;
      this.credit = new Cesium.Credit(styleCredit);
      this.errorEvent = new Cesium.Event();
      this.hasAlphaChannel = false; this.ready = true;
      this.tileDiscardPolicy = undefined; this.proxy = undefined;
    }
    getTileCredits() { return []; }
    requestImage(x, y, level) { return renderTile(x, y, level); }
    pickFeatures() { return undefined; }
  }

  Cesium.Ion.defaultAccessToken = '';  // nothing from Cesium ion is used
  const viewer = new Cesium.Viewer('t3-map', {
    terrainProvider: terrain, baseLayer: false,
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false,
  });
  const scene = viewer.scene;
  // Drawn at the screen's own pixel density and anti-aliased: by default Cesium draws at
  // CSS pixels, which on a high-density screen leaves lines blocky and everything soft.
  // A lower screen-space error picks sharper terrain, and with it sharper imagery.
  viewer.useBrowserRecommendedResolution = false;
  scene.msaaSamples = 4;
  scene.postProcessStages.fxaa.enabled = true;
  scene.globe.maximumScreenSpaceError = 1.5;
  // Lines are hidden by the terrain in front of them, and tunnels drawn where it hides them
  scene.globe.depthTestAgainstTerrain = true;
  const setBase = name => {
    viewer.imageryLayers.removeAll(true);
    BASES[name]().forEach(l => viewer.imageryLayers.add(l));
  };
  document.querySelectorAll('input[name=t3-base]').forEach(r => r.addEventListener('change', () => setBase(r.value)));
  setBase('vector');

  // The camera keeps clear of the ground: Cesium's collision check only knows the terrain
  // tiles already loaded, so a close view could otherwise end up inside a mountain.
  scene.screenSpaceCameraController.minimumZoomDistance = 150;

  if (!TRIP_ID) return;
  const res = await fetch(`/admin/trip3d/${TRIP_ID}.json`);
  if (!res.ok) { document.getElementById('t3-title').textContent = `Trip #${TRIP_ID} not found`; return; }
  const data = await res.json();
  const coords = data.coords;
  document.getElementById('t3-title').textContent = `${data.trip.origin} → ${data.trip.destination}`;
  document.getElementById('t3-note').textContent = data.height
    ? `${coords.length} points, ${(data.env || []).filter(r => r[2] === 'tunnel').length} tunnel stretches`
    : 'No track heights stored for this trip.';

  // Each segment i→i+1 takes the kind of the range holding both ends; runs of one kind
  const kind = new Array(Math.max(coords.length - 1, 0)).fill('open');
  for (const [s, e, k] of data.env || []) for (let i = s; i < e; i++) kind[i] = k;
  const runs = [];
  for (let i = 0; i < kind.length; i++) {
    const last = runs[runs.length - 1];
    if (last && last.kind === kind[i] && last.e === i) last.e = i + 1;
    else runs.push({ kind: kind[i], s: i, e: i + 1 });
  }
  const color = COLOR[data.trip.type] || COLOR.train;
  const dist = [0];
  for (let i = 1; i < coords.length; i++) dist.push(dist[i - 1] + haversine(coords[i - 1], coords[i]));
  const total = dist[dist.length - 1] || 1;
  const ground = await groundHeights(coords, total);

  // Altitude colouring: the track's own heights where stored, else the ground under it,
  // over the trip's own range on a green → dark red ramp.
  const altInput = document.getElementById('t3-alt');
  try { altInput.checked = localStorage.getItem('t3-alt') === '1'; } catch (e) { /* no storage */ }
  const depthInput = document.getElementById('t3-depth');
  // Shown unless turned off
  try { depthInput.checked = localStorage.getItem('t3-depth') !== '0'; } catch (e) { depthInput.checked = true; }
  const heights = coords.map((_, i) => data.height ? data.height[i] : (ground[i] ?? 0));
  const hLo = Math.min(...heights), hHi = Math.max(...heights);
  document.getElementById('t3-alt-lo').textContent = `${Math.round(hLo)} m`;
  document.getElementById('t3-alt-hi').textContent = `${Math.round(hHi)} m`;
  const RAMP = ['#1a9641', '#d9ef8b', '#fdae61', '#d7191c', '#67001f'].map(c => Cesium.Color.fromCssColorString(c));
  const altColor = h => {
    const t = Math.max(0, Math.min(1, (h - hLo) / ((hHi - hLo) || 1))) * (RAMP.length - 1);
    const i = Math.min(RAMP.length - 2, Math.floor(t));
    return Cesium.Color.lerp(RAMP[i], RAMP[i + 1], t - i, new Cesium.Color());
  };
  const showAltLegend = () => { document.getElementById('t3-alt-legend').hidden = !altInput.checked; };
  showAltLegend();

  // ── The route ─────────────────────────────────────────────────────────────────
  // Open track: clamped to the ground, which Cesium draws onto the terrain itself, crisp
  // on any slope. Bridges: straight between their ends, with piers. Tunnels: straight
  // between their portals, drawn dashed where the mountain hides them, with faint shafts
  // up to the surface.
  const base = Cesium.Color.fromCssColorString(color);
  const outline = Cesium.Color.WHITE.withAlpha(0.9);
  const lastIdx = coords.length - 1;
  const routeEntities = [];
  const cart = (i, z) => Cesium.Cartesian3.fromDegrees(coords[i][0], coords[i][1], z);
  const groundAt = i => ground[i] ?? heights[i];
  // Pieces of a run: the whole run, or short stretches each coloured by its height
  function pieces(s, e, byAlt) {
    if (!byAlt) return [{ s, e, color: base }];
    const out = [];
    for (let a = s; a < e; a += 6) {
      const b = Math.min(e, a + 6);
      out.push({ s: a, e: b, color: altColor((heights[a] + heights[b]) / 2) });
    }
    return out;
  }
  function buildRoute() {
    routeEntities.forEach(en => viewer.entities.remove(en));
    routeEntities.length = 0;
    const add = o => routeEntities.push(viewer.entities.add(o));
    const k = 1, byAlt = altInput.checked;  // terrain at 1:1
    // A short open stretch between two structures (a dam, a ledge or a gallery between two
    // tunnels) is carried at their level: the terrain model is too coarse to hold it and
    // would drop the track into the gorge it crosses.
    const carried = r => runs[r].kind === 'open' && r > 0 && r < runs.length - 1
      && runs[r - 1].kind !== 'open' && runs[r + 1].kind !== 'open'
      && dist[runs[r].e] - dist[runs[r].s] < 300;
    for (let r = 0; r < runs.length; r++) {
      const { kind: kd, s, e } = runs[r];
      const straight = (zs, ze) => i => zs + (ze - zs) * (dist[i] - dist[s]) / ((dist[e] - dist[s]) || 1);
      if (kd === 'tunnel' && !depthInput.checked) {
        // Hidden on request
      } else if (kd === 'tunnel') {
        // A route starting or ending inside a tunnel does so in an underground station
        const z = straight(groundAt(s) - (s === 0 ? 15 : 0), groundAt(e) - (e === lastIdx ? 15 : 0));
        for (const p of pieces(s, e, byAlt)) {
          const positions = [];
          for (let i = p.s; i <= p.e; i++) positions.push(cart(i, z(i) * k));
          add({ polyline: { positions, width: 3, arcType: Cesium.ArcType.NONE,
            material: p.color,
            depthFailMaterial: new Cesium.PolylineDashMaterialProperty({ color: p.color.withAlpha(0.85), dashLength: 14 }) } });
        }
        let next = dist[s] + 75;
        for (let i = s + 1; i < e; i++) {
          if (dist[i] < next) continue;
          if (groundAt(i) - z(i) > 5) add({ polyline: { positions: [cart(i, z(i) * k), cart(i, groundAt(i) * k)],
            width: 1, arcType: Cesium.ArcType.NONE, material: Cesium.Color.TRANSPARENT,
            depthFailMaterial: base.withAlpha(0.25) } });
          next = dist[i] + 150;
        }
      } else if (kd === 'bridge') {
        const z = straight(groundAt(s) + 2, groundAt(e) + 2);
        for (const p of pieces(s, e, byAlt)) {
          const positions = [];
          for (let i = p.s; i <= p.e; i++) positions.push(cart(i, z(i) * k));
          add({ polyline: { positions, width: 6, arcType: Cesium.ArcType.NONE,
            material: new Cesium.PolylineOutlineMaterialProperty({ color: p.color, outlineColor: outline, outlineWidth: 1.5 }) } });
        }
        let next = dist[s] + 20;
        for (let i = s + 1; i < e; i++) {
          if (dist[i] < next) continue;
          if (z(i) - groundAt(i) > 3) add({ polyline: { positions: [cart(i, z(i) * k), cart(i, groundAt(i) * k)],
            width: 1.5, arcType: Cesium.ArcType.NONE, material: Cesium.Color.LIGHTGRAY.withAlpha(0.8) } });
          next = dist[i] + 40;
        }
      } else if (carried(r)) {
        const z = straight(groundAt(s) + 1, groundAt(e) + 1);
        for (const p of pieces(s, e, byAlt)) {
          const positions = [];
          for (let i = p.s; i <= p.e; i++) positions.push(cart(i, z(i) * k));
          add({ polyline: { positions, width: 6, arcType: Cesium.ArcType.NONE,
            material: new Cesium.PolylineOutlineMaterialProperty({ color: p.color, outlineColor: outline, outlineWidth: 1.5 }) } });
        }
      } else {
        const lonlat = (a, b) => coords.slice(a, b + 1).flat();
        add({ polyline: { positions: Cesium.Cartesian3.fromDegreesArray(lonlat(s, e)), width: 7,
          clampToGround: true, zIndex: 0, material: outline } });
        for (const p of pieces(s, e, byAlt))
          add({ polyline: { positions: Cesium.Cartesian3.fromDegreesArray(lonlat(p.s, p.e)), width: 4,
            clampToGround: true, zIndex: 1, material: p.color } });
      }
    }
  }
  buildRoute();

  depthInput.addEventListener('change', () => {
    try { localStorage.setItem('t3-depth', depthInput.checked ? '1' : '0'); } catch (e) { /* no storage */ }
    buildRoute();
  });
  altInput.addEventListener('change', () => {
    try { localStorage.setItem('t3-alt', altInput.checked ? '1' : '0'); } catch (e) { /* no storage */ }
    showAltLegend();
    buildRoute();
  });

  // Looking along the route from above and to the side
  const sphere = Cesium.BoundingSphere.fromPoints(coords.map((c, i) => cart(i, groundAt(i))));
  viewer.camera.flyToBoundingSphere(sphere, {
    duration: 0, offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), sphere.radius * 2.6),
  });

  // ── Profile ──────────────────────────────────────────────────────────────────
  const marker = viewer.entities.add({ show: false, position: cart(0, 0), point: {
    pixelSize: 10, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Number.POSITIVE_INFINITY } });
  drawProfile();
  document.getElementById('t3-raw').addEventListener('change', drawProfile);
  window.addEventListener('resize', drawProfile);

  function haversine([lng1, lat1], [lng2, lat2]) {
    const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2
      + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2;
    return 12742000 * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  // The ground along the route, from the same terrain tiles (the profile needs it inside
  // tunnels too, where the track runs below it). The most detailed zoom that keeps a long
  // route to a few dozen tiles.
  async function groundHeights(points, length) {
    const midLat = points[Math.floor(points.length / 2)][1] * Math.PI / 180;
    let z = 13;
    while (z > 6 && length / (40075016 / 2 ** z * Math.cos(midLat)) * 1.5 > 60) z--;
    const n = 2 ** z;
    const where = points.map(([lng, lat]) => {
      const x = (lng + 180) / 360 * n;
      const y = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
      return { tx: Math.floor(x), ty: Math.floor(y), px: (x % 1) * 256, py: (y % 1) * 256 };
    });
    const tiles = await Promise.all(where.map(w => terrariumTile(z, w.tx, w.ty)));
    return where.map((w, i) => tiles[i] ? sample(tiles[i], w.px, w.py) : null);
  }

  function drawProfile() {
    const svg = document.getElementById('t3-svg');
    const W = svg.clientWidth, H = svg.clientHeight, L = 44, R = 10, T = 10, B = 20;
    const showRaw = document.getElementById('t3-raw').checked;
    const series = [ground, data.height, showRaw ? data.raw : null].filter(Boolean);
    const all = series.flat().filter(v => v !== null && v !== undefined);
    if (!all.length) { svg.innerHTML = ''; return; }
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = Math.max(10, (hi - lo) * 0.08); lo -= pad; hi += pad;
    const X = d => L + d / total * (W - L - R), Y = h => T + (hi - h) / (hi - lo) * (H - T - B);
    const line = vals => {
      let p = '', pen = false;
      vals.forEach((v, i) => {
        if (v === null || v === undefined) { pen = false; return; }
        p += `${pen ? 'L' : 'M'}${X(dist[i]).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
      });
      return p;
    };
    let out = '';
    // Tunnel stretches shaded, bridges tinted
    for (const [s, e, k] of data.env || []) {
      if (k !== 'tunnel' && k !== 'bridge') continue;
      out += `<rect x="${X(dist[s])}" y="${T}" width="${Math.max(1, X(dist[e]) - X(dist[s]))}" height="${H - T - B}"
              fill="${k === 'tunnel' ? 'rgba(80,80,80,.18)' : 'rgba(82,176,254,.12)'}"/>`;
    }
    // The ground above the track, then the track itself
    const g = line(ground);
    if (g) out += `<path d="${g}" fill="none" stroke="#8a6d3b" stroke-width="1.5"/>`;
    if (showRaw && data.raw) out += `<path d="${line(data.raw)}" fill="none" stroke="#999" stroke-width="1"/>`;
    if (data.height) out += `<path d="${line(data.height)}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    const step = h => { const p = 10 ** Math.floor(Math.log10(h)); return [1, 2, 5, 10].map(m => m * p).find(s => h / s <= 5); };
    const hs = step(hi - lo);
    for (let h = Math.ceil(lo / hs) * hs; h <= hi; h += hs)
      out += `<line x1="${L}" x2="${W - R}" y1="${Y(h)}" y2="${Y(h)}" stroke="currentColor" stroke-opacity=".08"/>
              <text class="t3-axis" x="${L - 4}" y="${Y(h) + 3}" text-anchor="end">${h} m</text>`;
    const ds = step(total / 1000);
    for (let d = 0; d <= total / 1000; d += ds)
      out += `<text class="t3-axis" x="${X(d * 1000)}" y="${H - 6}" text-anchor="middle">${d} km</text>`;
    out += `<line id="t3-cursor" y1="${T}" y2="${H - B}" stroke="#e11" stroke-width="1" visibility="hidden"/>`;
    svg.innerHTML = out;

    svg.onmousemove = ev => {
      const rect = svg.getBoundingClientRect(), x = ev.clientX - rect.left;
      const d = Math.max(0, Math.min(total, (x - L) / (W - L - R) * total));
      let i = dist.findIndex(v => v >= d); if (i < 0) i = dist.length - 1;
      const cursor = document.getElementById('t3-cursor');
      cursor.setAttribute('x1', X(dist[i])); cursor.setAttribute('x2', X(dist[i])); cursor.setAttribute('visibility', 'visible');
      const k = i < kind.length ? kind[i] : kind[kind.length - 1];
      const tip = document.getElementById('t3-tip');
      tip.style.display = 'block';
      tip.style.left = Math.min(X(dist[i]) + 8, W - 190) + 'px';
      tip.textContent = `${(dist[i] / 1000).toFixed(1)} km · track ${data.height ? Math.round(data.height[i]) + ' m' : '–'}`
        + ` · ground ${ground[i] !== null ? Math.round(ground[i]) + ' m' : '–'}${k !== 'open' ? ' · ' + k : ''}`;
      marker.position = cart(i, 0);
      marker.show = true;
    };
    svg.onmouseleave = () => {
      document.getElementById('t3-cursor')?.setAttribute('visibility', 'hidden');
      document.getElementById('t3-tip').style.display = 'none';
      marker.show = false;
    };
  }
})();
</script>
