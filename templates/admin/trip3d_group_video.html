{% extends "bootstrap/layout.html" %}
{% block content %}

{% include (nav if nav is defined else "bootstrap/navigation.html") %}

<link href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="{{ url_for('static', filename='js/maplibre-utils.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>

<style>
  html, body { overflow: hidden; }
  /* The site's light or dark theme (the user's setting), through Bootstrap's own colours */
  #v-wrap { --v-bg: var(--bs-tertiary-bg); --v-fg: var(--bs-body-color); --v-dim: var(--bs-secondary-color);
    --v-btn: var(--bs-secondary-bg); --v-accent: #2f81f7;
    height: calc(100vh - 70px); display: flex; gap: 14px; padding: 14px; background: var(--v-bg); box-sizing: border-box; }
  #v-stage-box { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  /* Over the frame while the map, the trips and the terrain load (it can take a while) */
  #v-loading { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: var(--v-bg); color: var(--v-fg); font-size: .95rem; }
  #v-loading i { font-size: 2rem; color: var(--v-accent); }
  #v-loading.v-done { display: none; }
  #v-stage { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #000; }
  #v-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #v-map { position: absolute; left: 0; top: 0; pointer-events: none; }
  #v-hud { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* The video draws its own credits; the map's buttons have no place in it */
  #v-map .maplibregl-control-container, #v-map > div[style*="monospace"] { display: none; }
  #v-panel { width: 290px; flex-shrink: 0; color: var(--v-fg); font-size: .85rem; display: flex; flex-direction: column; gap: 10px; }
  #v-panel h5 { margin: 0; font-weight: 700; }
  #v-panel select, #v-panel input { width: 100%; }
  #v-panel .v-row { display: flex; gap: 8px; align-items: center; }
  #v-panel label { color: var(--v-dim); font-size: .75rem; margin-bottom: 2px; display: block; }
  #v-panel button { border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; }
  #v-play { background: var(--v-btn); color: var(--v-fg); }
  #v-render { background: var(--v-accent); color: #fff; }
  #v-panel button:disabled { opacity: .5; cursor: default; }
  /* Options changed but not applied yet, and the button that applies them */
  #v-panel .v-pending { outline: 2px solid #f0a020; outline-offset: 1px; }
  #v-apply { background: var(--v-btn); color: var(--v-fg); }
  #v-apply:not(:disabled) { background: #f0a020; color: #1a1a1a; }
  #v-bar { height: 6px; background: var(--v-btn); border-radius: 3px; overflow: hidden; }
  #v-bar div { height: 100%; width: 0; background: var(--v-accent); transition: width .2s; }
  #v-status { color: var(--v-dim); font-size: .75rem; min-height: 1.2em; }
  /* Phones: the frame on top, the controls under it, the page scrolling */
  @media (max-width: 800px) {
    html, body { overflow: auto; }
    #v-wrap { flex-direction: column; height: auto !important; padding: 10px; }
    #v-stage-box { flex: none; height: 60vh; }
    #v-panel { width: 100%; padding-bottom: 20px; }
  }
</style>

<div id="v-wrap">
  <div id="v-stage-box">
    <div id="v-stage"><div id="v-scale"><div id="v-map"></div><canvas id="v-hud"></canvas></div></div>
    <div id="v-loading"><i class="fa-solid fa-circle-notch fa-spin"></i><div id="v-loading-text">Loading…</div></div>
  </div>
  <div id="v-panel">
    <h5>{{ video3dTitle }}</h5>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dDuration }}</label>
        <input id="v-len" type="number" min="15" max="3600" step="1" class="form-control form-control-sm" placeholder="{{ video3dAuto.replace('{n}', '…') }}"></div>
      <div style="flex:1"><label>{{ video3dFormat }}</label>
        <select id="v-size" class="form-select form-select-sm">
          <option value="1920x1080" selected>1080p</option><option value="1280x720">720p</option>
          <option value="720x720">{{ video3dSquare }}</option><option value="1080x1920">{{ video3dVertical }}</option>
          <option value="custom">{{ video3dCustom }}</option></select></div>
    </div>
    <div id="v-res" style="color:#9da7b3;font-size:.75rem;margin-top:-4px"></div>
    <div class="v-row" id="v-custom" hidden>
      <div style="flex:1"><label>{{ video3dWidth }}</label><input id="v-w" type="number" min="128" max="3840" step="2" value="1920" class="form-control form-control-sm"></div>
      <div style="flex:1"><label>{{ video3dHeight }}</label><input id="v-h" type="number" min="128" max="3840" step="2" value="1080" class="form-control form-control-sm"></div>
    </div>
    <div class="v-row">
      <div style="flex:1"><label>{{ tilesetLabel }}</label>
        <select id="v-bg" class="form-select form-select-sm">
          <option value="">{{ posterLabelDefault }}</option>
          <optgroup label="Trainlog"><option value="trainlog-light">Trainlog Rail Light</option><option value="trainlog-rail">Trainlog Rail Dark</option><option value="dark-train">Trainlog Dark</option></optgroup>
          <optgroup label="OpenFreeMap"><option value="ofm-liberty">Liberty</option><option value="ofm-bright">Bright</option><option value="ofm-positron">Positron</option></optgroup>
          <optgroup label="Jawg"><option value="jawg-streets-v2">Streets V2</option><option value="jawg-lagoon-v2">Lagoon V2</option><option value="jawg-terrain">{{ tileserver_jawg_terrain }}</option><option value="jawg-sunny">{{ tileserver_jawg_sunny }}</option><option value="jawg-light">{{ tileserver_jawg_light }}</option><option value="jawg-dark">{{ tileserver_jawg_dark }}</option></optgroup>
          <optgroup label="OpenStreetMap"><option value="osm">{{ tileserver_default }}</option><option value="de">{{ tileserver_de }}</option><option value="fr">{{ tileserver_fr }}</option></optgroup>
        </select></div>
    </div>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dMaxSize }}</label>
        <input id="v-mb" type="number" min="1" step="1" class="form-control form-control-sm" placeholder="{{ video3dNoLimit }}"></div>
    </div>
    <button id="v-apply" disabled>{{ video3dApply }}</button>
    <button id="v-play">▶ {{ video3dPreview }}</button>
    <button id="v-render">⬇ {{ video3dRender }}</button>
    <div id="v-bar"><div></div></div>
    <div id="v-status">Loading…</div>
  </div>
</div>

<script type="module">
// A video of a trip several people took together (a tag of their trips): everyone moves at
// once on the real clock, the camera keeping them all in the picture, each route drawing
// itself behind its traveller, at its real heights (never draped). Rendered frame by frame, each once its terrain has loaded, and
// encoded to MP4 in the browser (WebCodecs), so it plays smoothly however slow the render.
import * as THREE from 'three';
// The page's language: its words, and its numbers and dates
const T = {{ {'tunnel': video3dTunnel, 'bridge': video3dBridge, 'altitude': video3dAltitude, 'distance': video3dDistance,
  'highest': video3dHighest, 'cruise': video3dCruise, 'descent': video3dDescent, 'climb': video3dClimb,
  'noTunnels': video3dNoTunnels, 'ready': video3dReady, 'terrain': video3dTerrain, 'rendering': video3dRendering,
  'done': video3dDone, 'eta': video3dEta, 'preview': video3dPreview, 'failed': video3dFailed, 'auto': video3dAuto, 'stops': motisStops, 'tunnels': video3dTunnels,
  'transfers': video3dTransfers, 'inTunnels': video3dInTunnels, 'travellers': video3dTravellers,
  'travellersLabel': video3dTravellersLabel, 'trips': posterTripCount, 'tripsLabel': video3dTripsLabel} | tojson }};
const LANG = {{ (langId or 'en') | tojson }};
// A premium member's videos say so under the name, with the site's premium gem
const PREMIUM = {{ (is_premium or false) | tojson }};
const fill = (text, values) => Object.entries(values).reduce((t, [k, v]) => t.replace(`{${k}}`, v), text);
const plural = (forms, n) => fill(forms[new Intl.PluralRules(LANG).select(n)] ?? forms.other, { n });

// The trip page's trips (its /video link); a tag's video is named after the tag
const DATA_URL = {{ url_for('trip3d.trips_json') | tojson }};
// The trips asked for in the body (a tag's ids are too many for a URL)
const fetchTrips = () => fetch(DATA_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ ids: {{ tripIds | tojson }} }) });
const TAG_NAME = {{ (tag_description if tag_uuid else none) | tojson }};
// The background chosen for this page (?bg=, not saved), else the user's own
const BG = new URLSearchParams(location.search).get('bg');
const TILESERVER = BG || {{ tileserver | tojson }};
// Another one reloads the page (on Apply): the terrain and the route are laid over the map's
// style, which a background swap in place would lose. The length and the size limit asked for
// ride along (?len=, ?mb=)
document.getElementById('v-bg').value = BG || '';
const LEN = new URLSearchParams(location.search).get('len');
const MB = new URLSearchParams(location.search).get('mb');
if (MB) document.getElementById('v-mb').value = MB;
const LOGO = {{ url_for('static', filename='images/logo_square.png') | tojson }};
const TRIP_LOGOS = {{ url_for('static', filename='images/icons/trip_logos/') | tojson }};
const DEM = 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp';
// The site's colours per trip type, from its own list (as on its maps, every type there);
// metro brightened to read on the terrain
const COLOR = { ...Object.fromEntries(MapLibreUtils.MapConfig.transportTypes.map(t => [t.id, t.color])), metro: '#3d8bff' };
const FPS = 30;
THREE.ColorManagement.enabled = false;

const $status = document.getElementById('v-status'), $bar = document.querySelector('#v-bar div');
const status = (text, pct) => {
  $status.textContent = text;
  if (pct != null) $bar.style.width = `${pct}%`;
  document.getElementById('v-loading-text').textContent = text;
};
// The loading cover goes once the first frame is drawn (or stays, with the reason, if none can be)
const uncover = () => document.getElementById('v-loading').classList.add('v-done');
const stuck = text => { status(text); document.querySelector('#v-loading i').className = 'fa-solid fa-triangle-exclamation'; };

// ── Stage: the map at the video's own size, shown scaled to fit ─────────────────────
let [W, H] = [1920, 1080];
const $stage = document.getElementById('v-stage'), $scale = document.getElementById('v-scale');
const $map = document.getElementById('v-map'), hud = document.getElementById('v-hud'), g2 = hud.getContext('2d');
function layoutStage() {
  // The page fills the window below the navbar; on a phone it scrolls instead (CSS)
  const wrap = document.getElementById('v-wrap');
  wrap.style.height = window.matchMedia('(max-width: 800px)').matches ? '' : `${window.innerHeight - wrap.getBoundingClientRect().top}px`;
  const box = document.getElementById('v-stage-box').getBoundingClientRect();
  const s = Math.min(box.width / W, box.height / H);
  $stage.style.width = `${W * s}px`; $stage.style.height = `${H * s}px`;
  $scale.style.transform = `scale(${s})`;
  for (const el of [$map, hud]) { el.style.width = `${W}px`; el.style.height = `${H}px`; }
  hud.width = W; hud.height = H;
}
layoutStage();
window.addEventListener('resize', layoutStage);

const map = await MapLibreUtils.initializeMapLibre({
  container: 'v-map', tileserver: TILESERVER, useGlobe: false, center: [8, 60], zoom: 5, pixelRatio: 1,
  canvasContextAttributes: { antialias: true, preserveDrawingBuffer: true },
});
await new Promise(r => map.loaded() ? r() : map.once('load', r));
map.setMaxPitch(80);
const dem = { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 512, maxzoom: 16,
  attribution: '<a href="https://mapterhorn.com/attribution">© Mapterhorn</a>' };
map.addSource('v-terrain', dem);
map.addSource('v-hillshade', { ...dem, attribution: undefined });
const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
map.addLayer({ id: 'v-hillshade', type: 'hillshade', source: 'v-hillshade', paint: {
  'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': 'rgba(50,40,30,0.65)',
  'hillshade-highlight-color': 'rgba(255,255,255,0.45)', 'hillshade-accent-color': 'rgba(50,40,30,0.3)' } }, firstSymbol);
map.setTerrain({ source: 'v-terrain', exaggeration: 1 });
// The camera's focus height is ours (smoothed along the route), not the terrain's under it
// at each frame, which bobbed the view over every bump
map.setCenterClampedToGround?.(false);
map.setSky({ 'sky-color': '#7fb2e6', 'horizon-color': '#e9eef4', 'fog-color': '#dfe6ee',
  'sky-horizon-blend': 0.55, 'horizon-fog-blend': 0.55, 'fog-ground-blend': 0.6 });

const logo = new Image();
logo.src = LOGO;
// An image halved step by step down to the size drawn (tinted if asked): one drawImage straight
// from 900 px to ~170 px skips most source pixels and leaves the edges jagged
const shrunk = {};
function shrink(img, w, tint) {
  const key = `${img.src || img.id} ${w} ${tint}`;
  if (shrunk[key]) return shrunk[key];
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  let src = img, sw = iw, sh = ih;
  while (sw / 2 >= w) {
    const c = document.createElement('canvas');
    c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    [src, sw, sh] = [c, c.width, c.height];
  }
  const out = document.createElement('canvas');
  out.width = w; out.height = Math.round(w * ih / iw);
  const g = out.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, out.width, out.height);
  if (tint) { g.globalCompositeOperation = 'source-in'; g.fillStyle = tint; g.fillRect(0, 0, out.width, out.height); }
  return (shrunk[key] = out);
}
// The trip types' icons, for the station chip
const typeIcons = {};
const typeIcon = type => {
  if (!typeIcons[type]) {
    typeIcons[type] = new Image();
    typeIcons[type].src = `${TRIP_LOGOS}${type}.png`;
  }
  const img = typeIcons[type];
  return img.complete && img.naturalWidth ? img : null;
};

await document.fonts.load('900 20px "Font Awesome 6 Free"', '\uf4d7').catch(() => {});
// A failure (trips not found or not one's own, a map that will not load) stays on the cover
await setup().catch(e => stuck(`${e.message || e}`));

async function setup() {
  const loaded = await (await fetchTrips()).json();
  // Only trips with times: everyone moves on the real clock
  const legs = (loaded.trips || [loaded]).filter(t => t.coords?.length > 1 && t.trip.utc?.[0]);
  if (!legs.length) { stuck('Nothing to show: no trip with a path.'); return; }
  const data = mergeTrips(legs);
  const coords = data.coords, n = coords.length, last = n - 1;
  const color = COLOR[data.trip.type] || COLOR.train;
  const kindAt = new Array(Math.max(n - 1, 0)).fill('open');
  for (const [s, e, k] of data.env || []) for (let i = s; i < e; i++) kindAt[i] = k;
  for (const g of data.gaps) kindAt[g] = 'gap';
  const dist = [0];
  for (let i = 1; i < n; i++) dist.push(dist[i - 1] + haversine(coords[i - 1], coords[i]));
  const total = dist[last] || 1;
  const gapSpans = data.gaps.map(g => ({ from: dist[g], to: dist[g + 1] }));
  const tripSpans = data.spans.map(t => ({ from: dist[t.s], to: dist[t.e], minutes: t.minutes,
    name: (t.name || '').replace(/\p{Regional_Indicator}{2}\s*/gu, ''), type: t.type, real: t.real,
    user: t.user, start: t.start, r0: t.utc?.[0], r1: Math.max(t.utc?.[1] ?? 0, (t.utc?.[0] ?? 0) + 60000) }));

  // ── The track line, every ~20 m ────────────────────────────────────────────────
  // Open track on the ground smoothed along the line (a 200 m median bridges culverts and
  // gullies, a 100 m average evens the rest); tunnels and bridges straight from end to end.
  status(T.terrain);
  const S = [], at = [];
  for (let i = 0; i < last; i++) {
    at[i] = S.length;
    const m = kindAt[i] === 'gap' ? 1 : Math.max(1, Math.ceil((dist[i + 1] - dist[i]) / (data.types[i] === 'air' ? 300 : 20)));
    for (let j = 0; j < m; j++) {
      const t = j / m;
      S.push({ lng: lerp(coords[i][0], coords[i + 1][0], t), lat: lerp(coords[i][1], coords[i + 1][1], t),
        d: lerp(dist[i], dist[i + 1], t), kind: kindAt[i], h: lerp(data.height[i], data.height[i + 1], t), type: data.types[i] });
    }
  }
  at[last] = S.length;
  S.push({ lng: coords[last][0], lat: coords[last][1], d: total, kind: kindAt[last - 1] || 'open', h: data.height[last], type: data.types[last] });
  new Set(data.types).forEach(typeIcon);
  const d = S.map(p => p.d);
  // Flights read the ground under them apart, at their own coarser zoom
  const isAir = S.map(p => p.type === 'air');
  const ground = S.map(p => p.h);
  for (const air of [false, true]) {
    const ks = S.map((_, k) => k).filter(k => isAir[k] === air);
    if (!ks.length) continue;
    const got = await groundHeights(ks.map(k => [S[k].lng, S[k].lat]));
    ks.forEach((k, i) => { ground[k] = got[i] ?? (air ? 0 : S[k].h); });
  }
  let z = movingAverage(runningMedian(ground, d, 200), d, 100);
  const runs = [];
  for (let i = 0; i < kindAt.length; i++) {
    const r = runs[runs.length - 1];
    if (r && r.kind === kindAt[i] && r.e === i) r.e = i + 1; else runs.push({ kind: kindAt[i], s: i, e: i + 1 });
  }
  for (const { kind, s, e } of runs) {
    if (kind === 'open') continue;
    const a = at[s], b = at[e];
    const za = z[a] - (kind === 'tunnel' && s === 0 ? 15 : 0), zb = z[b] - (kind === 'tunnel' && e === last ? 15 : 0);
    for (let k = a; k <= b; k++) z[k] = za + (zb - za) * (d[k] - d[a]) / ((d[b] - d[a]) || 1);
  }
  // Tunnels and bridges run straight from end to end; a light average over the whole line
  // rounds the corners where they meet the open track
  z = movingAverage(z, d, 150);
  // Smoothing cuts under a ridge or a convex slope (a ski run): on the ground, never below it
  z = z.map((v, k) => (S[k].kind === 'tunnel' || isAir[k] || ground[k] == null ? v : Math.max(v, ground[k])));
  const LIFT = 3;
  z = z.map(v => v + LIFT);
  // Flights at their recorded altitude, else a plain climb, cruise and descent
  for (const t of tripSpans) {
    if (t.type !== 'air') continue;
    const ks = S.map((_, k) => k).filter(k => isAir[k] && d[k] >= t.from - 1 && d[k] <= t.to + 1);
    if (!ks.length) continue;
    const L = (t.to - t.from) || 1, g0 = ground[ks[0]], g1 = ground[ks[ks.length - 1]];
    const ramp = Math.min(L / 2, 180000), cruise = Math.min(11000, L * 0.06);
    for (const k of ks) {
      const x = d[k] - t.from, e = Math.min(1, Math.min(x, L - x) / ramp);
      z[k] = (t.real ? Math.max(S[k].h, ground[k]) : g0 + (g1 - g0) * x / L + cruise * e * e * (3 - 2 * e)) + LIFT;
    }
  }

  // Facts for the cards
  const tunnels = runs.filter(r => r.kind === 'tunnel');
  const zr = z.map(v => v - LIFT);
  // The travellers, each with their trips in order, and where each trip lies on the line
  const people = [...new Set(tripSpans.map(t => t.user))];
  for (const t of tripSpans) {
    t.k0 = Math.max(0, d.findIndex(v => v >= t.from - 0.01));
    t.k1 = Math.max(t.k0, d.findIndex((v, k) => k >= t.k0 && v >= t.to - 0.01));
  }
  const personSpans = people.map(p => tripSpans.filter(t => t.user === p).sort((a, b) => a.r0 - b.r0));
  // Busy stretches: whenever anyone is on the move (overlapping trips joined into one)
  const busy = [];
  for (const [a, b] of tripSpans.map(t => [t.r0, t.r1]).sort((x, y) => x[0] - y[0])) {
    const l = busy[busy.length - 1];
    if (l && a <= l[1]) l[1] = Math.max(l[1], b); else busy.push([a, b]);
  }
  // The clock in the local time of a trip (its local start against its UTC one)
  const offsetOf = t => (t?.start ? Date.parse(`${t.start}:00Z`) - t.r0 : 0);
  const clockText = (R, t) => {
    const x = new Date(R + offsetOf(t));
    return `${x.toLocaleDateString(LANG, { day: 'numeric', month: 'short', timeZone: 'UTC' })} · ${String(x.getUTCHours()).padStart(2, '0')}:${String(x.getUTCMinutes()).padStart(2, '0')}`;
  };
  const dateOf = (iso, year) => new Date(iso).toLocaleDateString(LANG, { day: 'numeric', month: 'short', ...(year ? { year: 'numeric' } : {}) });
  const first = tripSpans[0], lastTrip = tripSpans.reduce((a, t) => (t.r1 > a.r1 ? t : a));
  const fromDay = first.start ? dateOf(first.start, true) : null, toDay = lastTrip.start ? dateOf(lastTrip.start, true) : null;
  const onGround = zr.filter((_, k) => !isAir[k]);
  const facts = { km: tripSpans.reduce((a, t) => a + t.to - t.from, 0) / 1000, trips: tripSpans.length, people: people.length,
    tunnels: tunnels.length, top: onGround.length ? maxOf(onGround) : null };

  // ── three.js inside MapLibre ───────────────────────────────────────────────────
  const lngs = S.map(p => p.lng), lats = S.map(p => p.lat);
  const bounds = new maplibregl.LngLatBounds([minOf(lngs), minOf(lats)], [maxOf(lngs), maxOf(lats)]);
  const origin = maplibregl.MercatorCoordinate.fromLngLat(bounds.getCenter(), 0);
  const unit = origin.meterInMercatorCoordinateUnits();
  const local = (lng, lat, alt) => {
    const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], alt);

    const took = t.trip.start && t.trip.end ? (new Date(t.trip.end) - new Date(t.trip.start)) / 60000 : null;
    out.spans.push({ s: off, e: out.coords.length - 1, minutes: took > 0 ? took : null,
      name: `${t.trip.origin} → ${t.trip.destination}`, type: t.trip.type,
      real: !!t.height?.some(v => v > 300), user: t.trip.user, utc: t.trip.utc, start: t.trip.start });
  });
  return out;
}

// ── Helpers ──────────────────────────────────────────────────────────────────────
function runningMedian(z, d, window) {
  return z.map((_, i) => {
    let lo = i, hi = i;
    while (lo > 0 && d[i] - d[lo - 1] <= window / 2) lo--;
    while (hi < z.length - 1 && d[hi + 1] - d[i] <= window / 2) hi++;
    const part = z.slice(lo, hi + 1).sort((a, b) => a - b);
    return part[part.length >> 1];
  });
}

function runningMin(z, d, window) {
  return z.map((_, i) => {
    let m = z[i];
    for (let k = i; k >= 0 && d[i] - d[k] <= window / 2; k--) m = Math.min(m, z[k]);
    for (let k = i + 1; k < z.length && d[k] - d[i] <= window / 2; k++) m = Math.min(m, z[k]);
    return m;
  });
}

function movingAverage(z, d, window) {
  return z.map((_, i) => {
    let sum = 0, n = 0;
    for (let k = i; k >= 0 && d[i] - d[k] <= window / 2; k--) { sum += z[k]; n++; }
    for (let k = i + 1; k < z.length && d[k] - d[i] <= window / 2; k++) { sum += z[k]; n++; }
    return sum / n;
  });
}

function lerp(a, b, t) { return (a == null || b == null) ? (a ?? b) : a + (b - a) * t; }

// Smallest and largest of a long array (a spread into Math.min/max overflows the call stack)
function minOf(values) { let m = Infinity; for (const v of values) if (v < m) m = v; return m; }
function maxOf(values) { let m = -Infinity; for (const v of values) if (v > m) m = v; return m; }

function hexA(hex, alpha) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${alpha})`;
}

function haversine([lng1, lat1], [lng2, lat2]) {
  const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2
    + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2;
  return 12742000 * Math.asin(Math.min(1, Math.sqrt(a)));
}


async function groundHeights(points) {
  // The most detailed zoom whose tiles under the points number at most 80: counted, not
  // guessed from the length (a ski day's dozens of runs share a few tiles)
  const tileKey = (lng, lat, n) => `${Math.floor((lng + 180) / 360 * n)}/${Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n)}`;
  let z = 14;
  while (z > 6) {
    const keys = new Set();
    for (const [lng, lat] of points) { keys.add(tileKey(lng, lat, 2 ** z)); if (keys.size > 80) break; }
    if (keys.size <= 80) break;
    z--;
  }
  // Mapterhorn goes past zoom 12 only where it has a national lidar model: points on a
  // missing tile are read again two zooms coarser, down to the worldwide ones
  const out = new Array(points.length).fill(null);
  let todo = points.map((_, i) => i);
  for (; todo.length && z >= 6; z -= 2) {
    const got = await heightsAtZoom(todo.map(i => points[i]), z);
    todo.forEach((i, j) => { out[i] = got[j]; });
    todo = todo.filter(i => out[i] == null);
  }
  return out;
}

// Heights at one zoom, null where its tile is missing
async function heightsAtZoom(points, z) {
  const TILE = 512, n = 2 ** z, tiles = new Map();
  const where = points.map(([lng, lat]) => {
    const x = (lng + 180) / 360 * n;
    const y = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
    const key = `${Math.floor(x)}/${Math.floor(y)}`;
    if (!tiles.has(key)) tiles.set(key, null);
    return { key, px: Math.min(TILE - 1, Math.floor((x % 1) * TILE)), py: Math.min(TILE - 1, Math.floor((y % 1) * TILE)) };
  });
  await Promise.all([...tiles.keys()].map(async key => {
    try {
      const [x, y] = key.split('/');
      const res = await fetch(DEM.replace('{z}', z).replace('{x}', x).replace('{y}', y));
      if (!res.ok) return;
      const img = await createImageBitmap(await res.blob());
      const ctx = new OffscreenCanvas(TILE, TILE).getContext('2d');
      ctx.drawImage(img, 0, 0);
      tiles.set(key, ctx.getImageData(0, 0, TILE, TILE).data);
    } catch (e) { /* missing: read coarser */ }
  }));
  return where.map(({ key, px, py }) => {
    const t = tiles.get(key);
    if (!t) return null;
    const o = (py * TILE + px) * 4;
    return t[o] * 256 + t[o + 1] + t[o + 2] / 256 - 32768;
  });
}
