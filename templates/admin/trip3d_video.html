{% extends "bootstrap/layout.html" %}
{% block content %}

{% include (nav if nav is defined else "bootstrap/navigation.html") %}

<link href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="{{ static_autoversion('js/maplibre-utils.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>

<style>
  html, body { overflow: hidden; }
  /* The site's light or dark theme (the user's setting), through Bootstrap's own colours */
  #v-wrap { --v-bg: var(--bs-tertiary-bg); --v-fg: var(--bs-body-color); --v-dim: var(--bs-secondary-color);
    --v-btn: var(--bs-secondary-bg); --v-accent: #2f81f7;
    height: calc(100vh - 70px); display: flex; gap: 14px; padding: 14px; background: var(--v-bg); box-sizing: border-box; }
  #v-stage-box { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  /* Over the frame while the map, the trips and the terrain load (it can take a while) */
  #v-loading { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: var(--v-bg); color: var(--v-fg); font-size: .95rem; }
  #v-loading i { font-size: 2rem; color: var(--v-accent); }
  #v-loading.v-done { display: none; }
  #v-stage { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #000; }
  #v-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #v-map { position: absolute; left: 0; top: 0; pointer-events: none; }
  #v-hud { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* The video draws its own credits; the map's buttons have no place in it */
  #v-map .maplibregl-control-container, #v-map > div[style*="monospace"] { display: none; }
  #v-panel { width: 290px; flex-shrink: 0; color: var(--v-fg); font-size: .85rem; display: flex; flex-direction: column; gap: 10px; }
  #v-panel h5 { margin: 0; font-weight: 700; }
  #v-panel select, #v-panel input { width: 100%; }
  #v-panel .v-row { display: flex; gap: 8px; align-items: center; }
  #v-panel label { color: var(--v-dim); font-size: .75rem; margin-bottom: 2px; display: block; }
  #v-panel button { border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; }
  #v-play { background: var(--v-btn); color: var(--v-fg); }
  #v-render { background: var(--v-accent); color: #fff; }
  #v-panel button:disabled { opacity: .5; cursor: default; }
  /* Options changed but not applied yet, and the button that applies them */
  #v-panel .v-pending { outline: 2px solid #f0a020; outline-offset: 1px; }
  #v-apply { background: var(--v-btn); color: var(--v-fg); }
  #v-apply:not(:disabled) { background: #f0a020; color: #1a1a1a; }
  #v-bar { height: 6px; background: var(--v-btn); border-radius: 3px; overflow: hidden; }
  #v-bar div { height: 100%; width: 0; background: var(--v-accent); transition: width .2s; }
  #v-status { color: var(--v-dim); font-size: .75rem; min-height: 1.2em; }
  #v-panel { overflow-y: auto; }
  #v-panel input[type=checkbox] { width: auto; margin: 0; }
  #v-panel .v-check { display: inline-flex; align-items: center; gap: 7px; color: var(--v-fg); font-size: .8rem; margin: 0; cursor: pointer; }
  /* The photos picked, as thumbnails: where each lands on the route, or why it does not */
  #v-photo-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  #v-photo-list:empty { display: none; }
  #v-panel .v-ph { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--v-btn); }
  #v-panel .v-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #v-panel .v-ph.v-off img { opacity: .35; filter: grayscale(1); }
  #v-panel .v-ph span { position: absolute; left: 0; right: 0; bottom: 0; font-size: .6rem; padding: 1px 3px; background: rgba(0,0,0,.62);
    color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #v-panel .v-ph button { position: absolute; top: 2px; right: 2px; padding: 0; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; font-size: .6rem; line-height: 18px; }
  /* Phones: the frame on top, the controls under it, the page scrolling */
  @media (max-width: 800px) {
    html, body { overflow: auto; }
    #v-wrap { flex-direction: column; height: auto !important; padding: 10px; }
    #v-stage-box { flex: none; height: 60vh; }
    #v-panel { width: 100%; padding-bottom: 20px; }
  }
</style>

<div id="v-wrap">
  <div id="v-stage-box">
    <div id="v-stage"><div id="v-scale"><div id="v-map"></div><canvas id="v-hud"></canvas></div></div>
    <div id="v-loading"><i class="fa-solid fa-circle-notch fa-spin"></i><div id="v-loading-text">Loading…</div></div>
  </div>
  <div id="v-panel">
    <h5>{{ video3dTitle }}</h5>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dDuration }}</label>
        <input id="v-len" type="number" min="15" max="3600" step="1" class="form-control form-control-sm" placeholder="{{ video3dAuto.replace('{n}', '…') }}"></div>
      <div style="flex:1"><label>{{ video3dFormat }}</label>
        <select id="v-size" class="form-select form-select-sm">
          <option value="1920x1080" selected>1080p</option><option value="1280x720">720p</option>
          <option value="720x720">{{ video3dSquare }}</option><option value="1080x1920">{{ video3dVertical }}</option>
          <option value="custom">{{ video3dCustom }}</option></select></div>
    </div>
    <div id="v-res" style="color:#9da7b3;font-size:.75rem;margin-top:-4px"></div>
    <div class="v-row" id="v-custom" hidden>
      <div style="flex:1"><label>{{ video3dWidth }}</label><input id="v-w" type="number" min="128" max="3840" step="2" value="1920" class="form-control form-control-sm"></div>
      <div style="flex:1"><label>{{ video3dHeight }}</label><input id="v-h" type="number" min="128" max="3840" step="2" value="1080" class="form-control form-control-sm"></div>
    </div>
    <div class="v-row">
      <div style="flex:1"><label>{{ tilesetLabel }}</label>
        <select id="v-bg" class="form-select form-select-sm">
          <option value="">{{ posterLabelDefault }}</option>
          <optgroup label="Trainlog"><option value="trainlog-light">Trainlog Rail Light</option><option value="trainlog-rail">Trainlog Rail Dark</option><option value="dark-train">Trainlog Dark</option></optgroup>
          <optgroup label="OpenFreeMap"><option value="ofm-liberty">Liberty</option><option value="ofm-bright">Bright</option><option value="ofm-positron">Positron</option></optgroup>
          <optgroup label="Jawg"><option value="jawg-streets-v2">Streets V2</option><option value="jawg-lagoon-v2">Lagoon V2</option><option value="jawg-terrain">{{ tileserver_jawg_terrain }}</option><option value="jawg-sunny">{{ tileserver_jawg_sunny }}</option><option value="jawg-light">{{ tileserver_jawg_light }}</option><option value="jawg-dark">{{ tileserver_jawg_dark }}</option></optgroup>
          <optgroup label="OpenStreetMap"><option value="osm">{{ tileserver_default }}</option><option value="de">{{ tileserver_de }}</option><option value="fr">{{ tileserver_fr }}</option></optgroup>
        </select></div>
    </div>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dMusic }}</label>
        <input id="v-music" type="file" accept="audio/*" class="form-control form-control-sm">
        <div id="v-music-trim" hidden style="margin-top: 6px">
          <canvas id="v-wave" style="display: block; width: 100%; height: 56px; cursor: grab; border-radius: 6px; background: var(--v-btn); touch-action: none"></canvas>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 3px">
            <div id="v-music-info" style="flex: 1; color: var(--v-dim); font-size: .75rem"></div>
            <button id="v-music-fit" type="button" style="padding: 3px 8px; font-size: .75rem; background: var(--v-btn); color: var(--v-fg)">{{ video3dFitMusic }}</button>
          </div>
        </div>
        <div style="color: var(--v-dim); font-size: .7rem; margin-top: 3px">{{ video3dMusicRights }}</div></div>
    </div>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dPhotos }}</label>
        <input id="v-photos" type="file" accept="image/*" multiple class="form-control form-control-sm">
        <div id="v-photo-list"></div>
        <div style="color: var(--v-dim); font-size: .7rem; margin-top: 3px">{{ video3dPhotosHint }}</div></div>
    </div>
    <label class="v-check"><input id="v-hl" type="checkbox" checked> {{ video3dHighlights }}</label>
    <div class="v-row">
      <div style="flex:1"><label>{{ video3dMaxSize }}</label>
        <input id="v-mb" type="number" min="1" step="1" class="form-control form-control-sm" placeholder="{{ video3dNoLimit }}"></div>
    </div>
    <button id="v-apply" disabled>{{ video3dApply }}</button>
    <button id="v-play">▶ {{ video3dPreview }}</button>
    <button id="v-render">⬇ {{ video3dRender }}</button>
    <div id="v-bar"><div></div></div>
    <div id="v-status">Loading…</div>
  </div>
</div>

<script type="module">
// A video of a trip on the 3D terrain: the camera follows the train from above, the route
// drawing itself behind it at its real heights (never draped: bridges stand over their
// valleys, tunnels run through the mountain as an outlined dotted line), with the trip's
// profile along the bottom. Rendered frame by frame, each once its terrain has loaded, and
// encoded to MP4 in the browser (WebCodecs), so it plays smoothly however slow the render.
import * as THREE from 'three';
// The page's language: its words, and its numbers and dates
const T = {{ {'tunnel': video3dTunnel, 'bridge': video3dBridge, 'altitude': video3dAltitude, 'distance': video3dDistance,
  'highest': video3dHighest, 'cruise': video3dCruise, 'descent': video3dDescent, 'climb': video3dClimb,
  'ready': video3dReady, 'terrain': video3dTerrain, 'rendering': video3dRendering,
  'done': video3dDone, 'eta': video3dEta, 'licensedToTrainlog': licensedToTrainlog, 'preview': video3dPreview, 'failed': video3dFailed, 'auto': video3dAuto, 'stops': motisStops, 'tunnels': video3dTunnels,
  'transfers': video3dTransfers, 'inTunnels': video3dInTunnels, 'photos': video3dPhotos, 'photoUnplaced': video3dPhotoUnplaced,
  'photoUnreadable': video3dPhotoUnreadable, 'lowest': video3dLowest, 'longestTunnel': video3dLongestTunnel,
  'highestBridge': video3dHighestBridge, 'aboveValley': video3dAboveValley, 'tripsCount': video3dTripsCount,
  'countries': video3dCountries, 'photosCount': video3dPhotosCount} | tojson }};
// The trip types' names, for the end card's breakdown
const TYPE_NAMES = {{ {'train': train, 'bus': bus, 'tram': tram, 'metro': metro, 'air': air, 'ferry': ferry, 'aerialway': aerialway,
  'car': car, 'walk': walk, 'cycle': cycle, 'helicopter': helicopter, 'funicular': funicular, 'rail': rail, 'scooter': scooter,
  'ski': ski, 'other': other, 'poi': poi} | tojson }};
// Photos' EXIF (time and place) read in the browser, loaded on the first photo picked
const EXIFR = 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.esm.mjs';
const LANG = {{ (langId or 'en') | tojson }};
// A premium member's videos say so under the name, with the site's premium gem: the trips'
// owner's membership, once the trips are in
let PREMIUM = false;
const fill = (text, values) => Object.entries(values).reduce((t, [k, v]) => t.replace(`{${k}}`, v), text);
const plural = (forms, n) => fill(forms[new Intl.PluralRules(LANG).select(n)] ?? forms.other, { n });

// The trip page's trips (its /video link); a tag's video is named after the tag
const DATA_URL = {{ url_for('trip3d.trips_json') | tojson }};
// The trips asked for in the body (a tag's ids are too many for a URL)
const fetchTrips = () => fetch(DATA_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ ids: {{ tripIds | tojson }} }) });
const TAG_NAME = {{ (tag_description if tag_uuid else none) | tojson }};
// The background chosen for this page (?bg=, not saved), else the user's own
const BG = new URLSearchParams(location.search).get('bg');
const TILESERVER = BG || {{ tileserver | tojson }};
// Another one reloads the page (on Apply): the terrain and the route are laid over the map's
// style, which a background swap in place would lose. The other options ride along in the
// address too (?len=, ?mb=, ?size=)
document.getElementById('v-bg').value = BG || '';
const LEN = new URLSearchParams(location.search).get('len');
const MB = new URLSearchParams(location.search).get('mb');
if (MB) document.getElementById('v-mb').value = MB;
const LOGO = {{ static_autoversion('images/logo_square.png') | tojson }};
const TRIP_LOGOS = {{ url_for('static', filename='images/icons/trip_logos/') | tojson }};
const FLAGS = {{ url_for('static', filename='images/flags/') | tojson }};
// The train's cars, as its trip page draws them (static/js/wagon_img.js), and their credits
const WAGONS = {{ static_autoversion('images/wagons') | tojson }};
const wagonSrc = u => {
  const ext = u.image_ext || 'gif', side = u._side || 'L', t = u.image_type;
  if (t === 'sides') return `${WAGONS}/${u.image}${side === 'R' ? '_R' : '_L'}.${ext}`;
  if (t === 'sides_L' || t === 'sides_R') return `${WAGONS}/${u.image}_${t.slice(-1)}.${ext}`;
  return `${WAGONS}/${u.image}.${ext}`;
};
const wagonImages = {};
const wagonImage = u => {
  if (!u.image) return null;
  const src = wagonSrc(u);
  if (!wagonImages[src]) {
    const img = wagonImages[src] = new Image();
    img.onload = () => { img.ready = true; };
    img.onerror = () => { img.failed = true; };
    img.src = src;
  }
  return wagonImages[src];
};
// "© names (licence) · source", grouped by licence, as the trip page credits a composition;
// an author given as a Trainlog or wiki user page shown by name
const authorName = a => (a.match(/^https?:\/\/[^/]+\/public\/(.+)$/) || a.match(/^https?:\/\/[^/]+\/wiki\/User:(.+)$/i) || [, a])[1];
const wagonCredit = units => {
  const order = [], byLicense = {}, sources = [];
  for (const u of units) {
    if (u.source && !sources.includes(u.source)) sources.push(u.source);
    if (!u.author && !u.license) continue;
    const lic = u.license || '';
    if (!byLicense[lic]) { order.push(lic); byLicense[lic] = []; }
    for (const part of (u.author || '').split(',').map(x => x.trim().replace(/^\/+|\/+$/g, '')).filter(Boolean))
      if (!byLicense[lic].includes(authorName(part))) byLicense[lic].push(authorName(part));
  }
  const parts = order.map(lic => {
    const names = byLicense[lic].join(', '), label = lic === 'TRAINLOG_LICENSED' ? T.licensedToTrainlog : lic;
    return names && label ? `© ${names} (${label})` : names ? `© ${names}` : label;
  });
  return [...parts, ...sources].join(' · ');
};
const STATIC = {{ url_for('static', filename='') | tojson }};
// The operators' logos, as the site shows them
const operatorLogos = {};
const operatorLogo = path => {
  if (!path) return null;
  if (!operatorLogos[path]) {
    const img = operatorLogos[path] = new Image();
    img.onload = () => { img.ready = true; };
    img.src = STATIC + path;
  }
  return operatorLogos[path].ready ? operatorLogos[path] : null;
};
// A station name's flag emoji as its country code ("🇬🇧 Aviemore" → "gb"), drawn from the
// site's flag images: canvas cannot draw flag emoji everywhere (Windows shows two letters)
const flagCode = name => {
  const m = (name || '').match(/\p{Regional_Indicator}{2}/u);
  return m ? [...m[0]].map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 97)).join('') : null;
};
const flagImages = {};
const flagImage = code => {
  if (!code) return null;
  if (!flagImages[code]) {
    const img = flagImages[code] = new Image();
    img.onload = () => { img.ready = true; };
    img.src = `${FLAGS}${code}.svg`;
  }
  return flagImages[code].ready ? flagImages[code] : null;
};
const DEM = 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp';
// The site's colours per trip type, from its own list (as on its maps, every type there);
// metro brightened to read on the terrain
const COLOR = { ...Object.fromEntries(MapLibreUtils.MapConfig.transportTypes.map(t => [t.id, t.color])), metro: '#3d8bff' };
const FPS = 30;
THREE.ColorManagement.enabled = false;

const $status = document.getElementById('v-status'), $bar = document.querySelector('#v-bar div');
const status = (text, pct) => {
  $status.textContent = text;
  if (pct != null) $bar.style.width = `${pct}%`;
  document.getElementById('v-loading-text').textContent = text;
};
// The loading cover goes once the first frame is drawn (or stays, with the reason, if none can be)
const uncover = () => document.getElementById('v-loading').classList.add('v-done');
const stuck = text => { status(text); document.querySelector('#v-loading i').className = 'fa-solid fa-triangle-exclamation'; };

// ── Stage: the map at the video's own size, shown scaled to fit ─────────────────────
let [W, H] = [1920, 1080];
const $stage = document.getElementById('v-stage'), $scale = document.getElementById('v-scale');
const $map = document.getElementById('v-map'), hud = document.getElementById('v-hud'), g2 = hud.getContext('2d');
function layoutStage() {
  // The page fills the window below the navbar; on a phone it scrolls instead (CSS)
  const wrap = document.getElementById('v-wrap');
  wrap.style.height = window.matchMedia('(max-width: 800px)').matches ? '' : `${window.innerHeight - wrap.getBoundingClientRect().top}px`;
  const box = document.getElementById('v-stage-box').getBoundingClientRect();
  const s = Math.min(box.width / W, box.height / H);
  $stage.style.width = `${W * s}px`; $stage.style.height = `${H * s}px`;
  $scale.style.transform = `scale(${s})`;
  for (const el of [$map, hud]) { el.style.width = `${W}px`; el.style.height = `${H}px`; }
  hud.width = W; hud.height = H;
}
layoutStage();
window.addEventListener('resize', layoutStage);

const map = await MapLibreUtils.initializeMapLibre({
  container: 'v-map', tileserver: TILESERVER, useGlobe: false, center: [8, 60], zoom: 5, pixelRatio: 1,
  canvasContextAttributes: { antialias: true, preserveDrawingBuffer: true },
});
await new Promise(r => map.loaded() ? r() : map.once('load', r));
map.setMaxPitch(80);
const dem = { type: 'raster-dem', tiles: [DEM], encoding: 'terrarium', tileSize: 512, maxzoom: 16,
  attribution: '<a href="https://mapterhorn.com/attribution">© Mapterhorn</a>' };
map.addSource('v-terrain', dem);
map.addSource('v-hillshade', { ...dem, attribution: undefined });
const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
map.addLayer({ id: 'v-hillshade', type: 'hillshade', source: 'v-hillshade', paint: {
  'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': 'rgba(50,40,30,0.65)',
  'hillshade-highlight-color': 'rgba(255,255,255,0.45)', 'hillshade-accent-color': 'rgba(50,40,30,0.3)' } }, firstSymbol);
map.setTerrain({ source: 'v-terrain', exaggeration: 1 });
// The camera's focus height is ours (smoothed along the route), not the terrain's under it
// at each frame, which bobbed the view over every bump
map.setCenterClampedToGround?.(false);
map.setSky({ 'sky-color': '#7fb2e6', 'horizon-color': '#e9eef4', 'fog-color': '#dfe6ee',
  'sky-horizon-blend': 0.55, 'horizon-fog-blend': 0.55, 'fog-ground-blend': 0.6 });

const logo = new Image();
logo.src = LOGO;
// An image halved step by step down to the size drawn (inverted if asked): one drawImage straight
// from 900 px to ~170 px skips most source pixels and leaves the edges jagged
const shrunk = {};
function shrink(img, w, invert = false) {
  const key = `${img.src || img.id} ${w} ${invert}`;
  if (shrunk[key]) return shrunk[key];
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  let src = img, sw = iw, sh = ih;
  while (sw / 2 >= w) {
    const c = document.createElement('canvas');
    c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    [src, sw, sh] = [c, c.width, c.height];
  }
  const out = document.createElement('canvas');
  out.width = w; out.height = Math.round(w * ih / iw);
  const g = out.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, out.width, out.height);
  // Inverted for a dark background: black turns white and white black, so the white details
  // drawn inside an icon (a car's windows) stay visible rather than vanishing in a white fill
  if (invert) {
    const px = g.getImageData(0, 0, out.width, out.height), v = px.data;
    for (let i = 0; i < v.length; i += 4) { v[i] = 255 - v[i]; v[i + 1] = 255 - v[i + 1]; v[i + 2] = 255 - v[i + 2]; }
    g.putImageData(px, 0, 0);
  }
  return (shrunk[key] = out);
}
// The trip types' icons, for the station chip
const typeIcons = {};
const typeIcon = type => {
  if (!typeIcons[type]) {
    typeIcons[type] = new Image();
    typeIcons[type].src = `${TRIP_LOGOS}${type}.png`;
  }
  const img = typeIcons[type];
  return img.complete && img.naturalWidth ? img : null;
};

// A figure for a trip without a train's cars to draw (a walk, a car, a flight...), passing
// like the train does: drawn facing left, the way it goes, in its type's colour, its legs,
// wheels and waves going with the journey's moving clock (still at halts). In units of s, the
// figure's scale; the ground at y = 0, up negative
const TAU = Math.PI * 2, INK = '#141a22', GLASS = '#bfe0f5', FAR = '#b6bec8';
const pathOf = (g, pts) => { g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); };
// A limb or a bar: its outline, then the stroke
const bar = (g, pts, w, col, o) => {
  g.lineCap = 'round'; g.lineJoin = 'round';
  pathOf(g, pts); g.strokeStyle = INK; g.lineWidth = w + 2 * o; g.stroke();
  g.strokeStyle = col; g.lineWidth = w; g.stroke();
};
const shape = (g, build, col, o) => { build(); g.fillStyle = col; g.fill(); g.lineJoin = 'round'; g.lineWidth = o; g.strokeStyle = INK; g.stroke(); };

    // The train itself, when its exact composition was saved: its cars to scale, right-aligned

      const icon = cornerIcon && shrink(cornerIcon, iconW, true);
      const iy = icon ? Math.round(pad + dateRow + 30 * u - corner.px * u * 0.8 - (icon.height - corner.px * u) / 2) : 0;

      const lh = 22 * u, cpad = 6 * u, ch = opLogos.length ? lh + 2 * cpad : 0;

      const below = clockMid + 30 * u * 0.36;

        g2.save(); g2.shadowColor = 'rgba(0,0,0,0.35)'; g2.shadowBlur = 8 * u; g2.shadowOffsetY = 2 * u;

      if (flag) {

// Tunnel names from OpenStreetMap (tunnel:name, or a name that says tunnel; the router only
// keeps the line's name): one Overpass query for the tunnels longer than 100 m, each given
// the name of the named tunnel way nearest its middle. Filled in when it answers.
async function nameTunnels(tunnels, coords) {
  const long = tunnels.filter(t => t.to - t.from >= 100);
  if (!long.length) return;
  const mid = t => coords[Math.round((t.s + t.e) / 2)];
  const q = `[out:json][timeout:20];(${long.map(t => `way(around:40,${mid(t)[1]},${mid(t)[0]})[railway][tunnel];`).join('')});out tags center;`;
  // The main server is often at capacity: then a mirror
  let ways = null;
  for (const server of ['https://overpass-api.de', 'https://overpass.kumi.systems', 'https://overpass.private.coffee']) {
    try {
      const res = await fetch(`${server}/api/interpreter`, { method: 'POST', body: new URLSearchParams({ data: q }) });
      if (res.ok) { ways = (await res.json()).elements || []; break; }
    } catch (e) { /* next server */ }
  }
  if (!ways) return;
  try {
    const named = ways.map(w => ({ c: w.center, name: w.tags['tunnel:name']
      || (/tunnel|tunel|túnel|galleri|galerie/i.test(w.tags.name || '') ? w.tags.name : null) })).filter(w => w.name && w.c);
    for (const t of long) {
      const [lng, lat] = mid(t);
      let best = null, bestD = Infinity;
      for (const w of named) {
        const dd = haversine([lng, lat], [w.c.lon, w.c.lat]);
        if (dd < bestD) { bestD = dd; best = w; }
      }
      if (best && bestD < (t.to - t.from) / 2 + 100) t.name = best.name;
    }
  } catch (e) { /* no names: the chips say TUNNEL */ }
}

    let src = bmp, w = bmp.width, h = bmp.height;
    const k = Math.min(1, 1600 / Math.max(w, h)), tw = Math.round(w * k), th = Math.round(h * k);
    while (w / 2 >= tw && w > 1) {
      const c = document.createElement('canvas');
      c.width = Math.round(w / 2); c.height = Math.round(h / 2);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      [src, w, h] = [c, c.width, c.height];
    }
    const img = document.createElement('canvas');
    img.width = tw; img.height = th;
    const g = img.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, tw, th);
    bmp.close();
    const thumb = document.createElement('canvas');
    thumb.width = thumb.height = 200;
    const side = Math.min(tw, th), tg = thumb.getContext('2d');
    tg.imageSmoothingQuality = 'high';
    tg.drawImage(img, (tw - side) / 2, (th - side) / 2, side, side, 0, 0, 200, 200);
    Object.assign(ph, { img, thumb, thumbUrl: thumb.toDataURL('image/jpeg', 0.85) });
  } catch (e) { ph.error = true; }
  return ph;
}

// Several trips as one journey, in order: their paths joined (the hop from one trip's end
// to the next one's start marked as a gap, not drawn), their tunnels and stops shifted along,
// and each connection a stop with the arrival and departure times
function mergeTrips(list) {
  const out = { trip: { ...list[0].trip, destination: list[list.length - 1].trip.destination,
    end: list[list.length - 1].trip.end }, coords: [], height: [], env: [], stops: [], gaps: [], types: [], countries: [], spans: [] };
  list.forEach((t, i) => {
    const off = out.coords.length;
    if (i) {
      const prev = list[i - 1], at = prev.coords[prev.coords.length - 1];
      // A change named after where the next trip leaves from (the airport, not the shuttle's stop)
      out.stops.push({ name: (t.trip.origin || prev.trip.destination || '').replace(/\p{Regional_Indicator}{2}\s*/gu, ''), lng: at[0], lat: at[1],
        arr: prev.trip.end?.slice(-5), dep: t.trip.start?.slice(-5), arrFull: prev.trip.end, depFull: t.trip.start,
        major: true, transfer: true, at: off - 1 });
      out.gaps.push(off - 1);
    }
    out.coords.push(...t.coords);
    out.types.push(...t.coords.map(() => t.trip.type));
    out.height.push(...(t.height || t.coords.map(() => 0)));
    for (const [s, e, k] of t.env || []) out.env.push([s + off, e + off, k]);
    for (const [i, c] of t.countries || []) out.countries.push([i + off, c]);
    // A trip's own stops are looked for along that trip only
    out.stops.push(...(t.stops || []).map(st => ({ ...st, within: [off, off + t.coords.length - 1] })));
    // Each trip's points and how long it took, so the video gives it its share of the time
    const took = t.trip.start && t.trip.end ? (new Date(t.trip.end) - new Date(t.trip.start)) / 60000 : null;
    out.spans.push({ s: off, e: out.coords.length - 1, minutes: took > 0 ? took : null,
      name: `${t.trip.origin} → ${t.trip.destination}`, type: t.trip.type,
      real: !!t.height?.some(v => v > 300), flags: [flagCode(t.trip.origin), flagCode(t.trip.destination)],
      logos: t.trip.operator_logos || [], line: t.trip.line, vehicle: t.trip.vehicle, units: t.trip.units || [], start: t.trip.start,
      end: t.trip.end, utc: t.trip.utc });
  });
  return out;
}

// ── Helpers ──────────────────────────────────────────────────────────────────────
function runningMedian(z, d, window) {
  return z.map((_, i) => {
    let lo = i, hi = i;
    while (lo > 0 && d[i] - d[lo - 1] <= window / 2) lo--;
    while (hi < z.length - 1 && d[hi + 1] - d[i] <= window / 2) hi++;
    const part = z.slice(lo, hi + 1).sort((a, b) => a - b);
    return part[part.length >> 1];
  });
}

function runningMin(z, d, window) {
  return z.map((_, i) => {
    let m = z[i];
    for (let k = i; k >= 0 && d[i] - d[k] <= window / 2; k--) m = Math.min(m, z[k]);
    for (let k = i + 1; k < z.length && d[k] - d[i] <= window / 2; k++) m = Math.min(m, z[k]);
    return m;
  });
}

function movingAverage(z, d, window) {
  return z.map((_, i) => {
    let sum = 0, n = 0;
    for (let k = i; k >= 0 && d[i] - d[k] <= window / 2; k--) { sum += z[k]; n++; }
    for (let k = i + 1; k < z.length && d[k] - d[i] <= window / 2; k++) { sum += z[k]; n++; }
    return sum / n;
  });
}

function lerp(a, b, t) { return (a == null || b == null) ? (a ?? b) : a + (b - a) * t; }

// Smallest and largest of a long array (a spread into Math.min/max overflows the call stack)
function minOf(values) { let m = Infinity; for (const v of values) if (v < m) m = v; return m; }
function maxOf(values) { let m = -Infinity; for (const v of values) if (v > m) m = v; return m; }

function hexA(hex, alpha) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${alpha})`;
}

function haversine([lng1, lat1], [lng2, lat2]) {
  const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2
    + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2;
  return 12742000 * Math.asin(Math.min(1, Math.sqrt(a)));
}

// The ground under each [lng, lat], from the same Mapterhorn tiles the map draws, at the
// most detailed zoom that keeps the route to about 80 tiles
// Heights anywhere near a route: its tiles and their neighbours, read at a zoom where a tile
// is wider than the camera's distance to the train, so what is behind the camera is loaded
async function terrainSampler(S, length) {
  const TILE = 512, lat0 = S[Math.floor(S.length / 2)].lat * Math.PI / 180;
  const span = Math.max(500, 6 * length / 30);
  let z = Math.max(8, Math.min(12, Math.floor(Math.log2(40075016 * Math.cos(lat0) / (1.2 * span)))));
  const tileXY = (lng, lat, n) => [(((lng + 180) / 360) % 1 + 1) % 1 * n,
    (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n];
  let keys;
  for (;; z--) {
    keys = new Set();
    for (const p of S) {
      const [x, y] = tileXY(p.lng, p.lat, 2 ** z);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) keys.add(`${Math.floor(x) + dx}/${Math.floor(y) + dy}`);
    }
    if (keys.size <= 150 || z <= 6) break;
  }
  const tiles = new Map();
  await Promise.all([...keys].map(async key => {
    try {
      const [x, y] = key.split('/');
      const img = await createImageBitmap(await (await fetch(DEM.replace('{z}', z).replace('{x}', x).replace('{y}', y))).blob());
      const ctx = new OffscreenCanvas(TILE, TILE).getContext('2d');
      ctx.drawImage(img, 0, 0);
      tiles.set(key, ctx.getImageData(0, 0, TILE, TILE).data);
    } catch (e) { /* unknown there */ }
  }));
  const n = 2 ** z;
  return (lng, lat) => {
    const [x, y] = tileXY(lng, lat, n), t = tiles.get(`${Math.floor(x)}/${Math.floor(y)}`);
    if (!t) return null;
    const o = (Math.min(TILE - 1, Math.floor((y % 1) * TILE)) * TILE + Math.min(TILE - 1, Math.floor((x % 1) * TILE))) * 4;
    return t[o] * 256 + t[o + 1] + t[o + 2] / 256 - 32768;
  };
}

async function groundHeights(points) {
  // The most detailed zoom whose tiles under the points number at most 80: counted, not
  // guessed from the length (a ski day's dozens of runs share a few tiles)
  const tileKey = (lng, lat, n) => `${Math.floor((((lng + 180) / 360) % 1 + 1) % 1 * n)}/${Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n)}`;
  let z = 14;
  while (z > 6) {
    const keys = new Set();
    for (const [lng, lat] of points) { keys.add(tileKey(lng, lat, 2 ** z)); if (keys.size > 80) break; }
    if (keys.size <= 80) break;
    z--;
  }
  // Mapterhorn goes past zoom 12 only where it has a national lidar model: points on a
  // missing tile are read again two zooms coarser, down to the worldwide ones
  const out = new Array(points.length).fill(null);
  let todo = points.map((_, i) => i);
  for (; todo.length && z >= 6; z -= 2) {
    const got = await heightsAtZoom(todo.map(i => points[i]), z);
    todo.forEach((i, j) => { out[i] = got[j]; });
    todo = todo.filter(i => out[i] == null);
  }
  return out;
}

// Heights at one zoom, null where its tile is missing
async function heightsAtZoom(points, z) {
  const TILE = 512, n = 2 ** z, tiles = new Map();
  const where = points.map(([lng, lat]) => {
    const x = (((lng + 180) / 360) % 1 + 1) % 1 * n;
    const y = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
    const key = `${Math.floor(x)}/${Math.floor(y)}`;
    if (!tiles.has(key)) tiles.set(key, null);
    return { key, px: Math.min(TILE - 1, Math.floor((x % 1) * TILE)), py: Math.min(TILE - 1, Math.floor((y % 1) * TILE)) };
  });
  await Promise.all([...tiles.keys()].map(async key => {
    try {
      const [x, y] = key.split('/');
      const res = await fetch(DEM.replace('{z}', z).replace('{x}', x).replace('{y}', y));
      if (!res.ok) return;
      const img = await createImageBitmap(await res.blob());
      const ctx = new OffscreenCanvas(TILE, TILE).getContext('2d');
      ctx.drawImage(img, 0, 0);
      tiles.set(key, ctx.getImageData(0, 0, TILE, TILE).data);
    } catch (e) { /* missing: read coarser */ }
  }));
  return where.map(({ key, px, py }) => {
    const t = tiles.get(key);
    if (!t) return null;
    const o = (py * TILE + px) * 4;
    return t[o] * 256 + t[o + 1] + t[o + 2] / 256 - 32768;
  });
}
