{% extends "layout.html" %}
{% block content %}

<style>
  body { background: #0d1b2a; }
  #page {
    min-height: 100vh;
    padding: 80px 32px 40px;
    font-family: "Century Gothic", sans-serif;
    color: #e8edf3;
  }

  /* Summary bar */
  #summary {
    display: flex; gap: 32px; flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .stat { background: rgba(20,28,40,0.92); border-radius: 10px; padding: 14px 20px; }
  .stat .val { font-size: 1.7em; font-weight: bold; color: #52b0fe; }
  .stat .lbl { font-size: 0.78em; color: #8fa6bd; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* Mode toggle */
  #mode-toggle {
    display: flex; gap: 8px; margin-bottom: 28px;
  }
  .mode-btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid #33485f;
    background: transparent; color: #8fa6bd; cursor: pointer; font-family: inherit; font-size: 0.82em;
    transition: background 0.15s, color 0.15s;
  }
  .mode-btn.active { background: #1a3a5c; color: #e8edf3; border-color: #52b0fe; }

  /* Calendar grid */
  .year-block { margin-bottom: 32px; }
  .year-label { font-size: 0.85em; color: #8fa6bd; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.04em; }

  .cal-wrap { display: flex; gap: 6px; }
  .dow-labels {
    display: grid; grid-template-rows: 20px repeat(7, 13px); gap: 2px;
    font-size: 0.7em; color: #4a6278; padding-top: 0; width: 24px;
    align-items: center;
  }
  .dow-labels span { line-height: 13px; }

  .cal-grid-wrap { overflow-x: auto; }
  .month-labels {
    display: flex; font-size: 0.72em; color: #4a6278;
    margin-bottom: 3px; padding-left: 0;
  }
  .month-labels span { display: inline-block; }

  .cal-grid {
    display: grid;
    grid-template-rows: repeat(7, 13px);
    grid-auto-flow: column;
    gap: 2px;
  }
  .cell {
    width: 13px; height: 13px; border-radius: 2px;
    cursor: default; transition: opacity 0.1s;
    position: relative;
  }
  .cell:hover { opacity: 0.75; outline: 1px solid #e8edf3; outline-offset: 1px; cursor: pointer; }
  .cell.empty { background: transparent !important; pointer-events: none; }

  /* Tooltip */
  #tip {
    position: fixed; z-index: 100;
    background: rgba(10,18,28,0.96); color: #e8edf3;
    border: 1px solid #2a3a4d; border-radius: 7px;
    padding: 8px 12px; font-size: 0.8em; pointer-events: none;
    display: none; white-space: nowrap;
  }
  #tip b { color: #52b0fe; }

  /* Legend */
  #legend {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 0.75em; color: #4a6278;
  }
  #legend .swatch { width: 13px; height: 13px; border-radius: 2px; }
</style>

<div id="page">
  <div id="summary"></div>
  <div id="mode-toggle">
    <button class="mode-btn active" data-mode="trips">Trips / day</button>
    <button class="mode-btn" data-mode="km">km / day</button>
  </div>
  <div id="calendar"></div>
  <div id="legend"></div>
</div>

<div id="tip"></div>

<script>
const DATA_URL  = "{{ url_for('viz.calendar_api', username=username) }}";
const TRIPS_URL = "{{ trips_url }}";

// Blue-toned 5-level palette (0 = no travel, 4 = heaviest)
const PALETTE = ['#0e1f30', '#0e3d5c', '#0e5c8a', '#1a85c2', '#52b0fe'];
const DOW = ['Mon','','Wed','','Fri','','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let mode = 'trips';
let allData = {};   // { "2024-03-15": {trips, km} }
let thresholds = { trips: [0,1,3,6,10], km: [0,50,200,500,1000] };

function level(val, key) {
  const t = thresholds[key];
  if (val <= 0)      return 0;
  if (val < t[2])    return 1;
  if (val < t[3])    return 2;
  if (val < t[4])    return 3;
  return 4;
}

function isoDow(date) {
  // Monday = 0 … Sunday = 6
  return (date.getDay() + 6) % 7;
}

function buildCalendar(data) {
  allData = {};
  data.forEach(d => { allData[d.day] = d; });

  // Summary stats
  const totalTrips = data.reduce((s, d) => s + d.trips, 0);
  const totalKm    = data.reduce((s, d) => s + d.km, 0);
  const years      = [...new Set(data.map(d => d.day.slice(0,4)))].sort();
  const activeDays = data.length;
  const busyYear   = years.reduce((best, y) => {
    const n = data.filter(d => d.day.startsWith(y)).reduce((s,d) => s+d.trips, 0);
    return n > (best.n||0) ? {y, n} : best;
  }, {}).y;

  document.getElementById('summary').innerHTML = [
    { val: totalTrips.toLocaleString(), lbl: 'Total trips' },
    { val: Math.round(totalKm).toLocaleString() + ' km', lbl: 'Total distance' },
    { val: activeDays.toLocaleString(), lbl: 'Days with travel' },
    { val: busyYear || '—', lbl: 'Busiest year' },
  ].map(s => `<div class="stat"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');

  renderGrid();
  renderLegend();
}

function renderGrid() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  const years = [...new Set(Object.keys(allData).map(d => d.slice(0,4)))].sort().reverse();

  years.forEach(year => {
    const jan1   = new Date(year, 0, 1);
    const offset = isoDow(jan1); // blank cells before Jan 1

    // Build cell list: nulls for offset, then each day of the year
    const cells  = Array(offset).fill(null);
    const d      = new Date(year, 0, 1);
    const monthCols = {}; // month -> week column where it starts
    while (d.getFullYear() === +year) {
      const key = d.toISOString().slice(0, 10);
      const col = Math.floor((cells.length) / 7);
      const mon = d.getMonth();
      if (!(mon in monthCols)) monthCols[mon] = col;
      cells.push({ date: key, ...(allData[key] || { trips: 0, km: 0 }) });
      d.setDate(d.getDate() + 1);
    }
    const numWeeks = Math.ceil(cells.length / 7);
    while (cells.length < numWeeks * 7) cells.push(null);

    // Month labels row
    const labelRow = document.createElement('div');
    labelRow.className = 'month-labels';
    for (let w = 0; w < numWeeks; w++) {
      const span = document.createElement('span');
      span.style.width = '15px';
      // find if any month starts in this week
      const mon = Object.entries(monthCols).find(([,c]) => c === w);
      span.textContent = mon ? MONTHS[+mon[0]] : '';
      labelRow.appendChild(span);
    }

    // Cell grid
    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    grid.style.gridTemplateColumns = `repeat(${numWeeks}, 13px)`;
    cells.forEach(c => {
      const el = document.createElement('div');
      el.className = 'cell' + (c ? '' : ' empty');
      if (c) {
        const val  = mode === 'trips' ? c.trips : c.km;
        const lv   = level(val, mode);
        el.style.background = PALETTE[lv];
        el.dataset.date  = c.date;
        el.dataset.trips = c.trips;
        el.dataset.km    = c.km;
      }
      grid.appendChild(el);
    });

    // DOW labels
    const dowLabels = document.createElement('div');
    dowLabels.className = 'dow-labels';
    dowLabels.innerHTML = '<span></span>' + DOW.map(d => `<span>${d}</span>`).join('');

    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';
    const gridWrap = document.createElement('div');
    gridWrap.className = 'cal-grid-wrap';
    gridWrap.appendChild(labelRow);
    gridWrap.appendChild(grid);
    wrap.appendChild(dowLabels);
    wrap.appendChild(gridWrap);

    const block = document.createElement('div');
    block.className = 'year-block';
    block.innerHTML = `<div class="year-label">${year}</div>`;
    block.appendChild(wrap);
    cal.appendChild(block);
  });
}

function renderLegend() {
  const leg = document.getElementById('legend');
  const t = thresholds[mode];
  const labels = mode === 'trips'
    ? ['0', '1–2', '3–5', '6–9', '10+']
    : ['0', `1–${t[2]-1} km`, `${t[2]}–${t[3]-1} km`, `${t[3]}–${t[4]-1} km`, `${t[4]}+ km`];
  leg.innerHTML = '<span>Less</span>' +
    PALETTE.map((c, i) => `<div class="swatch" style="background:${c}" title="${labels[i]}"></div>`).join('') +
    '<span>More</span>';
}

// Tooltip
const tip = document.getElementById('tip');
document.addEventListener('click', e => {
  const cell = e.target.closest('.cell:not(.empty)');
  if (!cell || !cell.dataset.date) return;
  window.location.href = TRIPS_URL + '?search=' + encodeURIComponent('date:' + cell.dataset.date);
});

document.addEventListener('mousemove', e => {
  const cell = e.target.closest('.cell:not(.empty)');
  if (!cell) { tip.style.display = 'none'; return; }
  const km = parseFloat(cell.dataset.km);
  tip.innerHTML = `<b>${cell.dataset.date}</b><br>
    ${cell.dataset.trips} trip${cell.dataset.trips==1?'':'s'} · ${km.toLocaleString()} km`;
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 36) + 'px';
});

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderGrid();
    renderLegend();
  });
});

fetch(DATA_URL).then(r => r.json()).then(buildCalendar);
</script>

{% endblock %}
