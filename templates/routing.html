{% extends "layout.html" %}
{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.5.1/gpx.min.js"></script>
<script src="{{ url_for('static', filename='js/freehand.js') }}"></script>
<div id="map" class="mapRouting"></div>
<div id="sidebar">
    <div id="sidebar-content"></div>
</div>
{% if from_app %}
<style>
  div.leaflet-control-container { display: none !important; }
  nav.navbar { display: none !important; }
</style>
{% endif %}

<link rel="stylesheet" href="{{ url_for('static', filename='styles/routing_panel.css') }}">
<script>
// ─── Flutter bridge (for app) ───────────────────────────────────────────────
window.flutterBridge = {
  _send(event, payload) {
    if (!window.flutter_inappwebview) return;
    window.flutter_inappwebview.callHandler('routingEvent',  { event, ...payload });
  },
  loading(isLoading)          { this._send('loading',        { isLoading }); },
  routeInfo(text, distanceM, durationS) {
                                this._send('routeInfo',      { text, distanceM, durationS }); },
  routingError(message)       { this._send('routingError',   { message }); },
  saveTripDone(ok, trip)      { this._send('saveTripDone',   { ok, trip }); },
  saveError(message)          { this._send('saveError',      { message }); },
};
// ─── End Flutter bridge (for app) ───────────────────────────────────────────
var id = getGetParams().get("id");
var newTrip = null;
var currentRoute;
var routeDetails = null;
const texts = {
  "routeTitle": "{{routeTitle}}",
  "fineTuneNote": "{{fineTuneNote}}",
  "distanceTime": "{{distanceTime}}",
  "downloadGeoJSONButton": "{{downloadGeoJSONButton}}",
  "saveTripButton": "{{submit}}",
  "saveTripContinueButton": "{{saveTripContinueButton}}",
  "remove": "{{remove}}",
  "waypoint": "{{waypoint}}",
  "useNewRouter": "{{useNewRouter}}",
  "freehandMode": "{{freehandMode|default('Freehand')}}",
  "routerMode": "{{routerMode|default('Router')}}"
};

// Try POST data first, then sessionStorage
{% if trip_data %}
newTrip = {{ trip_data | safe }};
{% endif %}
if (!newTrip && id) {
    newTrip = JSON.parse(sessionStorage.getItem(id));
}

if (!newTrip) {
    document.getElementById('sidebar-content').innerHTML = '<h4>Error: No trip data provided</h4>';
    throw new Error('No trip data');
}

var fromApp = !!getGetParams().get("fromApp");
var type = getGetParams().get("type") || newTrip.type;
newTrip["type"] = type;
// Freehand is now an inline mode toggled on this same map (see below); `?freehand`
// in the URL just selects it as the initial mode instead of redirecting away.
var startFreehand = !!getGetParams().get("freehand");
var routerurl = `${window.location.origin}/forwardRouting/${type}/route/v1`;
var origCoord = newTrip["originStation"][0];
var destCoord = newTrip["destinationStation"][0];
var origLabel = newTrip["originStation"][1];
var destLabel = newTrip["destinationStation"][1];
var viaStations = newTrip["viaStations"] || [];
var wplist = [origCoord].concat(viaStations.map(function(v){ return v[0]; })).concat([destCoord]);
var spinnerContent = '<div class="spinner-container"><div class="lds-spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>';
var errorContent = '<h4 id="routing-error">{{routingError}}<h4><p>{{routingErrorDetails}}</p><p><button onclick=\"location.reload()\">{{retry}}</button></p>';
var saveErrorContent = '<h4 id="save-error">{{saveError}}</h4><p>{{saveErrorDetails}}</p><p><button onclick=\"location.reload();\">{{retry}}</button></p>';
var map = createMap(null, origCoord);
var sidebar;
var getCountryUrl = '{{url_for("getCountry")}}';
routing(map, true, type, getCountryUrl);

// ── Inline freehand mode ────────────────────────────────────────────────────
// Swaps this map between the road/rail router and the hand-draw canvas without
// leaving the page. The router control (window.control, set by routing()) is
// removed while drawing and re-added (which re-routes) when switching back.
var SINGLE_POINT = ["accommodation", "restaurant", "poi"];
var freehandEditor = null;
var freehandActive = false;

function enterFreehand() {
  if (freehandActive) return;
  freehandActive = true;
  if (window.control) map.removeControl(window.control);
  // Seed from the live router waypoints if present, otherwise the initial endpoints.
  var seed = (window.currentPlan && window.currentPlan.getWaypoints)
    ? window.currentPlan.getWaypoints().filter(function (w) { return w.latLng; })
        .map(function (w) { return [w.latLng.lat, w.latLng.lng]; })
    : wplist;
  if (!seed || seed.length < 2) seed = wplist;
  freehandEditor = createFreehandEditor(map, {
    origin: seed[0],
    dest: seed[seed.length - 1],
    waypoints: seed.slice(1, -1),
    markerIconStart: markerIconStart,
    markerIconEnd: markerIconEnd,
    onChange: function (path, distance) {
      currentRoute = path.map(function (p) { return { lat: p.lat, lng: p.lng }; });
      routeDetails = null;
      newTrip["trip_length"] = distance;
      newTrip["estimated_trip_duration"] = (distance / 30) * 3.6; // rough; freehand has no network
      sidebar.setContent(
        '<h4>' + origLabel + ' → ' + destLabel + '</h4>' +
        '<div class="route-meta"><span class="route-dist">' + mToKm(distance) + ' km</span></div>' +
        buildSubmitControl({
          saveLabel: texts.saveTripButton,
          continueLabel: texts.saveTripContinueButton,
          showContinue: newTrip.precision == "preciseDates" || !!newTrip.plan_uuid
        })
      );
    }
  });
}

function exitFreehand() {
  if (!freehandActive) return;
  freehandActive = false;
  if (freehandEditor) { freehandEditor.destroy(); freehandEditor = null; }
  if (window.control) window.control.addTo(map); // re-adds + re-routes
}

if (!SINGLE_POINT.includes(type)) {
  // The sidebar plugin overwrites the panel body on every setContent(), so we can't just
  // insert a button once. Instead wrap setContent so the toggle is re-injected at the top of
  // the panel in BOTH modes (router content comes from routing.js, freehand from enterFreehand).
  var _sidebarSetContent = sidebar.setContent.bind(sidebar);
  sidebar.setContent = function (html) {
    _sidebarSetContent(html || '');
    // Put the mode toggle in the action row so it shares a line with Save (+ continue);
    // if there's no action row yet (e.g. the loading spinner), fall back to the panel top.
    var icon = freehandActive ? 'fa-solid fa-route' : 'fa-solid fa-pencil';
    var label = freehandActive ? texts.routerMode : texts.freehandMode;
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'freehandToggleBtn';
    b.className = 'freehand-toggle-btn';
    b.innerHTML = '<i class="fh-ico ' + icon + '"></i><span>' + label + '</span>';
    b.onclick = function () { freehandActive ? exitFreehand() : enterFreehand(); };
    // Only show the toggle on the distance/info row (right side). During loading/spinner or
    // error states there's no .route-meta, so we simply don't render it (avoids a stray button).
    var host = document.querySelector('#sidebar .route-meta');
    if (host) host.appendChild(b);
  };
  if (startFreehand) enterFreehand();
}

async function saveTrip(continueTrip=false) {
  if (freehandActive && freehandEditor) {
    newTrip["route_source"] = "freehand";
    newTrip["waypoints"] = JSON.stringify(freehandEditor.getWaypoints());
  } else {
    newTrip["route_source"] = "router";
  }
    if (["accommodation", "restaurant", "poi"].includes(type)) {
        newTrip["trip_length"] = 0;
        newTrip["estimated_trip_duration"] = 0;
    }
    sidebar.setContent(spinnerContent);
    flutterBridge.loading(true);
    newTrip["details"] = routeDetails;
    var isPlan = !!newTrip.plan_uuid;
    $.post({
        url: isPlan ? '{{url_for("savePlanTrip", username=username)}}' : '{{url_for("saveTrip", username=username)}}',
        data: {
            jsonPath: JSON.stringify(currentRoute),
            newTrip: JSON.stringify(newTrip),
            fromApp: fromApp
        },
        success: function(res) {
            if (isPlan) {
                if (continueTrip) {
                    // Keep building the plan: prefill origin from this leg's destination and
                    // carry forward the SAME timing mode this leg used (relative or precise).
                    var contUrl = `{{ url_for('new', username=username, vehicle_type='') }}${type}?plan=${encodeURIComponent(newTrip.plan_uuid)}&prevDest=${newTrip["destinationStation"]}`;
                    if (newTrip.precision == "preciseDates") {
                        contUrl += `&prevEndDate=${newTrip["newTripEndDate"] || ''}&prevEndTime=${newTrip["newTripEndTime"] || ''}`;
                    } else if (newTrip.precision == "onlyDate") {
                        contUrl += `&prevEndDate=${newTrip["onlyDate"] || ''}`;
                    } else {
                        contUrl += `&prevPlanDay=${newTrip["planEndDay"] || ''}&prevPlanTime=${newTrip["planEndTime"] || ''}`;
                    }
                    location.href = contUrl;
                } else {
                    location.href = "/u/{{ username }}/plan/" + encodeURIComponent(newTrip.plan_uuid);
                }
                return;
            }
            if (fromApp) {
                flutterBridge.loading(false);
                flutterBridge.saveTripDone(true, res);
                return;
            }

            if (!continueTrip || newTrip.precision != "preciseDates") {
                location.href = "{{ url_for('landing') }}";
            } else {
                location.href = `{{ url_for('new', username=username, vehicle_type='') }}${type}?prevDest=${newTrip["destinationStation"]}&prevEndDate=${newTrip["newTripEndDate"]}&prevEndTime=${newTrip["newTripEndTime"]}`;
            }
        },
        error: function(xhr, status, error) {
            flutterBridge.loading(false);
            flutterBridge.saveError(error || 'Save failed');
            sidebar.setContent(saveErrorContent);
        }
    });
}
</script>
{% endblock %}
