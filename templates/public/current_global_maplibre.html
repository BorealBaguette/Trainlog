{% extends "layout.html" %}
{% block content %}

{% include "includes/trainset_display.html" %}

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">

<style>
  #map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  /* Loading veil while the first trips fetch is in flight. The map (position:
     fixed) paints over in-flow content, so the spinner must sit above it. */
  .spinner-container {
    position: fixed;
    inset: 0;
    z-index: 10;
    align-items: center;
    background: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  .spinner-container.hidden { opacity: 0; }
  .spinner-container .lds-spinner { top: auto; margin-top: 0; }

  /* Traveller's avatar in the pin's head, over MapLibre's default white dot */
  .maplibregl-marker .user-avatar { --avatar-size: 19px; position: absolute; left: 4px; top: 4px; }
  .popup-user-avatar { --avatar-size: 36px; }
  /* A group trip's pin: how many are on board, where a traveller's avatar would be, so that
     nobody in particular stands for the group */
  .maplibregl-marker .pin-count {
    position: absolute; left: 4px; top: 4px; width: 19px; height: 19px; border-radius: 50%;
    background: #fff; color: #222; font-size: 11px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  /* Everyone on board, in a group trip's popup: one chip each */
  .lp-crew { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .lp-member {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
    padding: 3px 11px 3px 3px; border-radius: 999px;
    background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color-translucent);
    font-weight: 600; font-size: .88rem; line-height: 1.2; color: inherit; text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .lp-member:hover { background: var(--bs-secondary-bg); border-color: var(--accent); }
  .lp-member .user-avatar { --avatar-size: 24px; flex: none; }
  .lp-member > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  /* Where each one gets on and off, on a shared ride: a second line in the chip */
  .lp-member:has(.lp-member-leg) { border-radius: 16px; padding-block: 4px; }
  .lp-member-leg { display: block; margin-top: 1px; font-weight: 400; font-size: .76rem; color: var(--bs-secondary-color); }

  /* --accent is the trip type's colour, set on .live-popup */
  .live-popup { min-width: 280px; font-size: .9rem; line-height: 1.35; }
  /* The strip takes the card's width, set by the rest of the content (up to the popup's
     maxWidth), and scrolls within it: it never widens the card itself */
  .live-popup .trainset-inline-scroll { width: 0; min-width: 100%; }
  .lp-head { display: flex; align-items: center; gap: 10px; margin: 0 18px 12px 0; }
  .lp-who { flex: 1; min-width: 0; font-weight: 700; font-size: 1.05rem; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  .lp-who:hover { text-decoration: underline; }
  .lp-type {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; flex: none; color: var(--accent);
  }
  .lp-type::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; opacity: .15; }
  .lp-operators { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .lp-operators img { max-height: 28px; max-width: 110px; object-fit: contain; }
  .lp-route { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .lp-route > div { min-width: 0; overflow-wrap: anywhere; }
  .lp-arrival { text-align: right; }
  .lp-time { color: var(--bs-secondary-color); font-weight: 400; font-size: .82rem; margin-top: 2px; }
  .lp-progress { height: 5px; margin-top: 8px; border-radius: 3px; background: var(--bs-secondary-bg); overflow: hidden; }
  .lp-progress > div { height: 100%; border-radius: 3px; background: var(--accent); }
  .lp-place { font-weight: 600; }
  .live-popup .popup-vehicle { margin-top: 12px; }

  /* Where the vehicle is, and every stop: the dashboard's current trip tile, in the type's colour */
  .lp-status {
    display: flex; align-items: center; gap: 12px; width: 100%;
    margin-top: 12px; padding: 8px 10px; border: 0; border-radius: 10px;
    background: var(--bs-tertiary-bg); color: inherit; text-align: left;
  }
  .lp-status:hover { background: var(--bs-secondary-bg); }
  .lp-status > div { flex: 1; min-width: 0; }
  .lp-status-label { font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; color: var(--bs-secondary-color); }
  .lp-status-name { font-weight: 700; overflow-wrap: anywhere; }
  .lp-chevron { color: var(--bs-secondary-color); transition: transform .2s; }
  .live-popup.stops-open .lp-chevron { transform: rotate(180deg); }
  .lp-marker {
    position: relative; flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bs-body-bg); color: var(--accent); font-size: .8rem;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .lp-marker.running { animation: lp-ring 1.5s infinite; }
  .lp-badge {
    position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #fbbf24; color: #3a2a00; font-size: .4rem;
  }
  @keyframes lp-ring {
    0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); }
    50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 10%, transparent); }
  }
  .lp-timeline {
    display: none;
    list-style: none;
    margin: 8px 0 0;
    position: relative; /* the stops' offsetTop, to open on the current one */
    /* room for the current dot's ring on the left; on the right for overlay scrollbars,
       which scrollbar-gutter does not reserve */
    padding: 6px 16px 0 8px;
    max-height: 220px;
    overflow-y: auto;
    font-size: .84rem;
  }
  .live-popup.stops-open .lp-timeline { display: block; }
  .lp-timeline li {
    position: relative; display: flex; justify-content: space-between; gap: 10px;
    padding: 0 0 9px 22px;
  }
  .lp-timeline li::before {
    content: ""; position: absolute; left: 5px; top: .55rem; bottom: -.55rem; width: 2px;
    background: linear-gradient(var(--accent) var(--f), var(--bs-border-color) var(--f));
  }
  .lp-timeline li:last-child::before { display: none; }
  .lp-timeline li.past > span:not(.lp-here):not(.lp-dot) { opacity: .55; }
  .lp-timeline li.current, .lp-timeline li.terminus { font-weight: 700; }
  .lp-dot {
    position: absolute; left: 6px; top: .55rem; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--bs-border-color); background: var(--bs-body-bg);
    transform: translate(-50%, -50%);
  }
  .lp-dot.passed { background: var(--accent); border-color: var(--accent); }
  .lp-dot.terminus { width: 15px; height: 15px; border-width: 3px; }
  .lp-dot.current { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }
  .lp-here {
    position: absolute; left: 6px; z-index: 1; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bs-body-bg); color: var(--accent); font-size: .5rem;
    animation: lp-ring 1.5s infinite;
  }
  .lp-tl-time { white-space: nowrap; color: var(--bs-secondary-color); }
  .lp-operators .lp-line { margin-left: auto; }
  .lp-line {
    padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: .8rem;
    background: var(--bs-secondary-bg); color: var(--bs-emphasis-color);
  }

  /* Panel top-left on desktop. On mobile, a summary bar at the bottom-left that
     expands upwards, clear of the popup that mobile pins to the top. */
  #live-stats {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 2;
    width: 260px;
    border-radius: 12px;
    background: light-dark(rgba(255,255,255,.95), rgba(33,37,41,.95));
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
    font-size: .88rem;
    overflow: hidden;
  }
  #live-stats:empty { display: none; }
  .ls-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 14px; border: 0; background: none; color: inherit; text-align: left;
  }
  .ls-title { font-weight: 700; font-size: 1rem; }
  .ls-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #dc3545; flex: none;
    animation: ls-pulse 1.6s ease-in-out infinite;
  }
  @keyframes ls-pulse { 50% { opacity: .35; } }
  .ls-total { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .ls-chips { display: none; gap: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .ls-chevron { color: var(--bs-secondary-color); transition: transform .2s; }
  #live-stats.open .ls-chevron { transform: rotate(180deg); }
  .ls-body { display: none; padding: 0 14px 12px; }
  #live-stats.open .ls-body { display: block; }
  .ls-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .ls-tiles > div { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: 8px; background: var(--bs-tertiary-bg); text-align: center; }
  .ls-tiles strong { font-size: 1rem; white-space: nowrap; }
  .ls-tiles small { color: var(--bs-secondary-color); font-size: .72rem; }
  .ls-flags { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bs-border-color); }
  .ls-group { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bs-border-color); }
  .ls-flag { display: inline-flex; align-items: center; }
  .ls-flag sup { margin-left: 1px; font-size: .65rem; font-weight: 700; color: var(--bs-secondary-color); }
  .ls-sea { font-size: .8rem; color: #3b82f6; cursor: context-menu; }
  .ls-flags .flag { font-size: 1.1rem !important; line-height: 1; }
  .ls-row { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; column-gap: 8px; padding: 3px 0; }
  .ls-row i { text-align: center; }
  .ls-count { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ls-bar { grid-column: 2 / 4; height: 4px; margin-top: 3px; border-radius: 2px; background: var(--bs-secondary-bg); overflow: hidden; }
  .ls-bar > div { height: 100%; border-radius: 2px; }
  @media (max-width: 700px) {
    /* Collapsed, it stops short of the attribution's (i) button */
    #live-stats { top: auto; bottom: 10px; width: auto; max-width: calc(100vw - 60px); }
    #live-stats:not(.open) .ls-title { display: none; }
    #live-stats:not(.open) .ls-chips { display: flex; }
    #live-stats:not(.open) .ls-total { margin-left: 0; padding-right: 8px; border-right: 1px solid var(--bs-border-color); }
    #live-stats.open { width: calc(100vw - 20px); }
    .ls-body { max-height: 50vh; overflow-y: auto; }
    /* The panel opens upwards here */
    .ls-chevron { transform: rotate(180deg); }
    #live-stats.open .ls-chevron { transform: none; }
  }

  .delay-time { color: light-dark(#dc3545, #db8a92); }
  .early-time  { color: light-dark(#28a745, #8fd69f); }

  /* Trainset strip in popups — same look as the public trip pages: images
     scaled to half natural size (uniform factor preserves relative proportions),
     default 16px scroll padding keeps the scrollbar clear of the name pills. */
  .publicTrainset .compo-strip { min-width: 0; }
  .publicTrainset .wagon-placeholder-img { height: 22px; }

  /* Aircraft shape. The global .airframe rule offsets it for a table row's
     baseline; in the popup it stands on its own line and must shrink to fit. */
  /* The shape doubles as the photo's click target; the photo replaces it in place. */
  .popup-media.is-clickable { cursor: pointer; }
  .popup-media.is-clickable:hover { opacity: 0.85; }
  .popup-media.is-loading { opacity: 0.5; }
  .popup-photo-btn { color: light-dark(#0d6efd, #7aa8eb); text-decoration: none; font-size: 0.95em; }
  .popup-photo-btn:hover, .popup-photo-btn.open { color: light-dark(#0a58ca, #7fa9e6); }

  /* The global .airframe rule offsets it for a table row's baseline; in the popup
     it is a block of its own. */
  .popup-media .airframe {
    position: static;
    margin-left: 0;
    display: block;
    height: auto;
    width: auto;
    max-height: 38px;
    max-width: 100%;
  }

  /* Type and registration read as one line; the flag lands in .popup-reg-flag later. */
  .popup-vehicle { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 4px; }
  .popup-vehicle-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 7px; }
  .popup-reg { display: inline-flex; align-items: baseline; gap: 4px; }
  .popup-reg-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
  }
  /* The global .flag rule jumps to 26px above 1500px — sized for table rows, not
     for a popup line. */
  .popup-vehicle .flag { font-size: 1.15em !important; line-height: 1; vertical-align: baseline !important; }
  .popup-vehicle-type + .popup-reg::before { content: "·"; color: light-dark(#bbb, var(--bs-tertiary-color)); margin-right: 3px; }
  /* Third-party thumbnails vary in size — cap and frame them so every popup matches. */
  .popup-media .vehiclePhotoContainer {
    max-width: min(260px, 100%);
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  .popup-media .vehiclePhotoContainer img { display: block; width: 100%; height: auto; }
  .popup-media .vehiclePhotoAttr { font-size: 0.72em; padding: .15em .3em; line-height: 1.2; }

  /* Keep popups within the viewport on narrow/mobile screens — the fixed
     540px maxWidth passed to maplibregl.Popup otherwise overflows small
     screens and the popup content itself needs to shrink & scroll with it. */
  .maplibregl-popup {
    max-width: calc(100vw - 20px) !important;
    /* Over the zoom buttons, which would otherwise cover its edge */
    z-index: 3;
  }
  .maplibregl-popup-content {
    max-width: calc(100vw - 20px);
    max-height: 70vh;
    overflow-y: auto;
    box-sizing: border-box;
  }
  @media (max-width: 700px) {
    .maplibregl-popup-content { min-width: 0; }
    .publicTrainset .trainset-inline-scroll { max-width: 100% !important; }

    /* Pin the popup to the top of the screen so it's fully visible and
       spans the width of the viewport (minus a small margin) instead of
       being squeezed against the marker/screen edges. It stays put (no
       anchor/tip, doesn't follow the map) until closed via the ×. */
    .maplibregl-popup {
      position: fixed !important;
      top: 10px !important;
      left: 10px !important;
      right: 10px !important;
      width: auto !important;
      max-width: none !important;
      transform: none !important;
    }
    .maplibregl-popup-tip { display: none !important; }
    .maplibregl-popup-content {
      width: 100%;
      max-width: none;
      max-height: calc(100vh - 20px);
    }
  }
</style>

<div class="spinner-container">
  <div class="lds-spinner">
    <div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="{{ url_for('static', filename='js/maplibre-utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/vehicle_display.js') }}"></script>
<script src="{{ static_autoversion(filename='js/trip_progress.js') }}"></script>
<script src="{{ static_autoversion(filename='js/live_motion.js') }}"></script>
<script src="{{ static_autoversion(filename='js/user_avatar.js') }}"></script>

<script>
var logosList   = {{ logosList | tojson }};
var apiEndpoint = "{{ api_endpoint }}";
var liveMapTitle = {{ live_map | tojson }};
var stopLabels = {{ {'next': ctNextStop, 'at': ctAtStop} | tojson }};
var statsLabels = {{ {
  'countries': crossedCountries, 'continents': liveContinents, 'delays': delaysToggle,
  'country': liveCountry, 'continent': liveContinent, 'delay': liveDelay, 'sea': internationalWaters,
} | tojson }};
const pluralRules = new Intl.PluralRules(langId);
var continentLabels = {{ {
  'europe': EU, 'africa': AF, 'asia': AS, 'north_america': NA, 'south_america': SA, 'oceania': OC,
} | tojson }};
const CONTINENT_STYLE = {
  europe:        { icon: 'fa-earth-europe',   color: '#3b82f6' },
  africa:        { icon: 'fa-earth-africa',   color: '#f59e0b' },
  asia:          { icon: 'fa-earth-asia',     color: '#ef4444' },
  north_america: { icon: 'fa-earth-americas', color: '#10b981' },
  south_america: { icon: 'fa-earth-americas', color: '#84cc16' },
  oceania:       { icon: 'fa-earth-oceania',  color: '#8b5cf6' },
  antarctica:    { icon: 'fa-snowflake',      color: '#06b6d4' },
};
var typeLabels = {{ {
  'train': train, 'tram': tram, 'metro': metro, 'bus': bus, 'car': car, 'cycle': cycle,
  'scooter': scooter, 'funicular': funicular, 'rail': rail, 'ski': ski, 'walk': walk,
  'air': air, 'ferry': ferry, 'aerialway': aerialway, 'other': other,
  'accommodation': accommodation, 'restaurant': restaurant, 'poi': poi,
} | tojson }};
// Guests only get initials: who may see a Discord picture depends on the viewer
var avatarsEndpoint = {{ (url_for('user_avatars', username=username) if session.get('logged_in') else none) | tojson }};

/* ── datetime helpers ────────────────────────────────────────────────────── */
function formatDT(iso) {
  if (!iso) return { date: '-', time: '-' };
  const d = new Date(iso);
  return {
    date: d.toLocaleDateString(),
    time: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };
}
function daysDifference(d0, d1) {
  return Math.round((new Date(d1).setHours(12) - new Date(d0).setHours(12)) / 86400000);
}
function addDelayToISO(iso, delaySec) {
  if (!iso) return iso;
  const d = new Date(iso);
  d.setSeconds(d.getSeconds() + Number(delaySec || 0));
  return d.toISOString();
}
function formatDayDiff(iso, startDT) {
  const diff = daysDifference(startDT, iso);
  return diff > 0 ? ` (+${diff})` : diff < 0 ? ` (${diff})` : '';
}
function withDelayDisplay(iso, delaySec, startDT) {
  const scheduled = formatDT(iso).time + formatDayDiff(iso, startDT);
  const delay = Number(delaySec || 0);
  if (!delay) return scheduled;
  const actualISO = addDelayToISO(iso, delay);
  const actual = formatDT(actualISO).time + formatDayDiff(actualISO, startDT);
  const cls = delay > 0 ? 'delay-time' : 'early-time';
  return `<s>${scheduled}</s> <span class="${cls}">${actual}</span>`;
}

/* ── trainset display ────────────────────────────────────────────────────── */
const WAGONS_BASE = "{{ url_for('static', filename='images/wagons') }}";

function wagonImgSrc(u) {
  const side = u._side || 'L';
  const ext  = u.image_ext || 'gif';
  if (u.image_type === 'sides')   return `${WAGONS_BASE}/${u.image}${side === 'R' ? '_R' : '_L'}.${ext}`;
  if (u.image_type === 'sides_L') return `${WAGONS_BASE}/${u.image}_L.${ext}`;
  if (u.image_type === 'sides_R') return `${WAGONS_BASE}/${u.image}_R.${ext}`;
  return `${WAGONS_BASE}/${u.image}.${ext}`;
}

function wagonPlaceholderSrc(isFirst, isLast, phType) {
  const suffix = phType || ((isFirst && isLast) ? 'loco_both' : isFirst ? 'loco_l' : isLast ? 'loco_r' : 'mid');
  return `${WAGONS_BASE}/placeholder_${suffix}.svg`;
}

function trainsetHTML(trip) {
  const ts = trip.trainset;
  if (!ts || !ts.units || !ts.units.length) return '';
  const wagons = ts.units.map((u, i) => {
    const isFirst = i === 0, isLast = i === ts.units.length - 1;
    const ph = wagonPlaceholderSrc(isFirst, isLast, u._phType);
    const img = u.image
      ? `<img src="${wagonImgSrc(u)}"${u.px_per_meter ? ` data-ppm="${u.px_per_meter}"` : ''} title="${esc(u.label || '')}" onerror="this.src='${ph}';this.className='wagon-placeholder-img';this.style.height='';this.onerror=null;">`
      : `<img class="wagon-placeholder-img" src="${ph}">`;
    const lbl = esc(u.label || '');
    return `<div class="compo-wagon ts-unit">${img}<span class="compo-coach-no ts-nom ts-nom-inline" title="${lbl}">${lbl}</span></div>`;
  }).join('');
  const attr = _attributionText(ts.units);
  const label = ts.label ? `<div class="ts-inline-label">${esc(ts.label)}</div>` : '';
  return `<div class="publicTrainset ts-inline-wrapper" style="margin-top:6px;">
      <div class="trainset-inline-scroll"${attr ? ` title="${attr}"` : ''}>
        <div class="compo-strip ts-strip">${wagons}</div>
      </div>${label}</div>`;
}

/* ── vehicle display (aircraft / vessel) ─────────────────────────────────── */
const AIRLINERS_BASE = "{{ url_for('static', filename='images/airliners') }}".replace(/\/$/, '');
const REGISTRATIONS_URL = "{{ url_for('static', filename='data/registrations.json') }}";
const VESSEL_PHOTO_URL = "{{ url_for('getVesselPhoto') }}";

// The popup body is built as a string, so anything async (the shape, the photo, the
// registration flag) is emitted as an empty slot and filled by hydrateVehicle once
// the popup is in the DOM. Photo lookups therefore only ever run on a real click.
function vehicleHTML(trip) {
  const isAir = ['air', 'helicopter'].includes(trip.type);
  const isFerry = trip.type === 'ferry';
  if (!isAir && !isFerry) return '';

  const reg = (trip.reg || '').trim();
  const info = isAir ? airframeInfo(trip) : null;
  if (!info && !reg) return '';

  const type = info ? `<span class="popup-vehicle-type">${esc(info.label)}</span>` : '';
  // A ship is logged by name, IMO or MMSI and always shown by name (migration 0054);
  // `vessel_name` is the resolved one, absent for a vessel we hold no record of.
  const vesselName = isFerry ? (trip.vessel_name || '').trim() : '';
  const regEl = reg
    ? `<span class="popup-reg" data-reg="${esc(reg)}" data-kind="${isAir ? 'air' : 'ship'}"
             data-country="${esc(trip.vessel_country || '')}" data-name="${esc(vesselName)}">
         <span class="popup-reg-flag"></span><span class="popup-reg-text">${esc(vesselName || reg)}</span>
       </span>`
    : '';
  // The shape shows by default and doubles as the photo's click target; with no
  // shape (no artwork, or a ship) a camera button in the header stands in.
  const media = `<div class="popup-media" data-code="${info ? esc(info.code) : ''}"></div>`;
  return `<div class="popup-vehicle">
            <div class="popup-vehicle-head">${type}${regEl}</div>
            ${media}
          </div>`;
}

function hydrateVehicle(popupEl) {
  popupEl.querySelectorAll('.popup-media').forEach(media => {
    const code = media.getAttribute('data-code');
    if (!code) return;
    const img = loadAirframe(AIRLINERS_BASE, code);
    if (img) media.appendChild(img);
  });

  popupEl.querySelectorAll('.popup-reg').forEach(regEl => {
    const reg = regEl.getAttribute('data-reg');
    const isAir = regEl.getAttribute('data-kind') === 'air';
    const flagEl = regEl.querySelector('.popup-reg-flag');
    const media = regEl.closest('.popup-vehicle').querySelector('.popup-media');
    const hasShape = !!media.getAttribute('data-code');

    // getTooltipNew only emits the markup; Bootstrap still has to bind it.
    const showFlag = (country) => {
      if (!country || !flagEl || !flagEl.isConnected) return;
      flagEl.innerHTML = getTooltipNew(country);
      $(flagEl).find('[data-toggle="tooltip"]').tooltip();
    };

    // Both kinds get their flag up front: aircraft from the registration prefix,
    // ships from the vessel join. A vessel we hold no record of has no country until
    // something fetches it — the photo response fills it in below.
    const knownCountry = regEl.getAttribute('data-country');
    const knownName = regEl.getAttribute('data-name');
    if (isAir) {
      loadRegistrations(REGISTRATIONS_URL)
        .then(registrations => showFlag(regCountry(reg, registrations)));
    } else {
      showFlag(knownCountry);
    }

    // The photo replaces the shape on click rather than stacking beside it (they
    // say the same thing), which also keeps the lookup off the popup-open path.
    // The camera icon shows for aircraft and ships alike so the two read identically;
    // where a shape exists it becomes an additional, larger target for the same action.
    const btn = document.createElement('a');
    btn.href = 'javascript:void(0);';
    btn.className = 'popup-photo-btn';
    btn.innerHTML = '<i class="fas fa-camera"></i>';
    regEl.parentNode.appendChild(btn);
    if (hasShape) media.classList.add('is-clickable');

    let photoEl = null, showingPhoto = false, pending = false;

    const siblings = () => Array.from(media.children).filter(el => el !== photoEl);

    const swap = (toPhoto) => {
      showingPhoto = toPhoto;
      if (!photoEl) return;
      siblings().forEach(el => { el.style.display = toPhoto ? 'none' : ''; });
      photoEl.style.display = toPhoto ? '' : 'none';
      btn.classList.toggle('open', toPhoto);
    };

    const toggle = (e) => {
      if (e) e.stopPropagation();
      if (photoEl) { swap(!showingPhoto); return; }
      if (pending) return;
      pending = true;
      media.classList.add('is-loading');
      const promise = isAir ? fetchAircraftPhoto(reg)
                            : fetchVesselPhoto(VESSEL_PHOTO_URL, reg);
      promise.then(photo => {
        pending = false;
        media.classList.remove('is-loading');
        // The popup may have been closed/replaced while the request was in flight.
        if (!media.isConnected) return;
        if (!isAir && photo) {
          if (!knownCountry) showFlag(photo.country);
          // The lookup may know the ship's name where the join did not.
          const text = regEl.querySelector('.popup-reg-text');
          if (!knownName && photo.name && text) text.textContent = photo.name;
        }
        if (!photo) {                       // nothing found — retire the affordance
          media.classList.remove('is-clickable');
          btn.remove();
          return;
        }
        photoEl = document.createElement('div');
        photoEl.innerHTML = photoHTML(photo);
        media.appendChild(photoEl);
        // Cached photo rows can outlive their file on disk (the whole local cache
        // is absent in dev) — drop the frame rather than show a broken icon.
        const pic = photoEl.querySelector('img');
        if (pic) pic.addEventListener('error', () => {
          const orphans = siblings();
          photoEl.remove();
          photoEl = null;
          showingPhoto = false;
          orphans.forEach(el => { el.style.display = ''; });
          btn.remove();
        });
        swap(true);
      });
    };

    btn.addEventListener('click', toggle);
    if (hasShape) media.addEventListener('click', toggle);
  });
}

/* ── trip helpers ────────────────────────────────────────────────────────── */
function getTypeColor(type) {
  const t = MapLibreUtils.MapConfig.transportTypes.find(t => t.id === type);

function getPopupContent(tripObj) {

      <a class="lp-who" href="${profileUrl}" target="_blank">${esc(tripObj.username)}</a>
      ${typeBadge}
    </div>`;

  if (STAY_ICONS[trip.type]) {
    return `
      <div class="live-popup" style="--accent:var(--bs-secondary-color)">
        ${header}
        <div class="lp-place">${origin}</div>
        <div class="lp-time">${startTime} – ${endTime}</div>

  }

  let operatorParts = [];
  if (trip.multi_operators) {
    trip.multi_operators.forEach(op => {
      operatorParts.push(op.logo_url
        ? `<div class="popupInfo operator_popupInfo" popupinfo_content="${op.operator_name}"><img src="/static/${op.logo_url}" alt="${op.operator_name}"></div>`
        : `<span>${op.operator_name}</span>`);
    });
  } else if (trip.logo_url) {
    operatorParts.push(`<div class="popupInfo operator_popupInfo" popupinfo_content="${trip.operator || ''}"><img src="/static/${trip.logo_url}" alt="${trip.operator || ''}"></div>`);
  } else if (trip.operator) {
    String(trip.operator).split(',').map(s => s.trim()).forEach(op => {
      operatorParts.push(logosList[op]
        ? `<div class="popupInfo operator_popupInfo" popupinfo_content="${op}"><img src="/static/${logosList[op]}" alt="${op}"></div>`
        : `<span>${op}</span>`);
    });
  }

  const { start, end } = tripWindow(trip);
  const progress = Math.min(1, Math.max(0, (Date.now() - start) / (end - start))) || 0;

  return `
    <div class="live-popup" style="--accent:${getTypeColor(type)}">
      ${header}
      ${trip.line_name || operatorParts.length ? `
        <div class="lp-operators">
          ${operatorParts.join('')}
          ${trip.line_name ? `<span class="lp-line">${esc(trip.line_name)}</span>` : ''}
        </div>` : ''}
      <div class="lp-route">
        <div>${origin}<div class="lp-time">${startTime}</div></div>
        <div class="lp-arrival">${destination}<div class="lp-time">${endTime}</div></div>
      </div>
      <div class="lp-progress"><div style="width:${progress * 100}%"></div></div>
      ${stopsHTML(trip, start, end, startTime, endTime)}
      ${vehicleHTML(trip)}

    </div>`;
}

// Departure and arrival, ms, delays included
function tripWindow(trip) {
  const ms = v => new Date(String(v).replace(' ', 'T') + 'Z').getTime();
  return {
    start: ms(trip.utc_start_datetime) + Number(trip.departure_delay || 0) * 1000,
    end:   ms(trip.utc_end_datetime)   + Number(trip.arrival_delay || 0) * 1000,
  };
}

// The trip's named stops, ends included. Those without a time get one estimated between
// their timed neighbours (`untimed`), only to place the vehicle; it is never shown.
function tripStops(trip, start, end) {
  const timed = TripProgress.timedStops(trip);
  let wps = [];
  try { wps = JSON.parse(trip.waypoints || '[]') || []; } catch (e) {}
  let t = 0;
  const mid = wps.filter(w => w && w.stop && w.stop.name).map(w => {
    if (timed[t] && timed[t].name === w.stop.name) return timed[t++];
    return { name: w.stop.name, untimed: true };
  });
  const stops = [
    { name: trip.origin_station, arr: start, dep: start },
    ...mid,
    { name: trip.destination_station, arr: end, dep: end },
  ];
  let a = 0;
  stops.forEach((st, j) => {
    if (!st.untimed) { a = j; return; }
    let b = j + 1;
    while (stops[b].untimed) b++;
    st.arr = st.dep = stops[a].dep + (stops[b].arr - stops[a].dep) * (j - a) / (b - a);
  });
  return stops;
}

// Next stop (or the one the vehicle stands at) and, unfolded, the whole timeline
function stopsHTML(trip, start, end, startTime, endTime) {
  const stops = tripStops(trip, start, end);
  if (stops.length < 3) return '';
  const now = Date.now(), last = stops.length - 1;
  let i = 0;
  while (i < last && stops[i + 1].arr <= now) i++;
  const atStop = now < stops[i].dep || i === last;
  const f = atStop ? 0 : Math.min(1, (now - stops[i].dep) / Math.max(1, stops[i + 1].arr - stops[i].dep));
  const isPast = n => n < i || (n === i && !atStop);
  const isTerminus = n => n === 0 || n === last;

  const fmt = (st, which) => {
    if (st.untimed) return '';
    const ms = st[which];
    const t = new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: st.tz || undefined });
    const late = Math.round((ms - st[which + 'Sched']) / 60000);
    return late > 0 ? `${t} <span class="delay-time">+${late}'</span>` : t;
  };
  const rel = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  const inMin = ms => {
    const m = Math.max(0, Math.round((ms - now) / 60000));
    return m ? rel.format(m, 'minute') : rel.format(0, 'second');
  };
  const fullTime = (st, n) => n === 0 ? startTime : n === last ? endTime
    : Math.round(st.arr / 60000) === Math.round(st.dep / 60000) ? fmt(st, 'arr')
    : `${fmt(st, 'arr')} – ${fmt(st, 'dep')}`;

  const st = atStop ? stops[i] : stops[i + 1];
  const stIndex = atStop ? i : i + 1;
  const when = st.untimed ? [] : atStop
    ? (i === last ? [fullTime(st, i)] : [fmt(st, 'dep'), inMin(st.dep)])
    : [fullTime(st, stIndex).split(' – ')[0], inMin(st.arr)];

  const rows = stops.map((s, n) => {
    const fill = n < i ? 100 : n === i ? f * 100 : 0;
    const dot = 'lp-dot' + (n <= i ? ' passed' : '') + (isTerminus(n) ? ' terminus' : '')
      + (n === i && atStop ? ' current' : '');
    return `<li class="${isPast(n) ? 'past' : n === i ? 'current' : ''}${isTerminus(n) ? ' terminus' : ''}" style="--f:${fill}%">`
      + `<span class="${dot}"></span>`
      + (n === i && !(atStop && n === last) ? `<span class="lp-here" style="top:calc(.55rem + ${fill}%);transform:translate(-50%,-50%) rotate(90deg)"><i class="fa-solid fa-chevron-right"></i></span>` : '')
      + `<span>${n === 0 || n === last ? s.name : esc(s.name)}</span><span class="lp-tl-time">${fullTime(s, n)}</span></li>`;
  }).join('');

  return `
    <button type="button" class="lp-status" data-current="${i}">
      <span class="lp-marker${atStop ? '' : ' running'}"><i class="${typeIcon(trip.type === 'helicopter' ? 'air' : trip.type).icon}"></i>
        ${atStop && i < last ? '<span class="lp-badge"><i class="fa-solid fa-pause"></i></span>' : ''}</span>
      <div>
        <div class="lp-status-label">${esc(atStop ? stopLabels.at : stopLabels.next)}</div>
        <div class="lp-status-name">${stIndex === 0 || stIndex === last ? st.name : esc(st.name)}</div>
        <div class="lp-time">${when.filter(Boolean).join(' · ')}</div>
      </div>
      <i class="fa-solid fa-chevron-down lp-chevron"></i>
    </button>
    <ol class="lp-timeline">${rows}</ol>`;
}

/* ── motion ──────────────────────────────────────────────────────────────── */
// One dashes layer per type, each with its own look and pace (see live_motion.js); only the
// types on the map are stepped. Pins move with the clock in between refreshes: as often as
// the zoom makes it visible, every frame while one glides to where fresh data put it.
const FUTURE_TYPES = MapLibreUtils.MapConfig.transportTypes.map(t => t.id);
const futureLayerType = type => FUTURE_TYPES.includes(type) ? type : 'other';
// The dashes start at the pin, but every cut re-tiles all the paths in the source. So the
// trips whose route crosses the view, when there are only a few of them (zoomed in, where it
// would show), are drawn apart: their dashes are worked out every frame, from exactly where
// the pin is, true to scale when zoomed in (LiveMotion.dashLines), on a canvas over the map
// (LiveMotion.overlay), redrawn after each of its frames. The
// others are dash arrays, re-cut once a pin has got a few pixels ahead of its dashes (which
// zoomed out takes ages), at most once a second, and at least every FUTURE_RECUT_MS.
const FUTURE_RECUT_MS = 15000, MIN_RECUT_MS = 1000, MAX_DRIFT_PX = 3, NEAR_MAX = 8;
let futureLayers = new Set(); // [layer id, type] of the dash array layers with something to step
let nearKeys = new Set();
let lastMove = -Infinity, lastCut = 0, glidingUntil = 0, fastest = 1, drift = 0;

function animate(ts) {
  // Every frame: an unchanged dash array is a no-op in setPaintProperty
  if (!LiveMotion.reduced) {
    futureLayers.forEach(([id, type]) => {
      try { map.setPaintProperty(id, 'line-dasharray', LiveMotion.dashArray(type, ts)); } catch (_) {}
    });
  }
  const interval = LiveMotion.reduced ? FUTURE_RECUT_MS : LiveMotion.moveInterval(map, fastest);
  if (ts - lastMove >= interval || Date.now() < glidingUntil) {
    lastMove = ts;
    movePins();
  }
  if (ts - lastCut >= FUTURE_RECUT_MS || (drift > MAX_DRIFT_PX && ts - lastCut >= MIN_RECUT_MS)) {
    lastCut = ts;
    cutFuture(Date.now());
  }
  updateNear();
  if (nearKeys.size) map.triggerRepaint(); // drawNear runs after it
  requestAnimationFrame(animate);
}

/* ── stats ───────────────────────────────────────────────────────────────── */
const STAY_ICONS = { accommodation: 'fa-bed', restaurant: 'fa-utensils', poi: 'fa-map-location-dot' };

function typeIcon(type) {
  const t = MapLibreUtils.MapConfig.transportTypes.find(t => t.id === type);
  return {

const statsEl = document.getElementById('live-stats');
statsEl.classList.toggle('open', !matchMedia('(max-width: 700px)').matches);
statsEl.addEventListener('click', e => {

// `places`: [country, continent] under each pin right now (country null at sea), from the server
function renderStats(trips, places) {
  const counts = {};
  trips.forEach(({ trip }) => {
    const type = trip.type === 'helicopter' ? 'air' : trip.type;
    counts[type] = (counts[type] || 0) + 1;
  });
  const people = new Set(trips.map(t => t.username)).size;
  if (!people) { statsEl.innerHTML = ''; return; }

  const moving = trips.filter(({ trip }) => !STAY_ICONS[trip.type]);
  const delayed = moving.filter(({ trip }) => Math.max(Number(trip.departure_delay || 0), Number(trip.arrival_delay || 0)) >= 60).length;
  const tally = values => values.reduce((acc, v) => (v && (acc[v] = (acc[v] || 0) + 1), acc), {});
  const countries = Object.entries(tally(places.map(p => p[0]))).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const continents = Object.entries(tally(places.map(p => p[1]))).sort((a, b) => b[1] - a[1]);
  const atSea = places.filter(p => !p[0]).length;

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = sorted[0][1];
  const chips = sorted.map(([type, n]) => {
    const { icon, color } = typeIcon(type);
    return `<span><i class="${icon}" style="color:${color}"></i> ${n}</span>`;
  });
  const tile = (n, one, many) => `<div><strong>${n}</strong><small>${esc(pluralRules.select(n) === 'one' ? one : many)}</small></div>`;
  const row = (icon, color, label, n, max) => `<div class="ls-row">
      <i class="${icon}" style="color:${color}"></i>
      <span>${esc(label)}</span>
      <span class="ls-count">${n}</span>
      <div class="ls-bar"><div style="width:${n / max * 100}%;background:${color === 'inherit' ? 'var(--bs-secondary-color)' : color}"></div></div>
    </div>`;
  const rows = sorted.map(([type, n]) => {
    const { icon, color } = typeIcon(type);
    return row(icon, color, typeLabels[type] || type, n, max);
  });
  const continentRows = continents.map(([c, n]) => {
    const { icon, color } = CONTINENT_STYLE[c] || { icon: 'fa-earth-americas', color: 'inherit' };
    return row(`fa-solid ${icon}`, color, continentLabels[c] || regionNames.of('AQ'), n, continents[0][1]);
  });
  const flags = countries.map(([cc, n]) => `<span class="ls-flag">${getTooltipNew(cc)}${n > 1 ? `<sup>${n}</sup>` : ''}</span>`);
  if (atSea) flags.push(`<span class="ls-sea" data-toggle="tooltip" title="${esc(statsLabels.sea)}"><i class="fa-solid fa-water"></i> ${atSea}</span>`);
  statsEl.innerHTML = `
    <button type="button" class="ls-head">
      <span class="ls-dot"></span>
      <span class="ls-title">${esc(liveMapTitle)}</span>
      <span class="ls-total"><i class="fa-solid fa-users"></i> ${people}</span>
      <span class="ls-chips">${chips.join('')}</span>
      <i class="fa-solid fa-chevron-down ls-chevron"></i>
    </button>
    <div class="ls-body">
      <div class="ls-tiles">
        ${tile(countries.length, statsLabels.country, statsLabels.countries)}
        ${tile(continents.length, statsLabels.continent, statsLabels.continents)}
        ${tile(delayed, statsLabels.delay, statsLabels.delays)}
      </div>
      ${rows.join('')}
      ${continentRows.length ? `<div class="ls-group">${continentRows.join('')}</div>` : ''}
      ${flags.length ? `<div class="ls-flags">${flags.join('')}</div>` : ''}
    </div>`;
  $(statsEl).find('[data-toggle="tooltip"]').tooltip();
}

/* ── map state ───────────────────────────────────────────────────────────── */
let map;
// trip uid -> { tripObj, type, coords, liveJunction, fixAt, marker, glideFrom, glideAt }
const pinsByTrip  = new Map();
let pinOfTrip     = new Map(); // every trip's uid -> its pin, a group trip's members included
// The last render's, and this render's pin keys: when a group trip splits up, whoever
// carries on takes over its pin, so it glides on from there rather than popping up anew
let prevPinOfTrip = new Map(), renderKeys = new Set();
const allMarkers  = () => [...pinsByTrip.values()].map(p => p.marker);
let lastSignature = null;
let firstLoad     = true;
let activePopup   = null;
let activePopupPin = null; // the pin the popup follows, if it was opened from one

const emptyFC = () => ({ type: 'FeatureCollection', features: [] });

/* ── popup handling ──────────────────────────────────────────────────────── */
// Only one popup is ever shown at a time: opening a new one always closes
// the previous one. closeOnClick (default) lets clicking elsewhere on the
// map dismiss it too; closeOnMove is disabled so panning doesn't close it.
function openPopup(lngLat, tripObj, pin) {
  if (activePopup) activePopup.remove();
  const popup = new maplibregl.Popup({ offset: 25, maxWidth: '540px', closeOnMove: false, focusAfterOpen: false })
    .setLngLat(lngLat)
    .setHTML(getPopupContent(tripObj))
    .addTo(map);
  activePopup = popup;
  activePopupPin = pin || null;
  popup.on('close', () => { if (activePopup === popup) activePopupPin = null; });
  paintUserAvatars(activePopup.getElement(), avatarsEndpoint);
  // Size the trainset strip against its own median height (see normalizeStrip).
  const popupEl = activePopup.getElement();
  if (popupEl) {
    popupEl.querySelectorAll('.compo-strip').forEach(function (strip) {
      normalizeStrip(strip, { target: 22, min: 15, max: 38 });
    });
    hydrateVehicle(popupEl);
    const status = popupEl.querySelector('.lp-status');
    if (status) status.addEventListener('click', () => {
      const box = status.closest('.live-popup');
      box.classList.toggle('stops-open');
      const list = box.querySelector('.lp-timeline');
      const cur = list.children[status.dataset.current];
      if (box.classList.contains('stops-open')) list.scrollTop = cur.offsetTop - list.clientHeight / 3;
    });
  }
}

/* ── rendering ───────────────────────────────────────────────────────────── */
// Single source of truth for "where along the path are we", used both for the pin and for
// the start of the dashes so the two always agree: the timetable position (stops, dwell
// times and delays included, see trip_progress.js), or for a live-tracked flight its last
// real fix, carried on along the estimated remainder.
function pinTarget(pin, now) {
  if (pin.coords.length === 1) return { index: 0, point: pin.coords[0], progress: 0 };
  const pos = pin.liveJunction !== null
    ? TripProgress.extrapolate(pin.tripObj.trip, pin.coords, pin.liveJunction, pin.fixAt, { now })
    : TripProgress.position(pin.tripObj.trip, pin.coords, { now });
  return pos || { index: 0, point: pin.coords[0], progress: 0 };
}

// `coords` must be the same [lng, lat] array that was drawn (geodesic-expanded
// for air routes), otherwise the pin lands on the raw 2-point path start.
// `liveJunction` is the index of the aircraft's last real position, known only for a
// live-tracked flight. Pins are kept across refreshes, so they can carry on moving.
function placePin(tripObj, coords, liveJunction, now) {
  const key  = tripObj.trip.uid;
  const type = (tripObj.trip.type === 'helicopter') ? 'air' : tripObj.trip.type;
  let pin = pinsByTrip.get(key);
  if (!pin) {
    const prev = (tripObj.members || [tripObj]).map(m => prevPinOfTrip.get(m.trip.uid))
      .find(p => p && p.type === type && !renderKeys.has(p.key) && pinsByTrip.get(p.key) === p);
    if (prev) {
      pinsByTrip.delete(prev.key);
      pinsByTrip.set(key, prev);
      pin = prev;
    }
  }
  if (pin && pin.type !== type) { pinsByTrip.delete(key); pin.marker.remove(); pin = null; }

  const shown = pin && pin.marker.getLngLat().toArray();
  if (!pin) {
    pin = { type };
    // Sub-pixel, or a slow pin moves in visible one-pixel steps
    pin.marker = new maplibregl.Marker({ color: getTypeColor(type), subpixelPositioning: true });
    pin.marker.getElement().addEventListener('click', e => {
      e.stopPropagation();
      openPopup(pin.marker.getLngLat(), pin.tripObj, pin);
    });
    pinsByTrip.set(key, pin);
  }
  pin.key = key;
  // A live fix is as old as the server's copy of it, when it says so
  const fixAt = tripObj.trip.live_updated ? tripObj.trip.live_updated * 1000 : now;
  Object.assign(pin, { tripObj, coords, liveJunction, fixAt });
  (tripObj.members || [tripObj]).forEach(m => pinOfTrip.set(m.trip.uid, pin));

  // The pin's head: the traveller's avatar, or a group trip's head count. Redone when it
  // changes, as a pin taken over from a group (or by one) carries someone else's.
  const count = (tripObj.members || []).length;
  const head = count > 1 ? `count:${count}` : `user:${tripObj.username}`;
  if (pin.head !== head) {
    pin.head = head;
    pin.marker.getElement().querySelectorAll('.user-avatar, .pin-count').forEach(el => el.remove());
    const el = document.createElement('span');
    if (count > 1) {
      el.className = 'pin-count';
      el.textContent = count;
    } else {
      el.className = 'user-avatar';
      el.dataset.username = tripObj.username;
    }
    pin.marker.getElement().append(el);
  }
  // What the dashes come along at when zoomed in: the trip's own average speed
  pin.speed = liveJunction === null ? TripProgress.averageSpeed(tripObj.trip, coords) : null;

  const target = pinTarget(pin, now).point;
  if (shown) {
    LiveMotion.startGlide(pin, shown);
    glidingUntil = now + LiveMotion.GLIDE_MS;
  } else {
    pin.marker.setLngLat(target).addTo(map);
  }
}

function movePins() {
  const now = Date.now();
  drift = 0;
  pinsByTrip.forEach((pin, key) => {
    if (pin.coords.length < 2) return;
    pin.pos = pinTarget(pin, now);
    pin.shown = LiveMotion.glide(pin, pin.pos.point);
    pin.marker.setLngLat(pin.shown);
    if (pin.cutPoint && !nearKeys.has(key)) {
      const a = map.project(pin.cutPoint), b = map.project(pin.pos.point);
      drift = Math.max(drift, Math.hypot(a.x - b.x, a.y - b.y));
    }
  });
  if (activePopup && activePopupPin) activePopup.setLngLat(activePopupPin.marker.getLngLat());
}

// The trips whose route crosses the view, if there are few enough to draw as geometry. A
// change of set re-cuts the others, so the same trip is never in both.
function updateNear() {
  const inView = [];
  pinsByTrip.forEach((pin, key) => {
    if (pin.coords.length >= 2 && pin.pos && pin.pos.progress < 1 && LiveMotion.routeInView(pin.coords, map)) {
      inView.push(key);
    }
  });
  const near = new Set(inView.length <= NEAR_MAX ? inView : []);
  if (near.size !== nearKeys.size || [...near].some(k => !nearKeys.has(k))) {
    nearKeys = near;
    cutFuture(Date.now());
  }
}

// The part still to travel, from `point` on. null once there's nothing left.
function futureCoords(pin, pos, point) {
  const future = [point].concat(pin.coords.slice(pos.index + 1));
  return future.length < 2 || pos.progress >= 1 ? null : future;
}

// Every trip not in the near source, from where the clock has it now
function cutFuture(now) {
  const features = [];
  drift = 0;
  pinsByTrip.forEach((pin, key) => {
    if (pin.coords.length < 2 || nearKeys.has(key)) return;
    const pos = pinTarget(pin, now);
    pin.cutPoint = pos.point;
    const future = futureCoords(pin, pos, pos.point);
    if (!future) return;
    features.push({
      type: 'Feature',
      // Reversed, so the dashes don't jump when it's cut (see LiveMotion.dashArray)
      geometry: { type: 'LineString', coordinates: future.reverse() },
      properties: { type: futureLayerType(pin.type) }
    });
  });
  map.getSource('live-future').setData({ type: 'FeatureCollection', features });
  futureLayers = new Set();
  new Set(features.map(f => f.properties.type))
    .forEach(type => futureLayers.add([`live-future-${type}`, type]));
}

// The trips in view, from exactly where their pin was just drawn
let nearOverlay = null;
function drawNear(ts) {
  const items = [];
  nearKeys.forEach(key => {
    const pin = pinsByTrip.get(key);
    if (!pin || !pin.pos || pin.pos.progress >= 1) return;
    pin.dashState = pin.dashState || {};
    items.push({
      key, coords: pin.coords, from: { index: pin.pos.index, point: pin.shown },
      type: pin.type, speed: pin.speed, state: pin.dashState
    });
  });
  nearOverlay.draw(LiveMotion.dashLines(items, map, ts).map(geometry => ({ geometry })));
}

// Several people on the same train each log their own trip: same type, origin, destination
// and timetabled times, routes of about the same length (routing quirks aside). They are
// shown as one group trip, placed from its best-informed member: a live-tracked flight, else
// the one with the most timed stops, else the most detailed route. The others go along as
// `members` (the lead included, first), and lend it a trainset if it has none.
const GROUP_LENGTH_TOLERANCE = 0.15;
function pathLength(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const [lat1, lng1] = path[i - 1], [lat2, lng2] = path[i], rad = Math.PI / 180;
    const h = Math.sin((lat2 - lat1) * rad / 2) ** 2 +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lng2 - lng1) * rad / 2) ** 2;
    total += 12742000 * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  return total;
}
function groupSameTrips(trips) {
  const informed = t => [t.trip.live_tracked ? 1 : 0, TripProgress.timedStops(t.trip).length, t.path.length];
  const better = (a, b) => {
    const x = informed(a), y = informed(b);
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] > y[i];
    return false;
  };
  const buckets = new Map(), out = [];
  trips.forEach(t => {
    const { trip } = t;
    if (STAY_ICONS[trip.type] || t.path.length < 2) { out.push(t); return; }
    const key = [trip.type, trip.origin_station, trip.destination_station,
                 trip.utc_start_datetime, trip.utc_end_datetime].join('|');
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push({ t, length: pathLength(t.path) });
  });
  buckets.forEach(list => {
    const groups = [];
    list.forEach(item => {
      const g = groups.find(g => Math.abs(g[0].length - item.length) <=
                                 GROUP_LENGTH_TOLERANCE * Math.max(g[0].length, item.length));
      if (g) g.push(item); else groups.push([item]);
    });
    groups.forEach(g => {
      const members = g.map(i => i.t);
      if (members.length === 1) { out.push(members[0]); return; }
      const lead = members.reduce((a, b) => better(b, a) ? b : a);
      const trainset = lead.trip.trainset || (members.find(m => m.trip.trainset) || {}).trip?.trainset;
      out.push({ ...lead, trip: { ...lead.trip, trainset }, members: [lead, ...members.filter(m => m !== lead)] });
    });
  });
  return out;
}

// Two people on the same train for part of the way: one gets on later, or off earlier. Their
// trips are in progress together for a while, and each one's own timetable has them within
// SHARED_RIDE_M of each other both when the second gets on and when the first gets off; two
// different trains aren't in the same place twice. One may have logged a delay the other
// didn't (a ferry leaving early), so their timetables without the delays will do too. While
// both are on board they are one group trip too, from the member with the most timed stops
// (then the one going furthest); the others' routes are still drawn (`others`), as they
// differ. Not live-tracked flights.
const SHARED_RIDE_M = 3000, SHARED_RIDE_MIN_MS = 5 * 60 * 1000;
const operatorKey = trip => String(trip.operator || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const overlap = (x, y) => {
  const wa = TripProgress.window(x), wb = TripProgress.window(y);
  return wa && wb && { t0: Math.max(wa.t0, wb.t0), t1: Math.min(wa.t1, wb.t1) };
};
function together(x, xPath, y, yPath) {
  const w = overlap(x, y);
  if (!w || w.t1 - w.t0 < SHARED_RIDE_MIN_MS) return false;
  return [w.t0, w.t1].every(time => {
    const p = TripProgress.position(x, xPath, { latFirst: true, now: time });
    const q = TripProgress.position(y, yPath, { latFirst: true, now: time });
    return p && q && pathLength([p.point, q.point]) <= SHARED_RIDE_M;
  });
}
const undelayed = trip => ({ ...trip, departure_delay: 0, arrival_delay: 0 });
function sharedRide(a, b, now) {
  const x = a.trip, y = b.trip;
  if (x.type !== y.type || x.live_tracked || y.live_tracked) return false;
  // "Tallink" and "Tallink Silja" are the same operator, named more or less fully
  const ox = operatorKey(x), oy = operatorKey(y);
  if (ox && oy && !ox.includes(oy) && !oy.includes(ox)) return false;
  const w = overlap(x, y);
  if (!w || now < w.t0 || now > w.t1) return false;
  return together(x, a.path, y, b.path) || together(undelayed(x), a.path, undelayed(y), b.path);
}
function groupSharedRides(entries, now) {
  const moving = entries.filter(e => !STAY_ICONS[e.trip.type] && e.path.length >= 2);
  const root = new Map(entries.map(e => [e, e]));
  const find = e => { while (root.get(e) !== e) e = root.get(e); return e; };
  for (let i = 0; i < moving.length; i++) {
    for (let j = i + 1; j < moving.length; j++) {
      const a = moving[i], b = moving[j];
      if (find(a) !== find(b) && sharedRide(a, b, now)) root.set(find(b), find(a));
    }
  }
  const sets = new Map();
  entries.forEach(e => {
    const r = find(e);
    if (!sets.has(r)) sets.set(r, []);
    sets.get(r).push(e);
  });
  return [...sets.values()].map(set => {
    if (set.length === 1) return set[0];
    const end = e => (TripProgress.window(e.trip) || { t1: 0 }).t1;
    const lead = set.reduce((a, b) => {
      const sa = TripProgress.timedStops(a.trip).length, sb = TripProgress.timedStops(b.trip).length;
      return sb > sa || (sb === sa && end(b) > end(a)) ? b : a;
    });
    const members = set.flatMap(e => e.members || [e]);
    const leadMembers = lead.members || [lead];
    const trainset = lead.trip.trainset || (members.find(m => m.trip.trainset) || {}).trip?.trainset;
    return {
      ...lead, trip: { ...lead.trip, trainset }, shared: true,
      members: [...leadMembers, ...members.filter(m => !leadMembers.includes(m))],
      others: set.filter(e => e !== lead)
    };
  });
}

function renderTrips(trips) {
  trips = groupSharedRides(groupSameTrips(trips), Date.now());
  prevPinOfTrip = pinOfTrip;
  pinOfTrip = new Map();
  renderKeys = new Set(trips.map(t => t.trip.uid));
  const now = Date.now();
  const seen = new Set();
  const staticFeatures = [];

  trips.forEach(tripObj => {
    const { trip, path } = tripObj;
    const type     = (trip.type === 'helicopter') ? 'air' : trip.type;
    const color    = getTypeColor(type);
    seen.add(trip.uid);

    // API returns [[lat, lng], ...]; MapLibre needs [[lng, lat], ...]
    let coords = path.map(([lat, lng]) => [lng, lat]);

    // For a live-tracked flight the server sends the real flown-so-far track as `path`
    // and carries the logged destination separately, so append the estimated remainder.
    // The junction is the aircraft's actual position at its last fix, from which the
    // pin carries on — better than interpolating from the timetable.
    let liveJunction = null;
    if (trip.live_tracked && trip.live_destination && coords.length >= 2) {
      // FR24's public track can start at the first airborne contact rather than on the
      // runway, in which case bridge back to the departure airport; already travelled.
      // liveOriginBridge returns null when the track already reaches the airport, so no
      // straight stub is drawn beside a track that needs none.
      const bridge = MapLibreUtils.liveOriginBridge(trip.live_origin, path[0]);
      if (bridge) {
        coords = MapLibreUtils.createGeodesicLine([bridge[1], bridge[0]], coords[0])
          .concat(coords);
      }
      const [destLat, destLng] = trip.live_destination;
      liveJunction = coords.length - 1;
      coords = coords.concat(
        MapLibreUtils.createGeodesicLine(coords[liveJunction], [destLng, destLat])
      );
    } else if (type === 'air' && coords.length === 2) {
      // Great-circle line for air routes
      coords = MapLibreUtils.createGeodesicLine(coords[0], coords[1]);
    }

    if (coords.length === 1 && ['accommodation', 'poi', 'restaurant'].includes(type)) {
        placePin(tripObj, coords, null, now);
        return;
    }

    // Full path (static coloured line)
    staticFeatures.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: coords },
      // A group trip's members are only needed for their names
      properties: { color, tripData: JSON.stringify(tripObj.members
        ? { ...tripObj, others: undefined, members: tripObj.members.map(m => ({ username: m.username, trip: {
            uid: m.trip.uid, origin_station: m.trip.origin_station, destination_station: m.trip.destination_station
          } })) }
        : tripObj) }
    });

    // On a shared ride, the others' own routes too (they get on or off elsewhere)
    (tripObj.others || []).forEach(other => staticFeatures.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: other.path.map(([lat, lng]) => [lng, lat]) },
      properties: { color, tripData: staticFeatures[staticFeatures.length - 1].properties.tripData }
    }));

    // Current-position pin marker
    placePin(tripObj, coords, liveJunction, now);
  });

  pinsByTrip.forEach((pin, key) => {
    if (seen.has(key)) return;
    pin.marker.remove();
    pinsByTrip.delete(key);
    if (activePopupPin === pin) activePopupPin = null;
  });
  fastest = Math.max(1, ...[...pinsByTrip.values()].map(p => LiveMotion.speed(p.type)));

  map.getSource('live-static').setData({ type: 'FeatureCollection', features: staticFeatures });
  cutFuture(now);
  lastCut = performance.now();
  // All pins at once, so the first render asks for every picture in one request
  paintUserAvatars(map.getContainer(), avatarsEndpoint);

  hideLoading();
}

// Fade the veil out, then drop it from the paint tree. Idempotent — renderTrips
// runs on every refresh cycle.
function hideLoading() {
  const el = document.querySelector('.spinner-container');
  if (!el || el.classList.contains('hidden')) return;
  el.classList.add('hidden');
  el.addEventListener('transitionend', () => { el.style.display = 'none'; }, { once: true });
}

function fitToTrips() {
  const markers = allMarkers();
  if (!markers.length) return;
  const bounds = new maplibregl.LngLatBounds();
  markers.forEach(m => bounds.extend(m.getLngLat()));
  map.fitBounds(bounds, { padding: 80, maxZoom: 10 });
}

/* ── data loading ────────────────────────────────────────────────────────── */
function loadTrips() {
  fetch(apiEndpoint)
    .then(r => r.json())
    .then(trips => {
      const sig = JSON.stringify(trips);
      renderTrips(trips);
      // One per person, at their pin: a group trip's members count each
      const pins = trips.map(t => pinOfTrip.get(t.trip.uid)).filter(Boolean)
        .map(p => { const { lat, lng } = p.marker.getLngLat(); return [lat, lng]; });
      fetch('/live_map/countries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pins),
      })
        .then(r => r.ok ? r.json() : [])
        .catch(() => [])
        .then(places => renderStats(trips, places));
      if (sig !== lastSignature) {
        lastSignature = sig;
        if (firstLoad) { fitToTrips(); firstLoad = false; }
      }
    })
    .catch(err => { console.error(err); hideLoading(); });
}

/* ── initialise ──────────────────────────────────────────────────────────── */
MapLibreUtils.initializeMapLibre({
  container: 'map',
  tileserver: '{{ tileserver }}',
  useGlobe:   {{ 'true' if globe else 'false' }},
  center:     [10, 50],
  zoom:       4,
}).then(m => {
  map = m;
  map.once('load', () => {
    // MapLibre unfolds the attribution until the first drag; on a phone it would run under the stats
    if (matchMedia('(max-width: 700px)').matches) {
      map.getContainer().querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
    }
    map.addSource('live-static', { type: 'geojson', data: emptyFC() });
    // A dash pattern starts over in every tile (without lineMetrics, a line's length is
    // counted per tile), so stopping the tiles at z14 keeps the seams kilometres apart when
    // zoomed in. The deepest zoom isn't simplified, so the dashes still sit on the line.
    map.addSource('live-future', { type: 'geojson', data: emptyFC(), maxzoom: 14 });

    // Shadow layer (matches style from buildTripLayers in maplibre-utils.js)
    map.addLayer({
      id: 'live-shadow',
      type: 'line',
      source: 'live-static',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color':   '#000000',
        'line-width':   5,
        'line-opacity': 0.8,
        'line-blur':    0.5
      }
    });

    // Coloured trip lines
    map.addLayer({
      id: 'live-static',
      type: 'line',
      source: 'live-static',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color':   ['coalesce', ['get', 'color'], '#888888'],
        'line-width':   3,
        'line-opacity': 0.85
      }
    });

    // Animated white dashes over the remaining path, one layer per type for its own dashes
    FUTURE_TYPES.forEach(type => map.addLayer({
      id: `live-future-${type}`,
      type: 'line',
      source: 'live-future',
      filter: ['==', ['get', 'type'], type],
      layout: { 'line-join': 'round', 'line-cap': 'butt' },
      paint: {
        'line-color':      '#ffffff',
        'line-width':      3,
        'line-opacity':    0.9,
        'line-dasharray':  LiveMotion.dashArray(type, 0),
        'line-dasharray-transition': LiveMotion.TRANSITION
      }
    }));
    // The trips in view, drawn apart (see drawNear)
    nearOverlay = LiveMotion.overlay(map);
    map.on('render', () => drawNear(performance.now()));

    // Click on a trip line to open popup
    map.on('click', 'live-static', e => {
      const tripObj = JSON.parse(e.features[0].properties.tripData);
      openPopup(e.lngLat, tripObj);
    });
    map.on('mouseenter', 'live-static', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'live-static', () => { map.getCanvas().style.cursor = ''; });

    requestAnimationFrame(animate);
    loadTrips();
    setInterval(loadTrips, 60000);
  });
}).catch(err => {
  const msg = err?.message || '';
  if (msg.includes('webglcontextcreationerror') || msg.includes('Failed to initialize WebGL')) {
    window.location.href = "{{ leaflet_url }}" + window.location.search;
  } else {
    console.error(err);
  }
});
</script>
