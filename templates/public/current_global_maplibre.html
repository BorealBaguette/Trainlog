{% extends "layout.html" %}
{% block content %}

{% include "includes/trainset_display.html" %}

<link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet">

<style>
  #map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  .delay-time { color: #dc3545; }
  .early-time  { color: #28a745; }

  /* Trainset strip in popups — same look as the public trip pages: images
     scaled to half natural size (uniform factor preserves relative proportions),
     default 16px scroll padding keeps the scrollbar clear of the name pills. */
  .publicTrainset .compo-strip { min-width: 0; }
  .publicTrainset .wagon-placeholder-img { height: 22px; }

  /* Aircraft shape. The global .airframe rule offsets it for a table row's
     baseline; in the popup it stands on its own line and must shrink to fit. */
  /* The shape doubles as the photo's click target; the photo replaces it in place. */
  .popup-media.is-clickable { cursor: pointer; }
  .popup-media.is-clickable:hover { opacity: 0.85; }
  .popup-media.is-loading { opacity: 0.5; }
  .popup-photo-btn { color: #0d6efd; text-decoration: none; font-size: 0.95em; }
  .popup-photo-btn:hover, .popup-photo-btn.open { color: #0a58ca; }

  /* The global .airframe rule offsets it for a table row's baseline; in the popup
     it is a block of its own. */
  .popup-media .airframe {
    position: static;
    margin-left: 0;
    display: block;
    height: auto;
    width: auto;
    max-height: 38px;
    max-width: 100%;
  }

  /* Type and registration read as one line; the flag lands in .popup-reg-flag later. */
  .popup-vehicle { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 4px; }
  .popup-vehicle-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 7px; }
  .popup-reg { display: inline-flex; align-items: baseline; gap: 4px; }
  .popup-reg-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
  }
  /* The global .flag rule jumps to 26px above 1500px — sized for table rows, not
     for a popup line. */
  .popup-vehicle .flag { font-size: 1.15em !important; line-height: 1; vertical-align: baseline !important; }
  .popup-vehicle-type + .popup-reg::before { content: "·"; color: #bbb; margin-right: 3px; }
  /* Third-party thumbnails vary in size — cap and frame them so every popup matches. */
  .popup-media .vehiclePhotoContainer {
    max-width: min(260px, 100%);
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  .popup-media .vehiclePhotoContainer img { display: block; width: 100%; height: auto; }
  .popup-media .vehiclePhotoAttr { font-size: 0.72em; padding: .15em .3em; line-height: 1.2; }

  /* Keep popups within the viewport on narrow/mobile screens — the fixed
     460px maxWidth passed to maplibregl.Popup otherwise overflows small
     screens and the popup content itself needs to shrink & scroll with it. */
  .maplibregl-popup {
    max-width: calc(100vw - 20px) !important;
  }
  .maplibregl-popup-content {
    max-width: calc(100vw - 20px);
    max-height: 70vh;
    overflow-y: auto;
    box-sizing: border-box;
  }
  @media (max-width: 700px) {
    .maplibregl-popup-content { min-width: 0; }
    .publicTrainset .trainset-inline-scroll { max-width: 100% !important; }

    /* Pin the popup to the top of the screen so it's fully visible and
       spans the width of the viewport (minus a small margin) instead of
       being squeezed against the marker/screen edges. It stays put (no
       anchor/tip, doesn't follow the map) until closed via the ×. */
    .maplibregl-popup {
      position: fixed !important;
      top: 10px !important;
      left: 10px !important;
      right: 10px !important;
      width: auto !important;
      max-width: none !important;
      transform: none !important;
    }
    .maplibregl-popup-tip { display: none !important; }
    .maplibregl-popup-content {
      width: 100%;
      max-width: none;
      max-height: calc(100vh - 20px);
    }
  }
</style>

<div class="spinner-container">
  <div class="lds-spinner">
    <div></div><div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="{{ url_for('static', filename='js/maplibre-utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/util.js') }}"></script>
<script src="{{ url_for('static', filename='js/vehicle_display.js') }}"></script>

<script>
var logosList   = {{ logosList | safe }};
var apiEndpoint = "{{ api_endpoint }}";

/* ── datetime helpers ────────────────────────────────────────────────────── */
function formatDT(iso) {
  if (!iso) return { date: '-', time: '-' };
  const d = new Date(iso);
  return {
    date: d.toLocaleDateString(),
    time: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };
}
function daysDifference(d0, d1) {
  return Math.round((new Date(d1).setHours(12) - new Date(d0).setHours(12)) / 86400000);
}
function addDelayToISO(iso, delaySec) {
  if (!iso) return iso;
  const d = new Date(iso);
  d.setSeconds(d.getSeconds() + Number(delaySec || 0));
  return d.toISOString();
}
function formatDayDiff(iso, startDT) {
  const diff = daysDifference(startDT, iso);
  return diff > 0 ? ` (+${diff})` : diff < 0 ? ` (${diff})` : '';
}
function withDelayDisplay(iso, delaySec, startDT) {
  const scheduled = formatDT(iso).time + formatDayDiff(iso, startDT);
  const delay = Number(delaySec || 0);
  if (!delay) return scheduled;
  const actualISO = addDelayToISO(iso, delay);
  const actual = formatDT(actualISO).time + formatDayDiff(actualISO, startDT);
  const cls = delay > 0 ? 'delay-time' : 'early-time';
  return `<s>${scheduled}</s> <span class="${cls}">${actual}</span>`;
}

/* ── trainset display ────────────────────────────────────────────────────── */
const WAGONS_BASE = "{{ url_for('static', filename='images/wagons') }}";

function wagonImgSrc(u) {
  const side = u._side || 'L';
  const ext  = u.image_ext || 'gif';
  if (u.image_type === 'sides')   return `${WAGONS_BASE}/${u.image}${side === 'R' ? '_R' : '_L'}.${ext}`;
  if (u.image_type === 'sides_L') return `${WAGONS_BASE}/${u.image}_L.${ext}`;
  if (u.image_type === 'sides_R') return `${WAGONS_BASE}/${u.image}_R.${ext}`;
  return `${WAGONS_BASE}/${u.image}.${ext}`;
}

function wagonPlaceholderSrc(isFirst, isLast, phType) {
  const suffix = phType || ((isFirst && isLast) ? 'loco_both' : isFirst ? 'loco_l' : isLast ? 'loco_r' : 'mid');
  return `${WAGONS_BASE}/placeholder_${suffix}.svg`;
}

function trainsetHTML(trip) {
  const ts = trip.trainset;
  if (!ts || !ts.units || !ts.units.length) return '';
  const wagons = ts.units.map((u, i) => {
    const isFirst = i === 0, isLast = i === ts.units.length - 1;
    const ph = wagonPlaceholderSrc(isFirst, isLast, u._phType);
    const img = u.image
      ? `<img src="${wagonImgSrc(u)}"${u.px_per_meter ? ` data-ppm="${u.px_per_meter}"` : ''} title="${esc(u.label || '')}" onerror="this.src='${ph}';this.className='wagon-placeholder-img';this.style.height='';this.onerror=null;">`
      : `<img class="wagon-placeholder-img" src="${ph}">`;
    return `<div class="compo-wagon ts-unit">${img}<span class="compo-coach-no ts-nom ts-nom-inline">${esc(u.label || '')}</span></div>`;
  }).join('');
  const attr = _attributionText(ts.units);
  const label = ts.label ? `<div class="ts-inline-label">${esc(ts.label)}</div>` : '';
  return `<div class="publicTrainset ts-inline-wrapper" style="margin-top:6px;">
      <div class="trainset-inline-scroll" style="max-width:420px"${attr ? ` title="${attr}"` : ''}>
        <div class="compo-strip ts-strip">${wagons}</div>
      </div>${label}</div>`;
}

/* ── vehicle display (aircraft / vessel) ─────────────────────────────────── */
const AIRLINERS_BASE = "{{ url_for('static', filename='images/airliners') }}".replace(/\/$/, '');
const REGISTRATIONS_URL = "{{ url_for('static', filename='data/registrations.json') }}";
const VESSEL_PHOTO_URL = "{{ url_for('getVesselPhoto') }}";

// The popup body is built as a string, so anything async (the shape, the photo, the
// registration flag) is emitted as an empty slot and filled by hydrateVehicle once
// the popup is in the DOM. Photo lookups therefore only ever run on a real click.
function vehicleHTML(trip) {
  const isAir = ['air', 'helicopter'].includes(trip.type);
  const isFerry = trip.type === 'ferry';
  if (!isAir && !isFerry) return '';

  const reg = (trip.reg || '').trim();
  const info = isAir ? airframeInfo(trip) : null;
  if (!info && !reg) return '';

  const type = info ? `<span class="popup-vehicle-type">${esc(info.label)}</span>` : '';
  const regEl = reg
    ? `<span class="popup-reg" data-reg="${esc(reg)}" data-kind="${isAir ? 'air' : 'ship'}"
             data-country="${esc(trip.vessel_country || '')}">
         <span class="popup-reg-flag"></span><span class="popup-reg-text">${esc(reg)}</span>
       </span>`
    : '';
  // The shape shows by default and doubles as the photo's click target; with no
  // shape (no artwork, or a ship) a camera button in the header stands in.
  const media = `<div class="popup-media" data-code="${info ? esc(info.code) : ''}"></div>`;
  return `<div class="popup-vehicle">
            <div class="popup-vehicle-head">${type}${regEl}</div>
            ${media}
          </div>`;
}

function hydrateVehicle(popupEl) {
  popupEl.querySelectorAll('.popup-media').forEach(media => {
    const code = media.getAttribute('data-code');
    if (!code) return;
    const img = loadAirframe(AIRLINERS_BASE, code);
    if (img) media.appendChild(img);
  });

  popupEl.querySelectorAll('.popup-reg').forEach(regEl => {
    const reg = regEl.getAttribute('data-reg');
    const isAir = regEl.getAttribute('data-kind') === 'air';
    const flagEl = regEl.querySelector('.popup-reg-flag');
    const media = regEl.closest('.popup-vehicle').querySelector('.popup-media');
    const hasShape = !!media.getAttribute('data-code');

    // getTooltipNew only emits the markup; Bootstrap still has to bind it.
    const showFlag = (country) => {
      if (!country || !flagEl || !flagEl.isConnected) return;
      flagEl.innerHTML = getTooltipNew(country);
      $(flagEl).find('[data-toggle="tooltip"]').tooltip();
    };

    // Both kinds get their flag up front: aircraft from the registration prefix,
    // ships from the ship_pictures join. A vessel absent from that cache has no
    // country until something fetches it — the photo response fills it in below.
    const knownCountry = regEl.getAttribute('data-country');
    if (isAir) {
      loadRegistrations(REGISTRATIONS_URL)
        .then(registrations => showFlag(regCountry(reg, registrations)));
    } else {
      showFlag(knownCountry);
    }

    // The photo replaces the shape on click rather than stacking beside it (they
    // say the same thing), which also keeps the lookup off the popup-open path.
    // The camera icon shows for aircraft and ships alike so the two read identically;
    // where a shape exists it becomes an additional, larger target for the same action.
    const btn = document.createElement('a');
    btn.href = 'javascript:void(0);';
    btn.className = 'popup-photo-btn';
    btn.innerHTML = '<i class="fas fa-camera"></i>';
    regEl.parentNode.appendChild(btn);
    if (hasShape) media.classList.add('is-clickable');

    let photoEl = null, showingPhoto = false, pending = false;

    const siblings = () => Array.from(media.children).filter(el => el !== photoEl);

    const swap = (toPhoto) => {
      showingPhoto = toPhoto;
      if (!photoEl) return;
      siblings().forEach(el => { el.style.display = toPhoto ? 'none' : ''; });
      photoEl.style.display = toPhoto ? '' : 'none';
      btn.classList.toggle('open', toPhoto);
    };

    const toggle = (e) => {
      if (e) e.stopPropagation();
      if (photoEl) { swap(!showingPhoto); return; }
      if (pending) return;
      pending = true;
      media.classList.add('is-loading');
      const promise = isAir ? fetchAircraftPhoto(reg)
                            : fetchVesselPhoto(VESSEL_PHOTO_URL, reg);
      promise.then(photo => {
        pending = false;
        media.classList.remove('is-loading');
        // The popup may have been closed/replaced while the request was in flight.
        if (!media.isConnected) return;
        if (!isAir && !knownCountry && photo) showFlag(photo.country);
        if (!photo) {                       // nothing found — retire the affordance
          media.classList.remove('is-clickable');
          btn.remove();
          return;
        }
        photoEl = document.createElement('div');
        photoEl.innerHTML = photoHTML(photo);
        media.appendChild(photoEl);
        // ship_pictures rows can outlive their file on disk (the whole local cache
        // is absent in dev) — drop the frame rather than show a broken icon.
        const pic = photoEl.querySelector('img');
        if (pic) pic.addEventListener('error', () => {
          const orphans = siblings();
          photoEl.remove();
          photoEl = null;
          showingPhoto = false;
          orphans.forEach(el => { el.style.display = ''; });
          btn.remove();
        });
        swap(true);
      });
    };

    btn.addEventListener('click', toggle);
    if (hasShape) media.addEventListener('click', toggle);
  });
}

/* ── trip helpers ────────────────────────────────────────────────────────── */
function getTypeColor(type) {
  const t = MapLibreUtils.MapConfig.transportTypes.find(t => t.id === type);
  return t ? t.color : '#888888';
}


function calculateProgress(tripObj) {
  const t = tripObj.trip;
  const now   = Date.now();
  const start = new Date(t.utc_start_datetime + 'Z').getTime() + Number(t.departure_delay || 0) * 1000;
  const end   = new Date(t.utc_end_datetime   + 'Z').getTime() + Number(t.arrival_delay   || 0) * 1000;
  if (isNaN(start) || isNaN(end) || end <= start) return 0;
  return Math.min(Math.max((now - start) / (end - start), 0), 1);
}

function getPopupContent(tripObj) {
  const trip        = tripObj.trip || {};
  const origin      = trip.origin_station || '-';
  const destination = trip.destination_station || '-';
  const { date: startDate } = formatDT(trip.start_datetime);
  const startTime   = withDelayDisplay(trip.start_datetime, trip.departure_delay, trip.start_datetime);
  const endTime     = withDelayDisplay(trip.end_datetime,   trip.arrival_delay,   trip.start_datetime);
  const profileUrl  = `/public/${tripObj.username}`;

  if (['accommodation', 'poi', 'restaurant'].includes(trip.type)) {
      let icon = '<i class="fa-solid fa-map-location-dot"></i>'
      if (trip.type === 'accommodation') icon = '<i class="fa-solid fa-bed"></i>'
      if (trip.type === 'restaurant') icon = '<i class="fa-solid fa-utensils"></i>'
      return `
        <div style="font-family:Century Gothic,sans-serif;min-width:200px;">
          <div style="font-weight:bold;font-size:1.05em;margin-bottom:6px;">
            <a href="${profileUrl}" target="_blank" style="text-decoration:none;color:inherit;">${tripObj.username}</a>
          </div>
          <div style="font-size:0.9em;color:#333;line-height:1.7;">
            <div>${icon}&nbsp;<span style="text-transform: capitalize; font-weight: bold">${trip.type === 'poi' ? 'Activity' : trip.type}</strong></div>
            <div>${origin}</div>
            <div><strong>Date:</strong> ${startDate}</div>
            <div><strong>Time:</strong> ${startTime} – ${endTime}</div>
          </div>
        </div>`;
  }

  let operatorParts = [];
  if (trip.multi_operators) {
    trip.multi_operators.forEach(op => {
      operatorParts.push(op.logo_url
        ? `<img src="/static/${op.logo_url}" alt="${op.operator_name}" style="max-height:40px;max-width:120px;object-fit:contain;">`
        : `<span>${op.operator_name}</span>`);
    });
  } else if (trip.logo_url) {
    operatorParts.push(`<img src="/static/${trip.logo_url}" alt="${trip.operator || ''}" style="max-height:40px;max-width:120px;object-fit:contain;">`);
  } else if (trip.operator) {
    String(trip.operator).split(',').map(s => s.trim()).forEach(op => {
      operatorParts.push(logosList[op]
        ? `<img src="/static/${logosList[op]}" alt="${op}" style="max-height:40px;max-width:120px;object-fit:contain;">`
        : `<span>${op}</span>`);
    });
  }

  const logoHTML = operatorParts.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;">${operatorParts.join('')}</div>`
    : '';

  return `
    <div style="font-family:Century Gothic,sans-serif;min-width:200px;">
      <div style="font-weight:bold;font-size:1.05em;margin-bottom:6px;">
        <a href="${profileUrl}" target="_blank" style="text-decoration:none;color:inherit;">${tripObj.username}</a>
      </div>
      <div style="font-size:0.9em;color:#333;line-height:1.7;">
        <div><strong>From:</strong> ${origin}</div>
        <div><strong>To:</strong> ${destination}</div>
        <div><strong>Date:</strong> ${startDate}</div>
        <div><strong>Time:</strong> ${startTime} – ${endTime}</div>
        ${trip.line_name ? `<div><strong>Line:</strong> ${trip.line_name}</div>` : ''}
        ${vehicleHTML(trip)}
        ${trainsetHTML(trip)}
      </div>
      ${logoHTML}
    </div>`;
}

/* ── dash animation ──────────────────────────────────────────────────────── */
// Cycles through dash-array phases to create a "moving dashes" effect
const DASH_SEQ = [
  [0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],
  [2.5,4,0.5],[3,4,0],[0,0.5,3,3.5],[0,1,3,3],
  [0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],
  [0,3.5,3,0.5],[0,4,3,0]
];
let dashStep = 0;

function animateDashes(ts) {
  const step = Math.floor(ts / 50) % DASH_SEQ.length;
  if (step !== dashStep) {
    dashStep = step;
    try { map.setPaintProperty('live-future', 'line-dasharray', DASH_SEQ[step]); } catch (_) {}
  }
  requestAnimationFrame(animateDashes);
}

/* ── map state ───────────────────────────────────────────────────────────── */
let map;
let markers       = [];
let lastSignature = null;
let firstLoad     = true;
let activePopup   = null;

const emptyFC = () => ({ type: 'FeatureCollection', features: [] });

/* ── popup handling ──────────────────────────────────────────────────────── */
// Only one popup is ever shown at a time: opening a new one always closes
// the previous one. closeOnClick (default) lets clicking elsewhere on the
// map dismiss it too; closeOnMove is disabled so panning doesn't close it.
function openPopup(lngLat, tripObj) {
  if (activePopup) activePopup.remove();
  activePopup = new maplibregl.Popup({ offset: 25, maxWidth: '460px', closeOnMove: false })
    .setLngLat(lngLat)
    .setHTML(getPopupContent(tripObj))
    .addTo(map);
  // Size the trainset strip against its own median height (see normalizeStrip).
  const popupEl = activePopup.getElement();
  if (popupEl) {
    popupEl.querySelectorAll('.compo-strip').forEach(function (strip) {
      normalizeStrip(strip, { target: 22, min: 15, max: 38 });
    });
    hydrateVehicle(popupEl);
  }
}

/* ── rendering ───────────────────────────────────────────────────────────── */
// Single source of truth for "where along the path are we": used both for the
// pin and for the start of the animated future segment so the two always agree.
function pegIndex(progress, len) {
  if (len < 2) return 0;
  return Math.min(Math.floor(progress * (len - 1)), len - 1);
}

// `coords` must be the same [lng, lat] array that was drawn (geodesic-expanded
// for air routes), otherwise the pin lands on the raw 2-point path start.
// `pegOverride` is the index of the aircraft's real position, known only for a
// live-tracked flight. When present it beats calculateProgress, which can only
// interpolate against the timetable.
function addMarker(tripObj, coords, pegOverride) {
    const type     = (tripObj.trip.type === 'helicopter') ? 'air' : tripObj.trip.type;
    const color = getTypeColor(type);
    const progress = calculateProgress(tripObj);

    const pegIdx = (pegOverride !== null && pegOverride !== undefined)
      ? pegOverride
      : pegIndex(progress, coords.length);
    const [pegLng, pegLat] = coords[pegIdx];

    const marker = new maplibregl.Marker({ color })
      .setLngLat([pegLng, pegLat])
      .addTo(map);
    marker.getElement().addEventListener('click', e => {
      e.stopPropagation();
      openPopup([pegLng, pegLat], tripObj);
    });

    markers.push(marker);
}

function renderTrips(trips) {
  markers.forEach(m => m.remove());
  markers = [];

  const staticFeatures = [];
  const futureFeatures = [];

  trips.forEach(tripObj => {
    const { trip, path } = tripObj;
    const type     = (trip.type === 'helicopter') ? 'air' : trip.type;
    const color    = getTypeColor(type);
    const progress = calculateProgress(tripObj);

    // API returns [[lat, lng], ...]; MapLibre needs [[lng, lat], ...]
    let coords = path.map(([lat, lng]) => [lng, lat]);

    // For a live-tracked flight the server sends the real flown-so-far track as `path`
    // and carries the logged destination separately, so append the estimated remainder.
    // The junction is the aircraft's actual position, which is both where the dashed
    // "not yet flown" overlay should start and where the pin belongs — better than
    // interpolating either from the timetable.
    let liveJunction = null;
    if (trip.live_tracked && trip.live_destination && coords.length >= 2) {
      const [destLat, destLng] = trip.live_destination;
      liveJunction = coords.length - 1;
      coords = coords.concat(
        MapLibreUtils.createGeodesicLine(coords[liveJunction], [destLng, destLat])
      );
    } else if (type === 'air' && coords.length === 2) {
      // Great-circle line for air routes
      coords = MapLibreUtils.createGeodesicLine(coords[0], coords[1]);
    }

    if (coords.length === 1 && ['accommodation', 'poi', 'restaurant'].includes(type)) {
        addMarker(tripObj, coords);
        return;
    }

    // Full path (static coloured line)
    staticFeatures.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: coords },
      properties: { color, tripData: JSON.stringify(tripObj) }
    });

    // Future segment (animated white dashes overlay)
    const future  = coords.slice(
      liveJunction !== null ? liveJunction : pegIndex(progress, coords.length)
    );
    if (future.length >= 2 && (liveJunction !== null || progress < 1)) {
      futureFeatures.push({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: future },
        properties: {}
      });
    }

    // Current-position pin marker
    addMarker(tripObj, coords, liveJunction)
  });

  map.getSource('live-static').setData({ type: 'FeatureCollection', features: staticFeatures });
  map.getSource('live-future').setData({ type: 'FeatureCollection', features: futureFeatures });

  document.querySelector('.spinner-container').style.display = 'none';
}

function fitToTrips() {
  if (!markers.length) return;
  const bounds = new maplibregl.LngLatBounds();
  markers.forEach(m => bounds.extend(m.getLngLat()));
  map.fitBounds(bounds, { padding: 80, maxZoom: 10 });
}

/* ── data loading ────────────────────────────────────────────────────────── */
function loadTrips() {
  fetch(apiEndpoint)
    .then(r => r.json())
    .then(trips => {
      const sig = JSON.stringify(trips);
      renderTrips(trips);
      if (sig !== lastSignature) {
        lastSignature = sig;
        if (firstLoad) { fitToTrips(); firstLoad = false; }
      }
    })
    .catch(console.error);
}

/* ── initialise ──────────────────────────────────────────────────────────── */
MapLibreUtils.initializeMapLibre({
  container: 'map',
  tileserver: '{{ tileserver }}',
  useGlobe:   {{ 'true' if globe else 'false' }},
  center:     [10, 50],
  zoom:       4,
}).then(m => {
  map = m;
  map.once('load', () => {
    map.addSource('live-static', { type: 'geojson', data: emptyFC() });
    map.addSource('live-future', { type: 'geojson', data: emptyFC() });

    // Shadow layer (matches style from buildTripLayers in maplibre-utils.js)
    map.addLayer({
      id: 'live-shadow',
      type: 'line',
      source: 'live-static',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color':   '#000000',
        'line-width':   5,
        'line-opacity': 0.8,
        'line-blur':    0.5
      }
    });

    // Coloured trip lines
    map.addLayer({
      id: 'live-static',
      type: 'line',
      source: 'live-static',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color':   ['coalesce', ['get', 'color'], '#888888'],
        'line-width':   3,
        'line-opacity': 0.85
      }
    });

    // Animated white dashes over the remaining path
    map.addLayer({
      id: 'live-future',
      type: 'line',
      source: 'live-future',
      layout: { 'line-join': 'round', 'line-cap': 'butt' },
      paint: {
        'line-color':      '#ffffff',
        'line-width':      3,
        'line-opacity':    0.9,
        'line-dasharray':  DASH_SEQ[0]
      }
    });

    // Click on a trip line to open popup
    map.on('click', 'live-static', e => {
      const tripObj = JSON.parse(e.features[0].properties.tripData);
      openPopup(e.lngLat, tripObj);
    });
    map.on('mouseenter', 'live-static', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'live-static', () => { map.getCanvas().style.cursor = ''; });

    requestAnimationFrame(animateDashes);
    loadTrips();
    setInterval(loadTrips, 60000);
  });
}).catch(err => {
  const msg = err?.message || '';
  if (msg.includes('webglcontextcreationerror') || msg.includes('Failed to initialize WebGL')) {
    window.location.href = '/live_map/leaflet' + window.location.search;
  } else {
    console.error(err);
  }
});
</script>
