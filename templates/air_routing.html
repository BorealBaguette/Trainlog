{% extends "layout.html" %}
{% block content %}
<script>
</script>

<div id="map" class="mapRouting">
</div>

<div id="sidebar">
    <div id="sidebar-content">
    </div>
</div>
{% if from_app %}
<style>
  div.leaflet-control-container { display: none !important; }
  nav.navbar { display: none !important; }
</style>
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/routing_panel.css') }}">

<script>
// ─── Flutter bridge (for app) ───────────────────────────────────────────────
window.flutterBridge = {
  _send(event, payload) {
    if (!window.flutter_inappwebview) return;
    window.flutter_inappwebview.callHandler('routingEvent',  { event, ...payload });
  },
  loading(isLoading)          { this._send('loading',        { isLoading }); },
  routeInfo(text, distanceM, durationS) {
                                this._send('routeInfo',      { text, distanceM, durationS }); },
  routingError(message)       { this._send('routingError',   { message }); },
  saveTripDone(ok, trip)      { this._send('saveTripDone',   { ok, trip }); },
  saveError(message)          { this._send('saveError',      { message }); },
};
// ─── End Flutter bridge (for app) ───────────────────────────────────────────

let currentPolyline = null;
let useFR24 = true;
let fr24PathCache = null;
let fr24AltCache = null;   // altitude (metres), parallel to fr24PathCache
let fr24TimeCache = null;  // timestamps (epoch seconds), parallel to fr24PathCache

const id = getGetParams().get("id");
let newTrip = null;

{% if trip_data %}
newTrip = {{ trip_data | safe }};
{% endif %}
if (!newTrip && id) {
    newTrip = JSON.parse(sessionStorage.getItem(id));
}

if (!newTrip) {
    document.getElementById('sidebar-content').innerHTML = '<h4>Error: No trip data provided</h4>';
    flutterBridge.routingError("No trip data provided");
    throw new Error('No trip data');
}
var fromApp = !!getGetParams().get("fromApp");
var type = getGetParams().get("type") || newTrip.type;

console.log(newTrip);

let origCoord = newTrip.originStation?.[0] ?? [0, 0];
let destCoord = newTrip.destinationStation?.[0] ?? [0, 0];
let origLabel = newTrip.originStation?.[1] ?? "Origin";
let destLabel = newTrip.destinationStation?.[1] ?? "Destination";

const originalOrigCoord = [...origCoord];
const originalDestCoord = [...destCoord];

const map = createMap(null, origCoord);

const sidebar = L.control.sidebar('sidebar', {
    closeButton: true,
    position: 'right',
    autoPan: window.innerWidth > 600
}).addTo(map);


let origMarker = L.marker(origCoord, { icon: markerIconStart, draggable: false }).addTo(map);
let destMarker = L.marker(destCoord, { icon: markerIconEnd, draggable: false }).addTo(map);

if(fromApp) {
    map.fitBounds(L.latLngBounds([origCoord, destCoord]));
} else {
    map.fitBounds(L.latLngBounds([origCoord, destCoord]), {
        padding: [200, 200]
    });
}

async function updateRoute() {
    if (currentPolyline) {
        map.removeLayer(currentPolyline);
        currentPolyline = null;
    }

    if (newTrip.fr24_id && useFR24) {
        if (!fr24PathCache) {
            showLoadingSidebar();
            try {
                const res = await fetch(`{{url_for("flight_tracks", username=username, fr24_id='' )}}${newTrip.fr24_id}`);
                const data = await res.json();
                fr24PathCache = data.coordinates;
                fr24AltCache = data.altitude;
                fr24TimeCache = data.timestamps;
            } catch (e) {
                console.warn("FR24 path fetch failed, falling back to geodesic");
                useFR24 = false;
                return updateRoute();
            }
        }

        if (!Array.isArray(fr24PathCache) || fr24PathCache.length < 2) {
            useFR24 = false;
            return updateRoute();
        }

        const path = normalizeDateLinePath(fr24PathCache);

        currentPolyline = L.polyline(path, {
            className: "polyline airPolyline pastPolyline",
            color: "#3388ff",
            weight: 3,
            opacity: 0.9
        }).addTo(map);

        const first = path[0];
        const last = path[path.length - 1];

        origMarker.setLatLng(first).setIcon(markerIconStart).dragging.disable();
        destMarker.setLatLng(last).setIcon(markerIconEnd).dragging.disable();

        newTrip["trip_length"] = getDistanceFromLocations(first, last);
        newTrip["estimated_trip_duration"] = (newTrip["trip_length"] / 235) + 1800;

        updateSidebar(true);
    } else {
        origMarker.setLatLng(originalOrigCoord).setIcon(markerIconStart).dragging.enable();
        destMarker.setLatLng(originalDestCoord).setIcon(markerIconEnd).dragging.enable();

        currentPolyline = new L.Geodesic([
            [originalOrigCoord[0], originalOrigCoord[1]],
            [originalDestCoord[0], originalDestCoord[1]]
        ], {
            className: "polyline airPolyline pastPolyline",
            wrap: false,
            steps: 8
        }).addTo(map);

        newTrip["trip_length"] = getDistanceFromLocations(origMarker.getLatLng(), destMarker.getLatLng());
        newTrip["estimated_trip_duration"] = (newTrip["trip_length"] / 235) + 1800;

        const bounds = new L.LatLngBounds([originalOrigCoord, originalDestCoord]);

        updateSidebar(false);
    }
}

function updateSidebar(isFr24Active) {
    let kmRaw, durationRaw;

    if (isFr24Active && newTrip.fr24_id && fr24PathCache?.length >= 2) {
        kmRaw = getTotalDistanceFromPath(fr24PathCache);
        durationRaw = newTrip.fr24_duration ?? newTrip.estimated_trip_duration;
    }else {
        kmRaw = newTrip.trip_length;
        durationRaw = newTrip.estimated_trip_duration;
    }

    // Overwrite trip_length and estimated_trip_duration with current values
    newTrip.trip_length = kmRaw;
    newTrip.estimated_trip_duration = durationRaw;

    const km = mToKm(kmRaw);
    const time = secondsToDhm(durationRaw, "{{langId}}");

    let content = `<h4>${origLabel} to ${destLabel}</h4>`;
    var distanceAndTimeText = `<p><i>${km} km, ${time}</i></p>`;
    content += distanceAndTimeText;

    flutterBridge.routeInfo(distanceAndTimeText, kmRaw, durationRaw);
    flutterBridge.loading(false);

    if (newTrip.fr24_id) {
        content += `<div class="sidebar-actions"><button type="button" class="btn btn-sm btn-outline-primary" onclick="toggleRoute()">Switch to ${isFr24Active ? 'Geodesic' : 'FR24'} Path</button></div>`;
    }

    content += `<div class="sidebar-actions"><button id="saveTrip" type="button" onclick="saveTrip()" class="btn btn-success">{{submit}}</button>`;
    content += `<button id="saveTripContinue" type="button" onclick="saveTrip(true)" class="btn btn-outline-success btn-sm">{{saveTripContinueButton}}</button></div>`;
    sidebar.setContent(content);
}


function toggleRoute() {
    useFR24 = !useFR24;
    updateRoute();
}

origMarker.on('dragend', () => {
    if (!useFR24) updateRoute();
});
destMarker.on('dragend', () => {
    if (!useFR24) updateRoute();
});

function showLoadingSidebar(message = "Loading flight path...") {
    flutterBridge.loading(true);
    sidebar.setContent(`
        <h4>${message}</h4>
        <div class="spinner-container">
            <div class="lds-spinner">
                <div></div><div></div><div></div><div></div><div></div><div></div>
                <div></div><div></div><div></div><div></div><div></div><div></div>
            </div>
        </div>
    `);
}


async function saveTrip(continueTrip=false) {
    flutterBridge.loading(true);
    sidebar.setContent('<div class="spinner-container"><div class="lds-spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>');

    let pathToSave;
    let altToSave = null;
    let timeToSave = null;

    if (useFR24 && Array.isArray(fr24PathCache) && fr24PathCache.length >= 2) {
        // Save FR24 path (with altitude/timestamps, parallel to the path points)
        pathToSave = fr24PathCache.map(p => ({ lat: p[0], lng: p[1] }));
        altToSave = fr24AltCache;
        timeToSave = fr24TimeCache;
        console.log("Saving FR24 path", pathToSave);
        newTrip["trip_length"] = getTotalDistanceFromPath(fr24PathCache);
        newTrip["estimated_trip_duration"] = newTrip.fr24_duration ?? newTrip.estimated_trip_duration;
    } else {
        // Save Geodesic
        pathToSave = [
            { lat: origMarker.getLatLng().lat, lng: origMarker.getLatLng().lng },
            { lat: destMarker.getLatLng().lat, lng: destMarker.getLatLng().lng }
        ];
        newTrip["trip_length"] = getDistanceFromLocations(pathToSave[0], pathToSave[1]);
        newTrip["estimated_trip_duration"] = (newTrip["trip_length"] / 235) + 1800;
    }

    $.post({
        url: '{{url_for("saveFlight", username=username, type=type)}}',
        data: {
            newTrip: JSON.stringify(newTrip),
            jsonPath: JSON.stringify(pathToSave),
            altitude: altToSave ? JSON.stringify(altToSave) : "",
            timestamps: timeToSave ? JSON.stringify(timeToSave) : "",
            fromApp: fromApp
        },
        success: function (res) {
            if (fromApp) {
                flutterBridge.loading(false);
                flutterBridge.saveTripDone(true, res);
                return;
            }

            var isPlan = !!newTrip.plan_uuid;
            if (isPlan) {
                if (continueTrip) {
                    // Carry forward the same timing mode this leg used (relative or precise).
                    var contUrl = `{{ url_for('new', username=username, vehicle_type='') }}${type}?plan=${encodeURIComponent(newTrip.plan_uuid)}&prevDest=${newTrip["destinationStation"]}`;
                    if (newTrip.precision == "preciseDates") {
                        contUrl += `&prevEndDate=${newTrip["newTripEndDate"] || ''}&prevEndTime=${newTrip["newTripEndTime"] || ''}`;
                    } else if (newTrip.precision == "onlyDate") {
                        contUrl += `&prevEndDate=${newTrip["onlyDate"] || ''}`;
                    } else {
                        contUrl += `&prevPlanDay=${newTrip["planEndDay"] || ''}&prevPlanTime=${newTrip["planEndTime"] || ''}`;
                    }
                    location.href = contUrl;
                } else {
                    location.href = "/u/{{ username }}/plan/" + encodeURIComponent(newTrip.plan_uuid);
                }
                return;
            }

            if (continueTrip) {
                location.href = `{{ url_for('new', username=username, vehicle_type='') }}${type}?prevDest=${newTrip["destinationStation"]}&prevEndDate=${newTrip["newTripEndDate"]}&prevEndTime=${newTrip["newTripEndTime"]}`;
            } else {
                location.href = "{{ url_for('landing') }}";
            }
        },
        error: function (xhr, status, error) {
            flutterBridge.loading(false);
            flutterBridge.saveError(error || 'Save failed');
            sidebar.setContent("<h4>{{saveError}}</h4><p>{{saveErrorDetails}}</p><p><button onclick='location.reload()'>{{retry}}</button></p>")
        }
    });
}

function normalizeDateLinePath(path) {
    if (!Array.isArray(path) || path.length < 2) return path;

    const normalized = [path[0]];

    for (let i = 1; i < path.length; i++) {
        const prev = normalized[normalized.length - 1];
        const curr = path[i];

        let lat = curr[0];
        let lon = curr[1];

        // Check for date line crossing
        let delta = lon - prev[1];
        if (delta > 180) lon -= 360;
        else if (delta < -180) lon += 360;

        normalized.push([lat, lon]);
    }

    return normalized;
}

setTimeout(() => sidebar.show(), 500);
updateRoute();

</script>
{% endblock %}
