                    if (score < best) { best = score; bestEnd = end; }
                }
                cost[j][i] = best; next[j][i] = bestEnd;
            }
        }

        if (cost[rowCount][0] === Infinity) return greedyRows(widths, limit);

        const rows = [];
        let start = 0;
        for (let j = rowCount; j > 0; j--) {
            const end = next[j][start];
            rows.push(Array.from({ length: end - start }, (_, k) => start + k));
            start = end;
        }
        return rows;
    }

    // Where the breaks go and how much the rake shrinks are the same decision,
    // not two: a locomotive is half the length of the coaches behind it, so
    // splitting a sixteen-car set down the middle gives a top row a coach-width
    // shorter than the bottom one — even by count, small-headed to look at.
    // Pulling one more car up fixes that, and costs a few percent of scale.
    //
    // So every split is priced with the scale it would need (a row can never be
    // wider than the strip, so the widest row sets it), and the three things
    // that make a rake look wrong trade off against each other:
    //
    //   spread  — how far the longest and shortest rows are apart
    //   ascend  — how much of that is a row LONGER than the one above it, which
    //             is the part that reads as a mistake rather than as tapering
    //   shrink  — how far below their natural size the cars ended up
    //
    // Weights are in fractions of the strip width. ASCEND above 1 is what lets
    // a car move up: it makes a bottom-heavy split cost more than the extra
    // unevenness of the top-heavy one, while a rake that already splits evenly
    // (spread and ascend both nil) still beats anything bought with shrinking.
    var LAYOUT_ASCEND = 6;
    var LAYOUT_SHRINK = 1.5;
    // Enumerating every split is C(cars-1, rows-1): fine for a dozen cars in two
    // or three rows, hopeless for a doubled TGV set on a phone, which is twenty
    // cars over eight rows and fifty thousand splits. Past this many the search
    // is restricted to cuts within LAYOUT_WINDOW cars of where an exactly even
    // split would put them, which is where every layout worth having lives —
    // the top-heavy one is a single car's shift off the even one — and turns the
    // search back into a few thousand nodes.
    var LAYOUT_FULL_SEARCH = 4000;
    var LAYOUT_WINDOW = 1;
    // Backstop for the case the window still can't tame; balancedRows takes over.
    var LAYOUT_BUDGET = 60000;

    // How many splits a full enumeration would visit, given up on as soon as it
    // is clearly over the limit — these numbers overflow fast.
    function splitCount(cars, rows) {
        let count = 1;
        for (let i = 1; i <= rows - 1; i++) {
            count = count * (cars - 1 - (rows - 1) + i) / i;
            if (count > LAYOUT_FULL_SEARCH) return Infinity;
        }
        return count;
    }

    // The best (scale, breaks) pair for a given number of rows, or null if none
    // of them leaves the cars legible.
    function chooseLayout(widths, rowCount, limit, natural, legible) {
        const n = widths.length;
        if (rowCount > n) return null;

        const prefix = [0];
        widths.forEach((w, i) => prefix.push(prefix[i] + w));

        // Where an even-by-width split would cut, for the windowed search. Cuts
        // are counted in cars, so the window follows the artwork: a row of long
        // coaches and a row of short vans both get one car of slack either way.
        const ideal = [];
        if (splitCount(n, rowCount) === Infinity) {
            let car = 0;
            for (let j = 1; j < rowCount; j++) {
                const target = prefix[n] * j / rowCount;
                while (car < n && prefix[car] < target) car++;
                ideal.push(car);
            }
        }

        let best = null, budget = LAYOUT_BUDGET;

        // Walk the cut positions: `cuts` holds the car each closed row ended on.
        (function place(start, rowsLeft, cuts) {
            if (budget-- < 0) return;
            if (rowsLeft === 0) {
                if (start !== n) return;

                let from = 0;
                const rows = cuts.map(end => {
                    const width = prefix[end] - prefix[from];
                    from = end;
                    return width;
                });
                const scale = Math.min(natural, limit / Math.max.apply(null, rows));
                if (!legible(scale)) return;

                let ascend = 0;
                for (let i = 1; i < rows.length; i++) {
                    ascend += Math.max(0, (rows[i] - rows[i - 1]) * scale);
                }
                const spread = (Math.max.apply(null, rows)
                    - Math.min.apply(null, rows)) * scale;
                const cost = (spread + LAYOUT_ASCEND * ascend) / limit
                    + LAYOUT_SHRINK * (natural - scale) / natural;
                if (!best || cost < best.cost) best = { cost, scale, cuts: cuts.slice() };
                return;
            }

            // Leave at least one car for each row still to come, and — when the
            // search is windowed — stay near where the even split would cut.
            let first = start + 1, last = n - rowsLeft + 1;
            if (ideal.length) {
                // The last row has no choice: it ends on the last car.
                const around = rowsLeft === 1 ? n : ideal[rowCount - rowsLeft];
                first = Math.max(first, around - LAYOUT_WINDOW);
                last = Math.min(last, around + LAYOUT_WINDOW);
            }
            for (let end = first; end <= last; end++) {
                cuts.push(end);
                place(end, rowsLeft - 1, cuts);
                cuts.pop();
            }
        })(0, rowCount, []);

        if (!best) return null;

        let start = 0;
        const rows = best.cuts.map(end => {
            const row = Array.from({ length: end - start }, (_, k) => start + k);
            start = end;
            return row;
        });
        return { scale: best.scale, rows };
    }

    // Re-emit the sized strip as markup. Scaling every car by the same factor
    // keeps the proportions normalizeStrip just worked out, so the only two
    // decisions left are how much to shrink the whole rake and where to break
    // it. Fewer rows always wins — a set that misses one row by half a car is
    // squeezed onto it rather than spilling over — but only as far as
    // STRIP_MIN_CAR_HEIGHT, below which a car stops reading as a vehicle.
    function bakeStrip(strip) {
        const cars = Array.from(strip.querySelectorAll('img'))
            .filter(img => img.naturalHeight || img.getBoundingClientRect().height);
        if (!cars.length) return '';

        const boxes = cars.map(img => img.getBoundingClientRect());
        const heights = boxes.map(box => box.height);
        const widths = boxes.map(box => box.width);
        const shortest = Math.min.apply(null, heights);
        const widest = Math.max.apply(null, widths);
        // Whatever the strip has to fit into RIGHT NOW — a phone in portrait
        // gives a third of the desktop width, and every decision below is
        // relative to it.
        const limit = stripContentWidth();

        // A double-deck coach drawn wider than the whole tooltip has to come
        // down whatever the height rule says — it has no row to spill onto.
        const natural = Math.min(1, limit / widest);
        // Shrinking below the natural size is what needs justifying; the size
        // normalizeStrip chose is always allowed, even for stubby artwork that
        // is already under the minimum.
        const legible = s => s >= natural || s * shortest >= STRIP_MIN_CAR_HEIGHT;

        // Fewest rows first, so a rake that misses one row by half a car is
        // squeezed onto it instead of spilling. Only once a row count proves
        // impossible to render legibly does the next one get a look.
        const most = greedyRows(widths.map(w => w * natural), limit).length;
        let scale = natural, rows = null;

        for (let k = 1; k <= most && !rows; k++) {
            const layout = chooseLayout(widths, k, limit, natural, legible);
            if (layout) { scale = layout.scale; rows = layout.rows; }
        }

        // A rake long enough to blow the search budget, or one whose artwork is
        // already below the legible height: fall back to the even split at the
        // natural size, wrapped greedily if even that can't be cut.
        if (!rows) {
            const sized = widths.map(w => w * natural);
            const fallback = greedyRows(sized, limit);
            rows = balancedRows(sized, fallback.length, limit);
        }

        // Widths are written out alongside the heights, and the strip is given
        // the width of its longest row, so the panel measures the same on its
        // first layout as on its last. Left to `width:auto` a car has no width
        // until its image resolves, so the tooltip was measured narrow, placed
        // to the right of the cursor, and then thrown back against the left
        // edge a frame later when the rake finally took up its real space.
        const rowWidths = rows.map(row =>
            row.reduce((sum, i) => sum + widths[i] * scale, 0));

        return `<div class="statsTipMedia strip" style="width:${
            Math.max.apply(null, rowWidths).toFixed(1)}px">` + rows.map(row =>
            '<div class="statsTipStripRow">' + row.map(i => {
                return `<img src="${escapeHtml(cars[i].src)}" alt=""`
                    + ` style="width:${(widths[i] * scale).toFixed(1)}px`
                    + `;height:${(heights[i] * scale).toFixed(1)}px"`
                    + ` onerror="this.style.display='none'">`;
            }).join('') + '</div>'
        ).join('') + '</div>';
    }

    // The width the cached markup was cut for is no longer the width on screen
    // — a rotation, a resized window. Everything baked at the old width is
    // wrong, and the oven goes with it so the rebuilt strips start clean.
    //
    // Rebuilding immediately rather than just emptying the cache: `prepare`
    // only runs when a chart's formatter is built, so a strip dropped now and
    // not replaced would leave the tooltip picture-less until the next render.
    function restripForWidth() {
        const width = stripContentWidth();
        if (width === stripCacheWidth) return;
        stripCacheWidth = width;

        const known = stripUnits;
        stripUnits = {};
        stripCache = {};
        if (stripOven) stripOven.innerHTML = '';
        Object.keys(known).forEach(key => ensureStrip(key, known[key]));
    }

    function ensureStrip(key, units) {
        restripForWidth();      // width is settled first; no recursion after
        if (key in stripCache || !units || !units.length) return;
        stripUnits[key] = units;
        stripCache[key] = '';   // claim it, so a second pass doesn't rebuild

        const strip = document.createElement('div');
        strip.style.cssText = 'display:flex;align-items:flex-end;';
        units.forEach((unit, index) => {
            const img = document.createElement('img');
            if (unit.image) {
                img.src = wagonImgSrc(WAGON_BASE, unit);
                if (unit.px_per_meter) img.setAttribute('data-ppm', unit.px_per_meter);
            } else {
                // normalizeStrip knows this class and scales the outline to sit
                // at the same real-world scale as the drawn cars beside it.
                img.className = 'wagon-placeholder-img';
                img.src = placeholderSrc(unit, index === 0, index === units.length - 1);
            }
            strip.appendChild(img);
        });
        ovenElement().appendChild(strip);

        // onApply fires again as each image finishes loading, so the cache
        // converges on the fully-sized version. An image that lands after a
        // resize belongs to the discarded build and must not overwrite the
        // strip that has since been cut for the new width.
        const builtFor = stripCacheWidth;
        normalizeStrip(strip, {
            target: 40, min: 18, max: 70,
            onApply: function () {
                if (builtFor !== stripCacheWidth) return;
                stripCache[key] = bakeStrip(strip);
            }
        });
    }

    // The operator's mark, standing to the left of the line it runs. Purely an
    // illustration — the name is not spelled out, so it stays on the `title` for
    // anyone who needs it. Nothing is emitted when there is no logo, rather than
    // an empty box holding the row open.
    function operatorMark(operator) {
        // The ORIGINAL file, not the resized one. resize_image pastes every logo
        // onto a fixed 240x40 transparent canvas, right-aligned — all 356 of
        // them are that exact size. In the axis gutter that is invisible and
        // even useful: the box has the same 6:1 ratio and the padding pushes
        // each logo flush against the axis. As a flex item it is not invisible
        // at all, because the box includes the transparent margin, so a narrow
        // mark floated right and a wide one didn't, and no two rows lined up.
        const logo = operator && operatorLogoFullUrl(operator);
        if (!logo) return '';
        return `<img class="statsTipLineLogo" src="${escapeHtml(logo)}"`
            + ` alt="${escapeHtml(operator)}" title="${escapeHtml(operator)}"`
            + ` onerror="this.style.display='none'">`;
    }

    function categoryKey(item) {
        return item.label || item.trainset;
    }

    function mediaStrip(item) {
        return stripCache[categoryKey(item)] || '';
    }

    function prepareStrip(item) {
        ensureStrip(categoryKey(item), item.units);
    }

    function mediaPhoto(photo) {
        const credit = photo.link
            ? `<a class="statsTipCredit" href="${escapeHtml(photo.link)}" target="_blank"`
              + ` rel="noopener">${escapeHtml(photo.attr)}</a>`
            : '';
        return `<div class="statsTipMedia hasPhoto"><img class="photo" src="${escapeHtml(photo.thumb)}" alt="">`
            + `${credit}</div>`;
    }

    function commonTooltipFormatter(params, images, mediaHtml) {
        const config = METRICS_CONFIG[currentMetric];
        const name = params[0].name;
        const media = mediaHtml !== undefined
            ? mediaHtml
            : (customMediaHtml || mediaArt(images && images[name], false));
        // A spec may supply its own heading — the lines chart labels its number
        // and credits the operator under it — otherwise it is just the name.
        let result = `<div class="statsTip">${media}`
            + (customHeaderHtml || `<div class="statsTipTitle">${escapeHtml(name)}</div>`);

        if (isCombinedMode) {
            // Group by trip type
            const byTripType = {};
            let totalPast = 0;
            let totalFuture = 0;
            
            params.forEach(item => {
                if (item.value > 0) {
                    // Extract trip type and status from series name
                    const match = item.seriesName.match(/^(.+?) \(({{past}}|{{plannedFuture}})\)$/);
                    if (match) {
                        const tripTypeLabel = match[1];
                        const status = match[2];
                        
                        if (!byTripType[tripTypeLabel]) {
                            byTripType[tripTypeLabel] = { past: 0, future: 0 };
                        }
                        
                        if (status === '{{past}}') {
                            byTripType[tripTypeLabel].past = item.value;
                            totalPast += item.value;
                        } else {
                            byTripType[tripTypeLabel].future = item.value;
                            totalFuture += item.value;
                        }
                    }
                }
            });
            
            // Display grouped by trip type
            Object.keys(byTripType).forEach(tripTypeLabel => {
                const data = byTripType[tripTypeLabel];
                result += `<div class="statsTipGroup">${tripTypeLabel}</div>`;

                if (data.past > 0) {
                    result += `<div class="statsTipRow statsTipSub">{{past}}: ${config.formatValue(data.past)}</div>`;
                }
                if (data.future > 0) {
                    result += `<div class="statsTipRow statsTipSub">{{plannedFuture}}: ${config.formatValue(data.future)}</div>`;
                }
            });
            
            // Add totals
            if (totalPast > 0 || totalFuture > 0) {
                result += '<div class="statsTipGroup">Total</div>';
                if (totalPast > 0) {
                    result += `<div class="statsTipRow statsTipSub">{{past}}: ${config.formatValue(totalPast)}</div>`;
                }
                if (totalFuture > 0) {
                    result += `<div class="statsTipRow statsTipSub">{{plannedFuture}}: ${config.formatValue(totalFuture)}</div>`;
                }
            }
        } else {
            params.forEach(function(item) {
                if (item.value > 0) {
                    let marker;
                    if (item.seriesName === '{{plannedFuture}}') {
                        const pattern = createPattern(getColor(tripType));
                        const patternURL = pattern.image.toDataURL();
                        marker = `<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background:url(${patternURL});"></span>`;
                    } else {
                        marker = item.marker;
                    }
                    result += `<div class="statsTipRow">${marker} ${item.seriesName}: ${config.formatValue(item.value)}</div>`;
                }
            });
        }

        return result + '</div>';
    }

    // One gutter for every horizontal category chart, whether it fills it with
    // country names, operator logos, wagons — or nothing at all.
    //
    // Sizing each chart to its own content was tidier per chart and worse as a
    // page: the plots started at a different offset in every card, so the grid
    // read as ragged. Reserving the same strip everywhere lines the bars up
    // across all nine, at the cost of some plotting width on the charts that
    // put their names on the bars instead.
    function categoryGutter() {
        return isMobile() ? 60 : 120;
    }

    function hGridConfig(gutterPx) {
        return { bottom: '28px', left: gutterPx + 'px', right: '20px' };
    }

    function yGridConfig() {
        return { bottom: '28px', left: '28px' };
    }

    // Metrics measured in seconds get the time-aware axis.
    function isDurationLike(metric) {
        return metric === 'duration' || metric === 'delay';
    }

    function valueAxisConfig(maxValue, axisBreak) {
        // The duration axis sizes its unit and tick spacing from the values, and
        // a break changes which values matter — so it needs telling. Everything
        // else keeps ECharts' own tick choice either way.
        const config = isDurationLike(currentMetric)
            ? getDurationAxisConfig(maxValue, LANG, axisBreak)
            : commonValAxisOptions();

        if (axisBreak) {
            config.breaks = [{ start: axisBreak.start, end: axisBreak.end, gap: '3%' }];
            config.breakArea = { expandOnClick: true };
        }
        return config;
    }

    function commonValAxisOptions() {
        return {
            type: 'value',
            min: undefined,
            max: undefined,
            interval: undefined,
            // Trips are whole things. On a chart whose bars are 1 and 2, ECharts
            // otherwise offers 0.5 and 1.5, which are not a number of trips.
            // Distances, durations and emissions are continuous, so they keep
            // their fractional ticks.
            minInterval: currentMetric === 'trips' ? 1 : undefined,
            axisLabel: {
                hideOverlap: true,
                formatter: function (value) {
                    if (currentMetric === 'km') {
                        return mToKm(value) + ' km';
                    }
                    else if (currentMetric === 'carbon') {
                        return value >= 1e9 ? (value / 1e9) + ' Mt' : value >= 1e6 ? (value / 1e6) + ' kt' : value >= 1e3 ? (value / 1e3) + ' t' : value + ' kg';
                    }
                    // Trimmed rather than printed raw: a break edge lands on
                    // values like 6.720000000000001 otherwise.
                    return value >= 1000
                        ? trimNumber(value / 1000) + 'k'
                        : trimNumber(value);
                }
            }
        };
    }

    function commonCatAxisOptions() {
        return {
            type: 'category',
            axisLabel: {
                rotate: 40,
                hideOverlap: true,
                formatter: function (value) {
                    return expandedMode ? value : truncateLabel(value);
                }
            }
        };
    }

    // Tooltips render synchronously from what we already have — the airframe
    // silhouette — and upgrade in place if a photo of the actual aircraft comes
    // back. ECharts' three-argument formatter exists exactly for this: return
    // now, call back later. Nothing is fetched until a bar is hovered, and a
    // failed or absent photo just leaves the silhouette showing.
    // Set for the duration of a formatter call so commonTooltipFormatter can
    // reach it without threading another argument through every caller.
    var customMediaHtml = '';
    var customHeaderHtml = '';

    function asyncPhotoFormatter(spec, rows, images) {
        const byCategory = {};
        rows.forEach(item => { byCategory[categoryOf(spec, item)] = item; });
        // Anything the spec wants ready before the first hover (a consist strip
        // has to be measured off-screen first).
        if (spec.prepare) rows.forEach(spec.prepare);

        // Rendered cards, by category. ECharts re-runs the formatter as the
        // pointer moves inside a row; handing back the identical string lets it
        // skip work, and costs one entry per hovered bar.
        const cards = {};

        return function (params, ticket, callback) {
            const name = params[0].name;
            const art = images && images[name];
            const key = spec.photoKey && spec.photoKey(byCategory[name]);
            // Resolved per hover, not per render: a strip is only sized once its
            // images have loaded, which is after the chart is drawn.
            customMediaHtml = spec.media && byCategory[name]
                ? (spec.media(byCategory[name]) || '') : '';
            customHeaderHtml = spec.tooltipHeader && byCategory[name]
                ? (spec.tooltipHeader(byCategory[name], name) || '') : '';

            const card = photo => commonTooltipFormatter(params, images,
                photo ? mediaPhoto(photo) : mediaArt(art, false));

            // Nothing to look up: draw the silhouette and be done.
            if (!key) return commonTooltipFormatter(params, images);

            // Looked up before — render the answer with no loading state.
            if (key in photoResults) {
                if (!(name in cards)) cards[name] = card(photoResults[key]);
                return cards[name];
            }

            // Always call back, photo or not: on a miss this is what clears the
            // loading sweep, which would otherwise run forever.
            requestAircraftPhoto(key).then(photo => {
                cards[name] = card(photo);
                callback(ticket, cards[name]);
            });

            return commonTooltipFormatter(params, images, mediaArt(art, true));
        };
    }

    // Keep the panel still while the pointer stays on one bar.
    //
    // The default is to re-place the tooltip from the raw pointer position on
    // every mousemove, which for a panel carrying a photo or a whole rake reads
    // as the thing sliding around under the cursor. Instead the anchor is taken
    // once, when the hovered row changes, and held for as long as the pointer
    // stays on that row: moving along a bar leaves it perfectly still, and
    // moving between bars steps it once.
    //
    // Anchoring on the pointer rather than converting the axis to pixels keeps
    // this correct under `appendToBody`, where tooltip and chart coordinates do
    // not share an origin.
    function rowAnchoredPosition(spec) {
        let anchoredIndex = null;
        let acrossBars = null;   // set once, when the chart is first hovered
        let alongBars = null;    // reset whenever the hovered bar changes
        let widestBox = 0;
        let tallestBox = 0;
        let placed = null;       // the coordinates handed back for that bar
        let placedFor = '';

        return function (point, params, dom, rect, size) {
            const index = params && params[0] ? params[0].dataIndex : null;

            // One bar, one position. ECharts asks again on every mousemove and
            // hands back a contentSize measured from the panel as it currently
            // stands, which for a consist strip settles over a frame or two as
            // the rows take their heights; re-deriving the placement from that
            // had the panel twitching for as long as the pointer sat still.
            //
            // Held rather than cached outright, and the test is whether the
            // panel still FITS where it was put, not whether the arithmetic
            // came out the same. A box that grew as it rendered gives a
            // different answer every frame while remaining perfectly well
            // placed; only a box that no longer fits inside the chart has
            // actually earned a move.
            const stamp = index + '@' + size.viewSize.join('x');
            const settle = candidate => {
                const [viewW, viewH] = size.viewSize;
                const [boxW, boxH] = size.contentSize;
                const fits = placed && stamp === placedFor
                    && placed[0] + boxW <= viewW - 5 && placed[1] + boxH <= viewH - 5;
                if (!fits) placed = candidate;
                placedFor = stamp;
                return placed;
            };

            // Without hover there is no "the pointer is still on this row", so
            // none of the anchoring below applies. A tap is a single event at an
            // arbitrary spot, and the latched anchor — taken from whichever bar
            // happened to be tapped first — would place every later panel from a
            // position the finger left long ago.
            //
            // So on touch the panel is parked, not anchored: centred across the
            // chart and pinned to whichever half the tap did NOT land in, so it
            // never covers the bar it describes. Measured live rather than from
            // the high-water box, because a phone-width chart is easily narrower
            // than the widest panel it can produce and clamping to that would
            // push every panel to the same corner.
            //
            // A narrow window on a desktop lands here too — the test folds in
            // screen width — so this branch does get a live pointer moving
            // across it, and it has to hold still under one just like the
            // hover branch does. Which half the panel parks in is decided from
            // the pointer's first position on the bar, not its latest: deciding
            // it live flipped the panel top-to-bottom as the cursor crossed the
            // middle of the chart.
            if (isTouchTooltip()) {
                const [viewW, viewH] = size.viewSize;
                const [boxW, boxH] = size.contentSize;
                if (index !== anchoredIndex) {
                    anchoredIndex = index;
                    alongBars = point[1];
                }
                const x = Math.max(6, Math.min((viewW - boxW) / 2, viewW - boxW - 6));
                const y = alongBars > viewH / 2 ? 6 : Math.max(6, viewH - boxH - 6);
                return settle([x, y]);
            }

            if (acrossBars === null) {
                acrossBars = spec && spec.vertical ? point[1] : point[0];
            }
            if (index !== anchoredIndex) {
                anchoredIndex = index;
                alongBars = spec && spec.vertical ? point[0] : point[1];
            }

            const [viewWidth, viewHeight] = size.viewSize;
            // Clamp against the largest panel this chart has produced, not the
            // one on screen. Row panels differ in size — a ten-car rake is far
            // wider than a single railcar — and clamping to each in turn walks
            // the panel back and forth as you move down the list. Taking the
            // high-water mark makes it settle: it steps aside once for the
            // widest row and then holds still.
            widestBox = Math.max(widestBox, size.contentSize[0]);
            tallestBox = Math.max(tallestBox, size.contentSize[1]);
            const boxWidth = widestBox;
            const boxHeight = tallestBox;

            // Neither coordinate tracks the pointer. Following the axis the
            // bars run along looked harmless — that axis carries no row
            // information — but the pointer never travels down a list in a
            // straight line, so every step sideways slid the panel. It moves
            // once per bar, and only across them.
            let x = spec && spec.vertical ? alongBars : acrossBars;
            let y = spec && spec.vertical ? acrossBars : alongBars;

            // Offset off the cursor so the panel never sits under it.
            x += 16;
            y += 16;

            x = Math.max(6, Math.min(x, viewWidth - boxWidth - 6));
            y = Math.max(6, Math.min(y, viewHeight - boxHeight - 6));
            return settle([x, y]);
        };
    }

    function commonTooltipConfig(spec, rows) {
        const images = tooltipImages(spec, rows);
        return {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            extraCssText: 'border-radius:8px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);', borderWidth: 0,
            formatter: asyncPhotoFormatter(spec, rows, images),
            confine: true,   // keep the panel inside the chart box
            // Positions returned by `position` are chart-relative either way,
            // but under appendToBody ECharts converts them to page coordinates
            // against document.body. That conversion is taken once, when the
            // panel is placed, so anything that moves the chart afterwards —
            // scrolling on a phone, a URL bar collapsing and reflowing the page —
            // leaves the panel behind at the old page position. Kept off touch,
            // where the panel then lives in the chart container and moves with it.
            appendToBody: !isTouchTooltip(),
            position: rowAnchoredPosition(spec)
        };
    }

    // ============================================
    // BROKEN VALUE AXIS
    // ============================================
    // Scattered data leaves one bar — usually "others" — dozens of times the
    // runner-up, which flattens every other bar to a hairline. Measured on real
    // accounts the ratio is routinely 20-90x.
    //
    // ECharts 6 draws this natively: `breaks` collapses a stretch of the scale
    // and `breakArea` renders the torn-paper zigzag across both the bar and the
    // axis, with click-to-expand to restore the true ratio. That replaced a
    // hand-drawn version of the same idea — clipping the axis and painting the
    // cut with `graphic` elements — which had to recompute pixel geometry on
    // every resize and could not be expanded.
    var AXIS_BREAK_RATIO = 6;       // dominant bar must be this many times #2
    var AXIS_BREAK_HEADROOM = 1.12; // air above #2 before the scale is cut
    var AXIS_BREAK_TAIL = 0.1;      // how much scale the cut bar keeps past the cut

    function computeAxisBreak(values) {
        if (!axisBreakEnabled) return null;
        // Two bars can't be "one outlier and the rest"; there is no rest.
        if (values.length < 3) return null;

        const ranked = values.slice().sort((a, b) => b - a);
        const [top, runnerUp] = ranked;
        if (!(runnerUp > 0) || top < runnerUp * AXIS_BREAK_RATIO) return null;

        // Everything below the cut keeps its resolution; beyond it the dominant
        // bar gets a short stub, so it still reads as running off the scale
        // rather than stopping there.
        //
        // Both edges become axis ticks, so they are snapped to round numbers —
        // straight off the ratio they read as 6.720000000000001 and 286.328.
        //
        // One step for both, taken from the magnitude of the LOWER edge: that is
        // the end of the scale the small bars live on, so it sets how fine the
        // reading has to be, and using it for both keeps the two edges on the
        // same footing as each other and as the ticks around them. 6720 and
        // 130593 become 7000 and 130000, not 6800 and 130000.
        //
        // A duration is not read in powers of ten — 500000 seconds is not a
        // round anything — so there the step is the unit the near side of the cut
        // is labelled in, which puts both edges on whole days or whole hours like
        // every other tick.
        //
        // The far edge takes the same small step, not the coarse unit the top
        // segment is labelled in: the step is how much scale is left beyond the
        // cut, and the width the segment is given follows that span directly. A
        // week-wide stub takes most of the chart with it.
        const from = runnerUp * AXIS_BREAK_HEADROOM;
        const to = top - from * AXIS_BREAK_TAIL;
        const step = isDurationLike(currentMetric)
            ? brokenDurationScale(from, top).divisor
            : Math.pow(10, Math.floor(Math.log10(from)));

        const start = snap(Math.ceil(from / step) * step);
        // Nearest, not down: flooring turned 130593 into 129000 when 130000 is
        // the tick everyone expects.
        //
        // Held a whole step below the dominant bar, so there is always a stub of
        // it left beyond the cut. Rounding to the top itself left none — the
        // tear ended up pinned to the right edge with nothing after it, which
        // reads as a rendering fault rather than a bar running off the scale.
        const end = snap(Math.min(
            Math.round(to / step) * step,
            (Math.ceil(top / step) - 1) * step));
        return end > start ? { start: start, end: end } : null;
    }

    // Multiplying back up by a fractional step reintroduces the dust the
    // rounding was there to remove (68 * 0.1 = 6.800000000000001).
    function snap(value) {
        return Number(value.toPrecision(12));
    }

    // ============================================
    // CHART GRID
    // ============================================
    // A chart earns a slot when its trip type can show it, its dataset came back
    // with something, and the user hasn't switched it off in the gear modal.
    function visibleCharts(data) {
        return applicableCharts().filter(spec =>
            !hiddenCharts.has(spec.key) && (data[spec.dataset] || []).length > 0);
    }

    function buildChartGrid(specs) {
        const grid = document.getElementById('chartGrid');
        // ECharts keeps internal state tied to the DOM node it was initialised
        // on, so instances have to be disposed before the nodes go away.
        Object.values(chartsInstances).forEach(chart => chart.dispose());
        chartsInstances = {};

        grid.innerHTML = specs.map(spec => `
            <div class="col">
                <div class="chart-container position-relative">
                    <button class="btn btn-light btn-sm expand-button position-absolute top-0 end-0 m-2"
                            data-chart-key="${spec.key}" style="z-index: 1000;">
                        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                    </button>
                    <div id="chart-${spec.key}" style="width: 100%; height: 400px;"></div>
                </div>
            </div>
        `).join('');

        grid.querySelectorAll('.expand-button').forEach(button => {
            button.addEventListener('click', () => expandChart(button.dataset.chartKey));
        });
    }

    function categoryOf(spec, item) {
        return spec.category ? spec.category(item) : item[spec.idKey];
    }

    // Pictures on the category axis win over an inline label: on the material
    // chart for flights the axis carries the airframe silhouette while the name
    // still rides on the bar. When there is no artwork for these rows the chart
    // degrades to whatever it would have shown anyway.
    function usesAxisImages(spec, rows) {
        return Boolean(spec.axisImage && spec.image && rows.some(item => spec.image(item)));
    }

    // Share of a chart's rows whose name must fit the gutter before the gutter
    // is used for names at all. Not all of them: one long outlier shouldn't
    // push a whole chart's labels onto its bars.
    var AXIS_NAME_FIT_RATIO = 0.8;
    var INLINE_GUTTER_PX = 10;
    var FULLSCREEN_GUTTER_PX = 300;

    // What the category axis carries, and how much room to keep for it.
    //
    // Reserving the full gutter everywhere lined the bars up but left a blank
    // strip on any chart with nothing to put there. Sizing it per chart avoided
    // the blank but made the grid ragged. So: a chart with no pictures puts its
    // names in the gutter when they FIT there — material types and power types
    // are short, and then they read exactly like the country chart — and only
    // falls back to labels-on-bars, with the gutter given up, when they don't.
    // Routes and stations never fit; nearly everything else does.
    function categoryAxisPlan(spec, rows, categories, gutterPx) {
        if (usesAxisImages(spec, rows)) return { mode: 'images', gutter: gutterPx };
        if (!spec.inlineLabel) return { mode: 'axis', gutter: gutterPx };

        const budget = gutterPx - 12;
        const fits = categories.filter(name => measureLabelWidth(name) <= budget).length;
        if (categories.length && fits / categories.length >= AXIS_NAME_FIT_RATIO) {
            return { mode: 'names', gutter: gutterPx, budget: budget };
        }
        return { mode: 'inline', gutter: INLINE_GUTTER_PX };
    }

    function categoryAxisLabel(spec, rows, plan) {
        if (plan.mode === 'images') return imageAxisLabelConfig(spec, rows);
        if (plan.mode === 'names') {
            return { hideOverlap: true, formatter: value => fitLabel(value, plan.budget) };
        }
        // Labels ride on the bars, so the axis itself stays blank.
        if (plan.mode === 'inline') return { show: false };
        return spec.axisLabel ? spec.axisLabel() : { hideOverlap: true };
    }

    function renderChart(spec, rows) {
        const element = document.getElementById('chart-' + spec.key);
        if (!element) return;

        const chart = echarts.init(element);
        chartsInstances[spec.key] = chart;

        const color = getColor(tripType);
        const categories = rows.map(item => categoryOf(spec, item));
        const axisBreak = computeAxisBreak(rows.map(itemTotal));
        const valueAxis = valueAxisConfig(calculateMaxValue(rows), axisBreak);
        const barMaxWidth = barThicknessCap(element, spec.vertical);
        const plan = categoryAxisPlan(spec, rows, categories, categoryGutter());
        const labelBudgetPx = labelBudget(element, plan.gutter, axisBreak, calculateMaxValue(rows));
        // Names go on the bars unless the axis is already showing them. With
        // pictures in the gutter both belong: the silhouette says what kind of
        // thing it is, the bar says which one. Tying this to the 'inline' mode
        // alone silently stripped the names off every picture chart.
        const labelFormatter = spec.inlineLabel && plan.mode !== 'names'
            ? (params => fitLabel(spec.inlineLabel(params.name), labelBudgetPx))
            : undefined;

        if (spec.vertical) {
            chart.setOption({
                title: { text: spec.title },
                tooltip: commonTooltipConfig(spec, rows),
                xAxis: { ...commonCatAxisOptions(), data: categories },
                yAxis: valueAxis,
                grid: yGridConfig(),
                series: createSeries(rows, color, undefined, undefined, barMaxWidth)
            });
            return;
        }

        chart.setOption({
            title: { text: spec.title },
            tooltip: commonTooltipConfig(spec, rows),
            yAxis: {
                type: 'category',
                inverse: true,
                axisLabel: categoryAxisLabel(spec, rows, plan),
                data: categories
            },
            xAxis: valueAxis,
            grid: hGridConfig(plan.gutter),
            series: createSeries(rows, color, labelFormatter, undefined, barMaxWidth)
        });

        if (labelFormatter) applyInlineLabels(chart, rows, color, labelFormatter, barMaxWidth, axisBreak);
    }

    function renderCharts(data) {
        const specs = visibleCharts(data);
        buildChartGrid(specs);

        document.querySelector('.noDataDiv').style.display = specs.length ? 'none' : '';

        specs.forEach(spec => {
            const rows = data[spec.dataset] || [];
            // The time series shows every bucket; ranked charts collapse their
            // tail into a single "others" row unless we are in fullscreen.
            const display = (spec.vertical || expandedMode)
                ? rows
                : groupData(rows, spec.idKey);
            renderChart(spec, display);
        });

        // Resize once the grid has settled into its final column widths.
        setTimeout(() => {
            Object.values(chartsInstances).forEach(resizeChart);
        }, 50);
    }

    // ============================================
    // DATA FETCHING
    // ============================================
    var IS_ADMIN = "{{ 'true' if admin else 'false' }}" === "true";

    // The JSON endpoint, which is a different thing from the page URL that
    // statsPageUrl builds — these two were both called statsUrl once, and since
    // function declarations hoist, the address bar ended up pointing at the API.
    function statsApiUrl(type) {
        const base = IS_ADMIN ? '/admin/getStats' : `/u/${username}/getStats`;
        return statYear ? `${base}/${statYear}/${type}` : `${base}/${type}`;
    }

    async function fetchStatsData() {
        try {
            const response = await fetch(statsApiUrl(tripType));
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error('Error fetching stats:', error);
            return null;
        }
    }

    // One request per trip type, several in flight at once. In sequence a user
    // with a dozen trip types waited on a dozen round trips end to end, each
    // running a full set of stats queries.
    //
    // Bounded rather than all-at-once, though: every request is a handful of
    // aggregates over the trips table, and on the all-users admin view that is
    // a full scan apiece. Releasing twenty of those simultaneously trades one
    // slow page for a database everyone else is waiting behind.
    var COMBINED_FETCH_CONCURRENCY = 4;

    async function fetchCombinedStatsData() {
        const queue = AVAILABLE_TRIP_TYPES.slice();
        const collected = {};

        async function worker() {
            while (queue.length) {
                const type = queue.shift();
                try {
                    const response = await fetch(statsApiUrl(type));
                    if (response.ok) collected[type] = await response.json();
                } catch (error) {
                    console.error(`Error fetching stats for ${type}:`, error);
                }
            }
        }

        await Promise.all(
            Array.from({ length: Math.min(COMBINED_FETCH_CONCURRENCY, queue.length) }, worker)
        );
        return collected;
    }

    // The rows to draw right now: the cached payload reduced to the selected
    // metric, and folded across trip types when showing everything at once.
    function currentDisplayData() {
        if (isCombinedMode) {
            if (!combinedStatsData) return {};
            const extractedByType = {};
            Object.keys(combinedStatsData).forEach(type => {
                extractedByType[type] = extractDataForMetric(combinedStatsData[type], currentMetric);
            });
            return mergeCombinedData(extractedByType);
        }
        return statsData ? extractDataForMetric(statsData, currentMetric) : {};
    }

    async function fetchDataAndRenderCharts() {
        showLoading();
        try {
            if (isCombinedMode) {
                combinedStatsData = await fetchCombinedStatsData();
                // Codes are unique across the air payloads, so one flat map
                // serves every type that contributed airports.
                airportCities = Object.assign({}, ...Object.values(combinedStatsData)
                    .map(data => data.airportCities || {}));
            } else {
                statsData = await fetchStatsData();
                if (!statsData) console.error('No data available');
                airportCities = (statsData && statsData.airportCities) || {};
            }
            renderCharts(currentDisplayData());
        } catch (error) {
            console.error('Error processing data:', error);
        } finally {
            hideLoading();
        }
    }

    // ============================================
    // METRIC SWITCHING
    // ============================================
    async function switchMetric(newMetric) {
        if (!METRICS_CONFIG[newMetric]?.enabled) return;

        currentMetric = newMetric;
        // The address follows, but the page does not reload: every metric is in
        // the payload already, so switching is a re-render. Replace rather than
        // push — the metric is a way of looking at the page, not a page of its
        // own, and a back button that walks through every metric you tried is a
        // nuisance.
        history.replaceState(null, '', statsPageUrl(statYear, tripType, currentMetric));
        renderCharts(currentDisplayData());
    }

    // ============================================
    // FULLSCREEN
    // ============================================
    // Re-render one chart, alone, filling the window. Uses the same registry
    // entry as the small version — only the layout, the scroll slider and the
    // full (ungrouped) row set differ.
    function expandChart(chartKey) {
        const spec = chartByKey(chartKey);
        if (!spec) return;

        expandedMode = true;
        const fullscreenContainer = document.getElementById('fullscreenContainer');
        const fullscreenChart = document.getElementById('fullscreenChart');
        fullscreenContainer.style.display = 'block';
        fullscreenChart.innerHTML = '';

        const chartInstance = echarts.init(fullscreenChart);
        const rows = currentDisplayData()[spec.dataset] || [];
        const color = getColor(tripType);
        const categories = rows.map(item => categoryOf(spec, item));
        const axisBreak = computeAxisBreak(rows.map(itemTotal));
        const valueAxis = valueAxisConfig(calculateMaxValue(rows), axisBreak);
        // Fullscreen has the whole window, so far more names fit the gutter; and
        // a dataZoom slider parked on the right that a label must not run under.
        const plan = categoryAxisPlan(spec, rows, categories, FULLSCREEN_GUTTER_PX);
        const labelBudgetPx = labelBudget(fullscreenChart, plan.gutter, axisBreak, calculateMaxValue(rows)) - 60;
        const barMaxWidth = barThicknessCap(fullscreenChart, spec.vertical);
        const labelFormatter = spec.inlineLabel && plan.mode !== 'names'
            ? (params => fitLabel(spec.inlineLabel(params.name), labelBudgetPx))
            : undefined;
        const fullscreenImages = tooltipImages(spec, rows);

        const option = {
            title: { text: spec.title },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                extraCssText: 'border-radius:8px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);', borderWidth: 0,
                confine: true,
                position: rowAnchoredPosition(spec),
                formatter: asyncPhotoFormatter(spec, rows, fullscreenImages)
            },
            // containLabel still grows the gutter to fit real axis-label content
            // (country names, operator logos) — this just removes the default
            // ~10% padding that was reserved on top of that.
            grid: { containLabel: true, left: '10px', width: '80%', height: '85%', bottom: '10%', top: '10%' },
            series: createSeries(rows, color, labelFormatter, undefined, barMaxWidth)
        };

        if (spec.vertical) {
            option.xAxis = {
                type: 'category',
                axisLabel: { rotate: 45, hideOverlap: true },
                data: categories
            };
            option.yAxis = valueAxis;
        } else {
            option.yAxis = {
                type: 'category',
                inverse: true,
                axisLabel: categoryAxisLabel(spec, rows, plan),
                data: categories
            };
            option.xAxis = valueAxis;
            // Ranked charts can be thousands of rows long; scroll through them
            // twenty at a time.
            option.dataZoom = [{
                type: 'slider',
                yAxisIndex: 0,
                top: '70px',
                right: '20px',
                startValue: 0,
                endValue: 20
            }];
        }

        chartInstance.setOption(option);
        applyInlineLabels(chartInstance, rows, color, labelFormatter, barMaxWidth, axisBreak);
        // Scrolling the slider rescales the value axis, so the fit decision has
        // to be made again for the rows now on screen.
        var relayoutting = false;
        chartInstance.on('dataZoom', function () {
            if (relayoutting || !chartInstance.relayoutLabels) return;
            relayoutting = true;
            chartInstance.relayoutLabels();
            relayoutting = false;
        });
        currentChart = chartInstance;
    }

    document.getElementById('closeFullscreenButton').addEventListener('click', function() {
        expandedMode = false;
        document.getElementById('fullscreenContainer').style.display = 'none';
        if (currentChart) {
            currentChart.dispose();
            currentChart = null;
        }

        renderCharts(currentDisplayData());
    });

    // ============================================
    // CHART SETTINGS MODAL
    // ============================================
    // Lists every chart this trip type can show, whether or not it currently
    // has data, so a chart that is empty this year is still findable.
    function buildChartSettings() {
        const list = document.getElementById('chartSettingsList');
        const options = document.getElementById('chartSettingsOptions');

        options.innerHTML = `
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="axisBreakToggle"
                       ${axisBreakEnabled ? 'checked' : ''}>
                <label class="form-check-label" for="axisBreakToggle">{{statsAxisBreak}}</label>
                <div class="text-muted small">{{statsAxisBreakHelp}}</div>
            </div>
        `;
        options.querySelector('#axisBreakToggle').addEventListener('change', function () {
            axisBreakEnabled = this.checked;
            saveAxisBreakEnabled(axisBreakEnabled);
            renderCharts(currentDisplayData());
        });

        list.innerHTML = applicableCharts().map(spec => `
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="${spec.key}"
                       id="chartToggle-${spec.key}" ${hiddenCharts.has(spec.key) ? '' : 'checked'}>
                <label class="form-check-label" for="chartToggle-${spec.key}">${spec.title}</label>
            </div>
        `).join('');

        list.querySelectorAll('input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', function () {
                if (this.checked) {
                    hiddenCharts.delete(this.value);
                } else {
                    hiddenCharts.add(this.value);
                }
                saveHiddenCharts(hiddenCharts);
                renderCharts(currentDisplayData());
            });
        });
    }

    document.getElementById('chartSettingsReset').addEventListener('click', function () {
        hiddenCharts = new Set();
        saveHiddenCharts(hiddenCharts);
        axisBreakEnabled = true;
        saveAxisBreakEnabled(axisBreakEnabled);
        buildChartSettings();
        renderCharts(currentDisplayData());
    });

    // ============================================
    // EVENT HANDLERS
    // ============================================
    // Both selectors navigate: the payload is per year and per trip type, so
    // there is nothing to re-render from. The metric rides along untouched,
    // which is the whole point of it being in the path.
    $("#statsSelectYear").change(function () {
        window.location.href = statsPageUrl($(this).val(), tripType, currentMetric);
    });

    $("#statsSelectTripType").change(function () {
        window.location.href = statsPageUrl(statYear, $(this).val(), currentMetric);
    });

    // ============================================
    // INITIALIZATION
    // ============================================
    async function initializeStats() {
        // The shorter routes still serve this page, and links to them carry two
        // of the three dimensions or fewer. Rewrite the address to the full form
        // so what is in the URL always matches what is on screen.
        history.replaceState(null, '', statsPageUrl(statYear, tripType, currentMetric));

        const wrapper = document.getElementById('metricSelectorWrapper');
        if (wrapper) {
            wrapper.innerHTML = createMetricSelector();
            attachMetricSelectorListener();
        }

        buildChartSettings();
        // In parallel with the stats request: the flag lookup is sync at render
        // time, so the table has to be there before the first draw.
        const registrationsReady = isAirType(tripType) || isCombinedMode
            ? loadRegistrations(REGISTRATIONS_URL).then(table => { registrations = table; })
            : Promise.resolve();
        await Promise.all([registrationsReady, fetchDataAndRenderCharts()]);
    }

    initializeStats();
</script>
