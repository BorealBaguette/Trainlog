{% extends "bootstrap/layout.html" %}
{% block content %}

{% include nav%}

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="{{ url_for('static', filename='js/vehicle_display.js') }}"></script>
<script src="{{ url_for('static', filename='js/wagon_img.js') }}"></script>

<!-- Loading screen -->
<div id="loadingScreen" style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: rgba(255, 255, 255, 0.8); z-index: 9999; display: flex; justify-content: center; align-items: center;">
    <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>

<div id="statsSelectWrapper" class="d-flex flex-wrap mb-3">
    <select id="statsSelectTripType" class="form-select statsSelect mr-2">
        {% set statTypes = publicDistinctTypes if is_public else distinctTypes %}
        <option value="combined" {% if tripType == 'combined' %}selected{% endif %}>
            {{all}}
        </option>
        {% set ns = namespace(group=none) %}
        {% for type, data in statTypes.items() %}
            {% if data.group != ns.group %}
                <option disabled>──────────</option>
            {% endif %}
            {% set ns.group = data.group %}
            <option value="{{ type }}" {% if tripType == type %}selected{% endif %}>
            {{ data.label }}
            </option>
        {% endfor %}
    </select>

    <select id="statsSelectYear" class="form-select statsSelect mr-2">
        <option value="all" {% if not statYear %}selected{% endif %}>{{all}}</option>
        {% for year in distinctStatYears %}
            <option value="{{ year }}" {% if year == statYear %}selected{% endif %}>{{ year }}</option>
        {% endfor %}
    </select>
    
    <div id="metricSelectorWrapper" class="mr-2"></div>

    <!-- statsSelect for the same 10px margin as the selects it sits beside -->
    <button type="button" id="chartSettingsButton" class="btn btn-light border statsSelect"
            data-bs-toggle="modal" data-bs-target="#chartSettingsModal"
            title="{{statsChartSettings}}" aria-label="{{statsChartSettings}}">
        <i class="fa-solid fa-gear"></i>
    </button>
</div>

<div class="noDataDiv" style='display:none;'>
    <br><br><center><h3>{{noData}}</h3></center>
</div>

<div class="container" style="max-width:95%">
    <!-- Populated from the CHARTS registry: which charts exist depends on the
         trip type, on which of them came back with data, and on the user's
         visibility choices (gear button above). -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-xxl-3 g-4" id="chartGrid"></div>
</div>

<div class="modal fade" id="chartSettingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{statsChartSettingsTitle}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{close}}"></button>
            </div>
            <div class="modal-body">
                <div id="chartSettingsOptions" class="mb-3"></div>
                <hr class="my-3">
                <p class="text-muted small">{{statsChartSettingsHelp}}</p>
                <div id="chartSettingsList"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="chartSettingsReset">{{statsChartSettingsReset}}</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">{{close}}</button>
            </div>
        </div>
    </div>
</div>

<div id="fullscreenContainer" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); z-index: 10000;">
    <button id="closeFullscreenButton" class="btn btn-danger position-absolute top-0 end-0 m-2" style="z-index: 10001;">
        <i class="fa-solid fa-xmark"></i>
    </button>
    <div id="fullscreenChart" style="width: 100%; height: 100%; background: rgba(255, 255, 255, 0.75);"></div>
</div>

<div style="height: 100px;"></div>

<style>
/* Toolbar.
   The selects carry `margin: 10px` from .statsSelect while the gear sits in a
   wrapper of its own, so the gaps between neighbours were not all built the
   same way. One `gap` on the flex row, and no horizontal margins inside it,
   makes every control equidistant regardless of how it is nested. */
#statsSelectWrapper { gap: 20px; }
#statsSelectWrapper .statsSelect,
#statsSelectWrapper > * { margin-left: 0; margin-right: 0; }

/* Chart tooltips.
   The media box is a FIXED size in every state — silhouette, loading, photo.
   Letting it size to its content made the tooltip jump when a planespotters
   photo replaced the silhouette, which is the flicker this avoids. */
.statsTip { min-width: 180px; }

.statsTip .statsTipMedia {
    position: relative;
    width: 248px;
    height: 140px;
    margin: -2px -2px 8px -2px;   /* bleed to the tooltip's rounded edge */
    background: #f2f4f6;
    border-radius: 6px 6px 0 0;
    overflow: hidden;
}

.statsTip .statsTipMedia img {
    width: 100%;
    height: 100%;
    display: block;
}

.statsTip .statsTipMedia.hasPhoto { background: transparent; }

/* Silhouettes are transparent artwork on no background: show them whole and
   centred. Photographs fill the frame instead. */
.statsTip .statsTipMedia img.art { object-fit: contain; padding: 10px; }
.statsTip .statsTipMedia img.photo { object-fit: cover; }

/* Deliberately no fade-in. The tooltip's markup is rebuilt on pointer movement
   within a row, so an entry animation restarts every time and strobes the
   backdrop through the half-transparent frames. */

/* Indeterminate sweep while a photo of the real aircraft is being fetched.
   The silhouette stays visible underneath, dimmed, so there is always
   something to look at and nothing moves when the photo lands. */
.statsTip .statsTipMedia.loading img.art { opacity: .45; }

.statsTip .statsTipMedia.loading::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 3px; width: 40%;
    background: linear-gradient(90deg, transparent, #52b0fe, transparent);
    animation: statsTipSweep 1.1s ease-in-out infinite;
}

@keyframes statsTipSweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(350%); }
}

.statsTip .statsTipCredit {
    position: absolute;
    right: 0; bottom: 0;
    padding: 2px 5px;
    font-size: 11px;
    color: #fff;
    background: rgba(0, 0, 0, .45);
    text-decoration: none;
}
.statsTip .statsTipCredit:hover { color: #fff; text-decoration: underline; }

.statsTip .statsTipTitle {
    font-weight: 600;
    margin-bottom: 3px;
}

/* A line reads as "[operator mark] Line: 12" on one row — the logo illustrates
   who runs it without spelling the name out, and the number stays the subject.
   The space before the colon is non-breaking: French sets one there, and it
   must not be what a line wraps on.

   Three things of three different heights sit on this row, so nothing is left
   to inherited layout: the logo centres against the text block, and inside it
   the label and the number sit on a shared BASELINE. Centring those two against
   each other instead is what made it look askew — a 12px word centred on an
   18px one floats above the number's feet. line-height 1 on both keeps the row
   from gaining leading it doesn't need. */
.statsTip .statsTipLineHead {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin: 0 0 8px;
}

.statsTip .statsTipLineLogo {
    flex: 0 0 auto;
    height: 26px;
    width: auto;
    /* Unpadded originals vary wildly in shape — some are wordmarks, some are
       near-square crests — so cap the width and let tall-thin ones shrink to
       fit rather than blowing the row out. */
    max-width: 96px;
    object-fit: contain;
}

.statsTip .statsTipLineText {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
}

.statsTip .statsTipKicker {
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    color: #6b7680;
    white-space: nowrap;
}

.statsTip .statsTipHeadline {
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
}

.statsTip .statsTipRow { white-space: nowrap; }
.statsTip .statsTipGroup { font-weight: 600; margin-top: 4px; }
.statsTip .statsTipSub { padding-left: 10px; }

/* A consist is wide and shallow, and nothing swaps in asynchronously here, so
   this one sizes to its content instead of holding a fixed frame.

   The rake is cut into rows by bakeStrip rather than by `flex-wrap`, because
   the browser's greedy wrap leaves the tail of a long set stranded alone on
   the last row. Each row is its own element, so nothing here may re-wrap. */
.statsTip .statsTipMedia.strip {
    width: auto;
    max-width: 760px;
    row-gap: 4px;
    height: auto;
    min-height: 34px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f7f8f9;
}

.statsTip .statsTipMedia.strip .statsTipStripRow {
    display: flex;
    align-items: flex-end;   /* the cars sit on a rail */
    justify-content: center;
}

.statsTip .statsTipMedia.strip img {
    /* Both dimensions are written onto each car by bakeStrip, so the panel
       measures its final size before a single image has resolved. */
    flex: 0 0 auto;
}

@media (max-width: 750px) {
    .statsTip .statsTipMedia { width: 190px; height: 107px; }
    .statsTip .statsTipMedia.strip { max-width: calc(100vw - 40px); height: auto; }
}
</style>

<script type="text/javascript">
    // ============================================
    // METRICS CONFIGURATION
    // ============================================
    const LANG = "{{langId}}";

    const METRICS_CONFIG = {
        trips: {
            label: '{{trips}}',
            suffix: 'Trips',
            formatValue: (value) => {
                const formatted = new Intl.NumberFormat(LANG).format(value);
                const tripKey = value === 1 ? '{{singularTrip}}' : '{{trips}}';
                return formatted + ' ' + tripKey;
            },
            enabled: true
        },
        km: {
            label: '{{km}}',
            suffix: 'Km',
            // raw value is meters → format as kilometers with unit handled by Intl
            formatValue: (value) => mToKm(value) + ' km',
            enabled: true
        },
        duration: {
            label: '{{tripDuration}}',
            suffix: 'Duration',
            formatValue: (value) => secondsToDhm(value, LANG, "long"),
            enabled: true
        },
        carbon: {
            label: '{{CO2}}',
            suffix: 'CO2',
            formatValue: (value) => formatCarbonFootprint(value, LANG),
            enabled: true
        },
        // Accumulated arrival delay, in seconds. Only trips where a delay was
        // actually recorded contribute, so this is "delay I logged", not an
        // average across everything.
        delay: {
            label: '{{statsDelay}}',
            suffix: 'Delay',
            formatValue: (value) => secondsToDhm(value, LANG, "long"),
            enabled: true
        }
    };

    // Trip type labels for combined mode
    const TRIP_TYPE_LABELS = {
        'air': '{{distinctTypes.air.label if distinctTypes.air else "Air"}}',
        'helicopter': '{{distinctTypes.helicopter.label if distinctTypes.helicopter else "Helicopter"}}',
        'train': '{{distinctTypes.train.label if distinctTypes.train else "Train"}}',
        'tram': '{{distinctTypes.tram.label if distinctTypes.tram else "Tram"}}',
        'metro': '{{distinctTypes.metro.label if distinctTypes.metro else "Metro"}}',
        'bus': '{{distinctTypes.bus.label if distinctTypes.bus else "Bus"}}',
        'ferry': '{{distinctTypes.ferry.label if distinctTypes.ferry else "Ferry"}}',
        'car': '{{distinctTypes.car.label if distinctTypes.car else "Car"}}',
        'cycle': '{{distinctTypes.cycle.label if distinctTypes.cycle else "Cycle"}}',
        'walk': '{{distinctTypes.walk.label if distinctTypes.walk else "Walk"}}',
        'aerialway': '{{distinctTypes.aerialway.label if distinctTypes.aerialway else "Aerialway"}}'
    };

    // Available trip types from backend
    const AVAILABLE_TRIP_TYPES = [
        {%if is_public %}
            {% for type in publicDistinctTypes.keys() %}'{{ type }}',{% endfor %}
        {%else%}
            {% for type in distinctTypes.keys() %}'{{ type }}',{% endfor %}
        {% endif %}
    ];

    function getEnabledMetrics() {
        return Object.keys(METRICS_CONFIG).filter(key => METRICS_CONFIG[key].enabled);
    }

    // ============================================
    // GLOBAL STATE & UTILITIES
    // ============================================
    var tripType = "{{tripType}}";
    var username = "{{username}}";
    var statYear = "{{statYear if statYear else ''}}";
    var yearDefined = "{{ 'true' if statYear is not none else 'false' }}";

    var isCombinedMode = tripType === 'combined';
    
    // Year, trip type and metric are the three dimensions of this page and they
    // are equally important, so all three live in the path, in that order. "all"
    // is the year that means every year: a real segment rather than an omitted
    // one, which is what keeps the form unambiguous.
    //
    // Built by substitution rather than by string concatenation so the shape of
    // the URL stays Flask's business — the three route families sit at different
    // prefixes and only one of them carries a username.
    const STATS_URL_TEMPLATE =
        {% if admin %}"{{ url_for('admin_stats', year='__YEAR__', tripType='__TYPE__', metric='__METRIC__') }}"
        {% elif is_public %}"{{ url_for('public_stats', username=username, year='__YEAR__', tripType='__TYPE__', metric='__METRIC__') }}"
        {% else %}"{{ url_for('stats', username=username, year='__YEAR__', tripType='__TYPE__', metric='__METRIC__') }}"
        {% endif %};

    function statsPageUrl(year, type, metric) {
        return STATS_URL_TEMPLATE
            .replace('__YEAR__', encodeURIComponent(year || 'all'))
            .replace('__TYPE__', encodeURIComponent(type))
            .replace('__METRIC__', encodeURIComponent(metric));
    }

    var currentMetric = "{{statMetric if statMetric else 'trips'}}";
    var statsData = null;
    var combinedStatsData = null;
    // Airport code -> city, sent alongside the air payloads (see
    // get_airport_cities): what the station labels are shortened to.
    var airportCities = {};
    var chartsInstances = {};
    var currentChart = null;
    var expandedMode = false;

    var operatorImages = {{logosList | safe}};
    var staticLink = "{{ url_for('resize_image', max_width=240, target_height=40, image_path='')}}";

    // Which time bucket the time-series chart plots: months once a year is
    // picked, years otherwise.
    var TIME_SERIES_KEY = yearDefined == "true" ? "months" : "years";

    // Row fields that carry a picture rather than a number, kept through metric
    // extraction and combined-mode merging so charts can still draw them.
    var DECORATION_FIELDS = ['operator', 'image_code', 'image', 'country', 'units', 'label'];

    // The axis draws pictures into a fixed box, so the box has to match the
    // artwork or it stretches. Logos come out of the resizer at 240x40; the
    // airframe silhouettes are 500x200. Feeding both the same box was what
    // squashed the aircraft flat.
    var LOGO_ASPECT = 240 / 40;
    var AIRLINER_ASPECT = 500 / 200;
    var WAGON_ASPECT = 218 / 41;      // measured median of the wagon artwork
    var PLACEHOLDER_ASPECT = 176 / 44;  // the outline SVGs' own viewBox

    var WAGON_BASE = "{{ url_for('static', filename='images/wagons') }}";

    // The lead vehicle stands in for the whole consist on the axis, exactly as a
    // silhouette stands in for an aircraft type. A six-car rake would need some
    // 400px at this artwork's proportions; the axis gutter has 110. The full
    // strip is on hover instead.
    function trainsetLeadImage(item) {
        const units = item.units || [];
        if (!units.length) return null;

        // The first car that has artwork, not simply the first car: a set whose
        // leading vehicle is unknown still deserves a picture on the axis.
        const drawn = units.find(unit => unit.image);
        if (drawn) return wagonImgSrc(WAGON_BASE, drawn);

        // Nothing in the set is drawn. An outline still marks the row as a
        // train, which beats a blank gutter beside a labelled bar.
        return placeholderSrc(units[0], true, units.length === 1);
    }

    // The "not found" outlines the trip pages use. Which one depends on where
    // the car sits, so an unknown set still reads as a train and not as a row
    // of identical boxes.
    function placeholderSrc(unit, isFirst, isLast) {
        const suffix = unit._phType
            || (isFirst && isLast ? 'loco_both' : isFirst ? 'loco_l' : isLast ? 'loco_r' : 'mid');
        return `${WAGON_BASE}/placeholder_${suffix}.svg`;
    }

    // Operator logos: the resizer for the axis (small, cached, uniform height),
    // the original file on hover where there is room to show it properly.
    function operatorLogoUrl(name) {
        const logo = name && operatorImages[name];
        return logo ? encodeURI(staticLink + logo.replace('&', '%26')) : null;
    }

    function operatorLogoFullUrl(name) {
        const logo = name && operatorImages[name];
        return logo ? encodeURI('/static/' + logo) : null;
    }

    // Airframe artwork, keyed by ICAO type code. A miss is normal — roughly a
    // hundred types are drawn and the rest are hand-typed — so callers must
    // cope with null.
    function airlinerImageUrl(code) {
        return code ? `/static/images/airliners/${encodeURIComponent(code)}.png` : null;
    }

    // Aircraft registration prefix -> country, from the shared table the trip
    // pages already use. Loaded once before the first render, then a sync
    // lookup. Ferries don't need it: their ensign comes from the vessel record.
    var REGISTRATIONS_URL = "{{ url_for('static', filename='data/registrations.json') }}";
    var registrations = {};

    // Does this row describe an aircraft? Per trip type that is just the type;
    // in combined mode a row is merged from several, so ask what fed it.
    function isAirRow(item) {
        if (!isCombinedMode) return isAirType(tripType);
        return Object.keys((item && item.tripTypes) || {}).some(isAirType);
    }

    function vehicleCountry(item) {
        // A vessel's ensign comes from the server; it is real data.
        if (item.country) return item.country;

        // A tail number's prefix is a nationality mark — but ONLY on an
        // aircraft. Run over anything else it still matches, and confidently:
        // "CITROËN C-ZERO" begins with C and comes back Canadian, "HL371"
        // Korean, "DS15540" German. Combined mode was the only view that loaded
        // the table for non-air rows, so that is where it showed.
        return isAirRow(item) ? (regCountry(item.vehicle, registrations) || '') : '';
    }

    function withFlag(item, label) {
        const country = vehicleCountry(item);
        return country ? `${getFlagEmoji(country)} ${label}` : label;
    }

    // A photo of the actual airframe, fetched from planespotters.net only when
    // the user hovers a bar — never during a render.
    //
    // Results are kept here as well as inside vehicle_display.js because the
    // tooltip needs a SYNCHRONOUS answer: a resolved promise still settles a
    // microtask later, which is long enough to paint a loading state and then
    // replace it. Re-hovering a bar must not flicker, so a known result is
    // rendered outright.
    var photoResults = {};

    function aircraftPhotoKey(item) {
        return item && item.vehicle && isAirRow(item) ? item.vehicle : null;
    }

    function requestAircraftPhoto(key) {
        return fetchAircraftPhoto(key).then(photo => {
            photoResults[key] = photo && photo.thumb ? photo : null;
            // Decode it once now. Every later rebuild of the tooltip creates a
            // fresh <img> for the same URL; warmed, that paints in the same
            // frame instead of showing an empty box first.
            if (photoResults[key]) new Image().src = photoResults[key].thumb;
            return photoResults[key];
        });
    }

    function isAirType(type) {
        return type === 'air' || type === 'helicopter';
    }

    // ============================================
    // CHART REGISTRY
    // ============================================
    // One entry per chart. Everything downstream iterates this list — the grid,
    // the settings modal, metric extraction, combined-mode merging, the
    // fullscreen view — so adding a chart is one entry here plus a dataset on
    // the API side, not an edit in six places.
    //
    //   dataset      key of the array in the stats payload
    //   idKey        field on a row holding the category identifier
    //   title        chart heading
    //   appliesTo    trip types the chart means something for (null = all)
    //   category     row -> the string shown on the category axis
    //   mergeKey     row -> what makes two rows the same row in combined mode.
    //                Only needed where idKey alone isn't the identity (lines,
    //                which are only unique within an operator).
    //   inlineLabel  category -> bar label. Set means the category rides on the
    //                bar itself and the axis gutter collapses, which is what
    //                makes long free-text labels (lines, stations) usable.
    //   axisLabel    () -> ECharts axisLabel config for the category axis
    //   vertical     true to put categories on the X axis (the time series)
    var CHARTS = [
        {
            key: 'countries',
            dataset: 'countries',
            idKey: 'country',
            title: "{{crossedCountries}}",
            category: item => item.country === "{{others}}"
                ? item.country
                : `${regionNames.of(item.country)} ${getFlagEmoji(item.country)}`,
            axisLabel: () => ({
                hideOverlap: true,
                formatter: function (value) {
                    if (!isMobile()) return value;
                    // Narrow screens keep just the flag plus the alpha-2 code:
                    // full country names never fit. Taking the last five
                    // characters happened to leave one for a country, but the
                    // "others" row has no flag to leave — it arrived as
                    // "utres". Match the flag instead of counting characters.
                    const flag = value.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
                    if (!flag) return value;
                    // Regional indicators are the alpha-2 letters offset into
                    // their own block, so the code comes back out of the flag.
                    const code = [...flag[0]]
                        .map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 65))
                        .join('');
                    // Flag last: the labels are right-aligned against the axis,
                    // so trailing flags line up. Leading ones don't — flag
                    // glyphs vary in width and the codes end up ragged.
                    return `${code} ${flag[0]}`;
                }
            })
        },
        {
            key: 'operators',
            dataset: 'operators',
            idKey: 'operator',
            title: "{{operator}}",
            image: item => operatorLogoUrl(item.operator),
            tooltipImage: item => operatorLogoFullUrl(item.operator),
            axisImage: true,
            imageAspect: LOGO_ASPECT
        },
        {
            key: 'timeseries',
            dataset: TIME_SERIES_KEY,
            idKey: TIME_SERIES_KEY === 'months' ? 'month' : 'year',
            title: TIME_SERIES_KEY === 'months' ? "{{month}}" : "{{year}}",
            vertical: true,
            category: item => TIME_SERIES_KEY === 'months'
                ? formatMonthLabel(item.month) : item.year
        },
        {
            key: 'material',
            dataset: 'material',
            idKey: 'material',
            title: "{{material_type}}",
            // For flights the axis carries the airframe silhouette while the
            // readable name stays on the bar. Other types have no artwork, so
            // the chart falls back to the plain inline label.
            image: item => airlinerImageUrl(item.image_code),
            axisImage: true,
            imageAspect: AIRLINER_ASPECT,
            inlineLabel: value => value
        },
        {
            // Trains get their consist as well as their vehicle: the lead car on
            // the axis, the whole rake on hover. It sits before the vehicles
            // chart because on rail the consist is the more meaningful reading —
            // but both are shown, since a fleet number is still the only thing
            // that identifies the individual unit.
            key: 'trainsets',
            dataset: 'trainsets',
            idKey: 'trainset',
            title: "{{statsTrainsets}}",
            // Every rail type: trams and metros are logged with consists too,
            // and funicular is here so it works the day someone logs one.
            appliesTo: ['train', 'tram', 'metro', 'rail', 'funicular'],
            // Never the stored value: for an ad-hoc consist that is a page of
            // JSON. The server always sends a readable label; an em dash is the
            // last resort for a row it could make no sense of at all.
            category: item => item.label || '—',
            image: trainsetLeadImage,
            media: mediaStrip,
            prepare: prepareStrip,
            axisImage: true,
            imageAspect: WAGON_ASPECT,
            inlineLabel: value => value
        },
        {
            // Free text, so the values are as clean as users typed them. Worth
            // charting anyway: line_name is the best-populated field on the
            // trips table by a wide margin.
            key: 'lines',
            dataset: 'lines',
            idKey: 'line',
            title: "{{statsLines}}",
            // A line name is only unique within a network — tram 1 exists in
            // half the cities in Europe — so the operator is part of the row's
            // identity, not decoration on it. The server groups by both; here
            // that has to reach the category, because ECharts keys its axis on
            // the category string and two bars called "1" would collapse.
            //
            // Spelled out on the bar rather than left to the axis logo alone:
            // the logo distinguishes them for anyone who recognises it, and an
            // operator with no logo has nothing to distinguish it at all.
            // Operator first: it is what the axis logo beside the label already
            // says, so the two agree left-to-right instead of crossing over.
            category: item => item.operator ? `${item.operator} · ${item.line}` : item.line,
            // Combined mode re-merges rows across trip types by identifier, and
            // the identifier here is the pair. Without this a line run by a bus
            // company and a tram company would fold back into one row.
            mergeKey: item => item.line + '\u0000' + (item.operator || ''),
            // A line almost always runs under one operator, so its logo says
            // more at a glance than the bare line code does.
            image: item => operatorLogoUrl(item.operator),
            // No big logo on hover. A line is identified by its number, and a
            // full-width operator logo above it read as though the logo were the
            // subject; it belongs beside the name, at the size of a credit.
            // Returning null explicitly: leaving this out falls back to `image`,
            // which is exactly the logo we are trying not to show.
            tooltipImage: () => null,
            axisImage: true,
            imageAspect: LOGO_ASPECT,
            inlineLabel: value => value,
            // The bare line name, not the category: the operator is already in
            // the header as its logo, and repeating it in the headline made the
            // tooltip read "390 · RATP" beside the RATP mark.
            tooltipHeader: item => `
                <div class="statsTipLineHead">
                    ${operatorMark(item.operator)}
                    <div class="statsTipLineText"><span
                        class="statsTipKicker">{{lineName}}&nbsp;:</span><span
                        class="statsTipHeadline">${escapeHtml(item.line)}</span></div>
                </div>
            `
        },
        {
            // `reg` holds whatever identifies the individual vehicle for the
            // type: a ship's name, an aircraft's tail number, a bus fleet
            // number. Same data, so the title carries the meaning.
            key: 'vehicles',
            dataset: 'vehicles',
            idKey: 'vehicle',
            title: ({
                'ferry': "{{statsVessels}}",
                'air': "{{statsAircraft}}",
                'helicopter': "{{statsAircraft}}"
            })[tripType] || "{{statsVehicles}}",
            // A cached vessel photo for ferries, the airframe silhouette for
            // flights. Tooltip only: these are full pictures, far too big to
            // stack down a category axis.
            image: item => item.image || airlinerImageUrl(item.image_code),
            photoKey: aircraftPhotoKey,
            category: item => withFlag(item, item.vehicle),
            inlineLabel: value => value
        },
        {
            key: 'routes',
            dataset: 'routes',
            idKey: 'route',
            title: '{{routes}}',
            category: item => {
                try { return JSON.parse(item.route).join(' - '); }
                catch (e) { return item.route; }
            },
            inlineLabel: formatRouteLabel
        },
        {
            key: 'stations',
            dataset: 'stations',
            idKey: 'station',
            // These are a trip's endpoints, and what those are called depends
            // entirely on the type: "Gares fréquentées" is simply wrong over a
            // list of airports. The trip forms already name them per type
            // (originAirport, originFerryTerminal, originBusStation); this is
            // the same idea for the chart heading.
            //
            // The fallback covers everything without scheduled stops — car,
            // walk, cycle — and combined mode, where the rows are a mix.
            title: ({
                'air': "{{statsAirportsVisited}}",
                'helicopter': "{{statsAirportsVisited}}",
                'ferry': "{{statsTerminalsVisited}}",
                'bus': "{{statsStopsVisited}}",
                'train': '{{stations}}',
                'metro': '{{stations}}',
                'tram': '{{stations}}',
                'rail': '{{stations}}',
                'funicular': '{{stations}}',
                'aerialway': '{{stations}}'
            })[tripType] || "{{statsPlacesVisited}}",
            inlineLabel: extractStationCode
        }
    ];

    function chartApplies(spec, type) {
        return !spec.appliesTo || spec.appliesTo.includes(type);
    }

    // Charts the current trip type can show at all. In combined mode a chart
    // survives if any of the merged types would show it.
    function applicableCharts() {
        return CHARTS.filter(spec => isCombinedMode
            ? AVAILABLE_TRIP_TYPES.some(type => chartApplies(spec, type))
            : chartApplies(spec, tripType));
    }

    // Which trip types may contribute rows to a dataset, so combined mode
    // doesn't quietly merge back in what the restriction just excluded.
    function datasetApplies(dataset, type) {
        const spec = chartByDataset(dataset);
        return !spec || chartApplies(spec, type);
    }

    function chartByDataset(dataset) {
        return CHARTS.find(spec => spec.dataset === dataset);
    }

    function chartByKey(key) {
        return CHARTS.find(spec => spec.key === key);
    }

    // Every dataset the registry can consume, and the identifier field of each.
    function datasetIdKeys() {
        var keys = {};
        CHARTS.forEach(spec => { keys[spec.dataset] = spec.idKey; });
        // The time series has both buckets in the payload; the registry only
        // names the one currently plotted.
        keys.years = 'year';
        keys.months = 'month';
        return keys;
    }

    // ============================================
    // CHART VISIBILITY (gear button)
    // ============================================
    var HIDDEN_CHARTS_STORAGE_KEY = 'trainlog.stats.hiddenCharts';

    function loadHiddenCharts() {
        try {
            var raw = localStorage.getItem(HIDDEN_CHARTS_STORAGE_KEY);
            return new Set(raw ? JSON.parse(raw) : []);
        } catch (e) {
            return new Set();
        }
    }

    function saveHiddenCharts(hidden) {
        try {
            localStorage.setItem(HIDDEN_CHARTS_STORAGE_KEY, JSON.stringify([...hidden]));
        } catch (e) {
            /* storage unavailable (private mode) — the choice just won't persist */
        }
    }

    var hiddenCharts = loadHiddenCharts();

    // Cutting oversized bars is a reading aid, not a fact about the data, so it
    // is the user's call. On by default: the charts it fires on are unreadable
    // without it.
    //
    // A cookie rather than localStorage, matching how the trip forms keep their
    // preferences (see delayDateMode). js-cookie comes from the shared layout.
    var AXIS_BREAK_COOKIE = 'statsCutOversizedBars';

    function loadAxisBreakEnabled() {
        // Absent means never set, which is the default: on.
        return Cookies.get(AXIS_BREAK_COOKIE) !== 'false';
    }

    function saveAxisBreakEnabled(enabled) {
        Cookies.set(AXIS_BREAK_COOKIE, enabled ? 'true' : 'false', { expires: 365 });
    }

    var axisBreakEnabled = loadAxisBreakEnabled();

    function getScreenSize() {
        return window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    }

    function isMobile() {
        return getScreenSize() < 750;
    }

    // Tooltips are placed differently where there is no hover: see
    // rowAnchoredPosition. Touch-capable laptops keep the pointer behaviour —
    // what matters is that the pointer CAN hover, not that a screen can be
    // touched — so a coarse-only pointer is the test, with the narrow-screen
    // case folded in for phones reporting themselves as fine-pointered.
    function isTouchTooltip() {
        return isMobile()
            || (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
    }

    function formatMonthLabel(monthNumber) {
        const monthIndex = Number(monthNumber) - 1;
        if (!Number.isInteger(monthIndex) || monthIndex < 0 || monthIndex > 11) {
            return monthNumber;
        }

        return new Intl.DateTimeFormat(LANG, { month: 'long' }).format(
            new Date(Date.UTC(2024, monthIndex, 1))
        );
    }

    // Drop floating-point dust without forcing decimals on round numbers.
    function trimNumber(value) {
        return Number(value.toPrecision(6)).toString();
    }

    function truncateLabel(label) {
        return label.length > 15 ? label.slice(0, 12) + '...' : label;
    }

    // Cut a bar label to the width it actually has. Inline labels are drawn
    // inside the plot with nothing to clip them, so an unbounded one (a consist
    // spelt out car by car runs to hundreds of characters) paints straight
    // across the chart and into its neighbour. Measured rather than counted,
    // because the font is proportional; binary search keeps it to ~log2(n)
    // measurements per label.
    function fitLabel(text, maxWidth) {
        if (!text || maxWidth <= 0) return '';
        if (measureLabelWidth(text) <= maxWidth) return text;

        var low = 0;
        var high = text.length;
        while (low < high) {
            var mid = Math.ceil((low + high) / 2);
            if (measureLabelWidth(text.slice(0, mid) + '…') <= maxWidth) {
                low = mid;
            } else {
                high = mid - 1;
            }
        }
        return low > 0 ? text.slice(0, low).trimEnd() + '…' : '';
    }

    // What an inline label may occupy: the plotting area, which is the element
    // minus the category gutter and the right inset, less a little air so it
    // never touches an edge.
    function labelBudget(element, gutterPx, axisBreak, maxValue) {
        const plot = Math.max(60, (element.clientWidth || 400) - gutterPx - 40);
        if (!axisBreak) return plot;

        // With a cut, only the stretch before it is usable. The axis splits its
        // width between the two kept ranges, so the readable part is the lower
        // range's share of them — truncate to that, or the text is trimmed to
        // fit a width it will never be given.
        const lower = axisBreak.start;
        const upper = Math.max(0, maxValue - axisBreak.end);
        return Math.max(60, plot * (lower / (lower + upper)) - 10);
    }

    // Airports are stored as "🇫🇷 Charles de Gaulle International Airport
    // (CDG)" — shorten to the city plus the code; the full name stays
    // available via the tooltip (which reads the untouched category value).
    //
    // The city comes from the server's airportCities map, so the shortening
    // only fires on codes that really are airports. A trailing parenthetical is
    // one nowhere else: on a station it is part of the name ("Paris (Gare de
    // Lyon)"), and cutting to it drops the station and keeps the city.
    function extractStationCode(value) {
        if (value === '{{others}}') return value;
        var match = value.match(/\(([^()]+)\)\s*$/);
        if (!match) return value;

        var city = airportCities[match[1]];
        // No city known: on an air chart the bare code still beats an airport
        // name too long to draw, which is what this did before cities existed.
        if (!city && !isAirType(tripType)) return value;

        var flag = value.match(/^[\u{1F1E6}-\u{1F1FF}]{2}/u);
        return [flag ? flag[0] : '', city || '', city ? '(' + match[1] + ')' : match[1]]
            .filter(Boolean).join(' ');
    }

    function formatRouteLabel(value) {
        if (value === '{{others}}') return value;
        return value.split(' - ').map(extractStationCode).join(' - ');
    }

    // Total length of a row's stacked bar, whatever the mode.
    function itemTotal(item) {
        if (isCombinedMode) {
            return Object.values(item.tripTypes || {}).reduce(
                (sum, t) => sum + (t.past || 0) + (t.plannedFuture || 0), 0);
        }
        return (item.past || 0) + (item.plannedFuture || 0);
    }

    function calculateMaxValue(dataArray) {
        if (!dataArray || dataArray.length === 0) return 0;
        return Math.max(...dataArray.map(itemTotal));
    }

    var labelMeasureContext = document.createElement('canvas').getContext('2d');

    // A flag is a pair of regional-indicator letters. The measuring canvas has
    // no emoji font, so it sizes them as two unrenderable glyphs — far narrower
    // than the colour flag the chart actually paints. Every station and route
    // label starts with one, so the whole placement was working from a width
    // that was tens of pixels short: labels ran off the left of the axis and
    // through the axis break.
    var FLAG_PAIR = /[\u{1F1E6}-\u{1F1FF}]{2}/gu;
    var FLAG_WIDTH = 16;   // measured against a 12px emoji glyph

    // Approximates the rendered width of a bar label (ECharts defaults: 12px
    // sans-serif) so we can tell whether it fits next to the bar.
    function measureLabelWidth(text) {
        labelMeasureContext.font = '12px sans-serif';
        const flags = (text.match(FLAG_PAIR) || []).length;
        if (!flags) return labelMeasureContext.measureText(text).width;
        return labelMeasureContext.measureText(text.replace(FLAG_PAIR, '')).width
            + flags * FLAG_WIDTH;
    }

    // Time units in seconds.
    const YEAR_S = 31557600;   // 365.25 * 24 * 3600
    const MONTH_S = 2629800;    // 30.4375 * 24 * 3600
    const WEEK_S = 604800;      // 7 * 24 * 3600
    const DAY_S = 86400;
    const HOUR_S = 3600;
    const MINUTE_S = 60;

    // Smallest first: the only thing that walks this is the step-up in
    // brokenDurationScale.
    const DURATION_UNITS = [
        { unit: 'second', seconds: 1 },
        { unit: 'minute', seconds: MINUTE_S },
        { unit: 'hour', seconds: HOUR_S },
        { unit: 'day', seconds: DAY_S },
        { unit: 'week', seconds: WEEK_S },
        { unit: 'month', seconds: MONTH_S },
        { unit: 'year', seconds: YEAR_S }
    ];

    // Aim for about five ticks, landing on a round multiple of the unit.
    function findNiceInterval(maxValue, baseUnit, niceMultiples) {
        const target = maxValue / 5;
        let best = niceMultiples[0] * baseUnit;
        for (const multiple of niceMultiples) {
            const candidate = multiple * baseUnit;
            if (candidate >= target) { best = candidate; break; }
        }
        return best;
    }

    // The unit a duration scale should be read in, and how far apart its ticks
    // sit. Both come out of the largest value the scale has to carry: two days
    // of travel is read in hours, two years of it in months.
    function durationScale(maxSeconds) {
        if (maxSeconds >= 2 * YEAR_S)
            return { unit: 'year', divisor: YEAR_S, interval: findNiceInterval(maxSeconds, YEAR_S, [1, 2, 5, 10, 20, 50, 100]) };
        if (maxSeconds >= 2 * MONTH_S)
            return { unit: 'month', divisor: MONTH_S, interval: findNiceInterval(maxSeconds, MONTH_S, [1, 2, 3, 6, 12]) };
        if (maxSeconds >= 2 * WEEK_S)
            return { unit: 'week', divisor: WEEK_S, interval: findNiceInterval(maxSeconds, WEEK_S, [1, 2, 4, 8, 12]) };
        if (maxSeconds >= 2 * DAY_S)
            return { unit: 'day', divisor: DAY_S, interval: findNiceInterval(maxSeconds, DAY_S, [1, 2, 3, 7, 14, 30]) };
        if (maxSeconds >= 2 * HOUR_S)
            return { unit: 'hour', divisor: HOUR_S, interval: findNiceInterval(maxSeconds, HOUR_S, [1, 2, 3, 6, 12, 24]) };
        if (maxSeconds >= 2 * MINUTE_S)
            return { unit: 'minute', divisor: MINUTE_S, interval: findNiceInterval(maxSeconds, MINUTE_S, [1, 2, 5, 10, 15, 30, 60]) };
        const nice = [1, 2, 5, 10, 15, 30, 60];
        return { unit: 'second', divisor: 1, interval: nice.find(i => i >= maxSeconds / 5) || 1 };
    }

    // The scale for an axis with a break in it — one scale carrying two
    // magnitudes at once.
    //
    // Taken from the readable part BELOW the cut, and used for the whole axis.
    // Sizing it off the axis maximum instead is the original bug: a chart topped
    // by six weeks of "others" labelled every tick under it "0 sem.".
    //
    // A second, coarser unit above the cut — "6 sem." where this says "42 j" —
    // was tried and dropped. ECharts puts at most two ticks past the cut, at
    // values fixed by the tear and the axis end, and a coarse unit can only label
    // those without lying when they happen to land on a whole one of it. Measured
    // over 541 broken axes that was 6% of the time, and four fifths of those read
    // as a mixed pair — "41 j" beside "6 sem.", a day apart in different units.
    // The geometry is against it: a break exists because the top segment is a
    // thin stub, and a thin stub does not span a whole week.
    function brokenDurationScale(belowCut, maxSeconds) {
        let scale = durationScale(belowCut);
        // A four-digit label ("13 885 h") is worse than a coarser unit.
        while (maxSeconds / scale.divisor >= 1000) {
            const next = DURATION_UNITS.find(entry => entry.seconds > scale.divisor);
            if (!next) break;
            scale = {
                unit: next.unit,
                divisor: next.seconds,
                interval: Math.max(scale.interval, next.seconds)
            };
        }
        return {
            unit: scale.unit,
            divisor: scale.divisor,
            // A tick can only be a whole number of units if the spacing is one.
            interval: Math.max(scale.divisor, Math.round(scale.interval / scale.divisor) * scale.divisor)
        };
    }

    // What the far side of a break reads in: whatever unit the value is a
    // sensible number of, to one decimal.
    //
    // The near side is a real scale — evenly spaced ticks you measure bars
    // against — so it stays whole units of one size. The far side is not: it is
    // one or two ticks marking where a single dominant bar ends, and the tear
    // between them says the scale is not continuous anyway. Holding it to the
    // near side's unit for the sake of whole numbers is what produced "857 h",
    // which nobody reads as five weeks.
    function coarseDurationLabel(seconds, lang) {
        const ladder = DURATION_UNITS.slice().reverse();
        const scale = ladder.find(entry => Math.abs(seconds) >= entry.seconds) || ladder[ladder.length - 1];
        return new Intl.NumberFormat(lang, {
            style: 'unit',
            unit: scale.unit,
            unitDisplay: 'short',
            maximumFractionDigits: 1
        }).format(seconds / scale.seconds);
    }

    function formatDurationIn(seconds, scale, lang) {
        return new Intl.NumberFormat(lang, {
            style: 'unit',
            unit: scale.unit,
            unitDisplay: 'short',
            maximumFractionDigits: 0
        }).format(seconds / scale.divisor);
    }

    function getDurationAxisConfig(maxSeconds, lang, axisBreak) {
        if (!axisBreak) {
            const scale = durationScale(maxSeconds);
            return {
                type: 'value',
                min: 0,
                max: Math.ceil(maxSeconds / scale.interval) * scale.interval,
                interval: scale.interval,
                axisLabel: {
                    hideOverlap: true,
                    formatter: value => formatDurationIn(value, scale, lang)
                }
            };
        }

        const scale = brokenDurationScale(axisBreak.start, maxSeconds);
        const nearEdgeLabel = coarseDurationLabel(axisBreak.end, lang);
        return {
            type: 'value',
            min: 0,
            // Tight to the data, in units of the tick spacing. Rounding the axis
            // up to a whole coarse unit is what wrecked the layout once: ECharts
            // divides the width between the two segments in proportion to the
            // span each covers, so a max rounded up to the next whole week handed
            // most of the chart to a stretch of scale with nothing in it and
            // squeezed every bar into the left tenth.
            max: snap(Math.ceil(maxSeconds / scale.interval) * scale.interval),
            interval: scale.interval,
            axisLabel: {
                hideOverlap: true,
                formatter: function (value) {
                    if (value <= axisBreak.start) return formatDurationIn(value, scale, lang);
                    const label = coarseDurationLabel(value, lang);
                    // The far edge of the tear and the end of the axis sit one
                    // tick apart, which at this resolution is usually the same
                    // text twice. Keep the edge — that is the tick ECharts
                    // always places, where the axis end is offered only
                    // sometimes — and drop the repeat.
                    if (value > axisBreak.end + scale.interval * 1e-6 && label === nearEdgeLabel) {
                        return '';
                    }
                    return label;
                }
            }
        };
    }

    // ECharts rich-text keys only accept [a-zA-Z0-9_], so a category value can't
    // be used as one: non-latin names (京都市交) would normalize to an empty key
    // and render as a literal "{}", and names differing only by punctuation would
    // collide and share a picture. Index-based keys are safe for any name.
    //
    // Only the rows actually on screen get an entry, so the option stays small
    // whatever the size of the logo map.
    // Fit the artwork's aspect ratio inside the space a row can spare. Bounded
    // by width for wide-and-short logos and by height for the chunkier airframe
    // silhouettes, so neither ends up stretched and neither pushes the rows
    // apart. Falls back to the logo shape when a spec doesn't say.
    function axisImageBox(aspect) {
        const ratio = aspect || LOGO_ASPECT;
        const maxWidth = isMobile() ? 50 : 110;
        const maxHeight = isMobile() ? 16 : 28;
        const width = Math.min(maxWidth, maxHeight * ratio);
        return { width: Math.round(width), height: Math.round(width / ratio) };
    }

    // Widest an axis label may get when it stands in for a missing picture.
    // About the width of the pictures beside it, so one nameless row can't
    // stretch the gutter past what the images already claim.
    var AXIS_LABEL_MAX_WIDTH = 170;

    function imageAxisLabelConfig(spec, rows) {
        const byCategory = {};
        rows.forEach(function (item, index) {
            const url = spec.image ? spec.image(item) : null;
            if (url) byCategory[categoryOf(spec, item)] = { key: 'img_' + index, url: url };
        });

        return {
            formatter: function (value) {
                const entry = byCategory[value];
                if (entry) return `{${entry.key}|}`;

                // No picture for this row. When the name is already drawn on
                // the bar there is nothing to say here, and saying it is
                // actively harmful: the fullscreen grid sets containLabel, so
                // one long name in the gutter widens it until the plot is
                // squeezed off to the right — which is what a consist spelt out
                // car by car did. Charts without an inline label still need a
                // name, but a bounded one — roughly the width of the pictures
                // it sits among, so the gutter stays the size it looks.
                return spec.inlineLabel ? '' : fitLabel(value, AXIS_LABEL_MAX_WIDTH);
            },
            rich: Object.values(byCategory).reduce(function (rich, entry) {
                // The box is drawn to a fixed size, so it has to match the art
                // in it. A placeholder outline is squarer than a real wagon and
                // would be stretched by a third in the wagon-shaped box.
                const aspect = /\.svg$/.test(entry.url)
                    ? PLACEHOLDER_ASPECT
                    : spec.imageAspect;
                rich[entry.key] = Object.assign(
                    { backgroundColor: { image: entry.url } },
                    axisImageBox(aspect));
                return rich;
            }, {})
        };
    }

    // Category -> picture URL, for the tooltip and for the loading placeholder.
    function tooltipImages(spec, rows) {
        const images = {};
        const pick = spec && (spec.tooltipImage || spec.image);
        if (pick) {
            rows.forEach(item => {
                const url = pick(item);
                if (url) images[categoryOf(spec, item)] = url;
            });
        }
        return images;
    }



    function showLoading() {
        document.getElementById('loadingScreen').style.display = 'flex';
    }

    function hideLoading() {
        document.getElementById('loadingScreen').style.display = 'none';
    }

    window.addEventListener('resize', function() {
        Object.keys(chartsInstances).forEach(key => resizeChart(chartsInstances[key]));
        if (currentChart) resizeChart(currentChart);
        // Consist strips are cut to a width, so they are re-cut with the charts.
        if (typeof restripForWidth === 'function') restripForWidth();
    });

    // ============================================
    // UI CREATION
    // ============================================
    function createMetricSelector() {
        const enabledMetrics = getEnabledMetrics();
        return `
            <select id="metricSelector" class="form-select statsSelect">
                ${enabledMetrics.map(metric => `
                    <option value="${metric}" ${metric === currentMetric ? 'selected' : ''}>
                        ${METRICS_CONFIG[metric].label}
                    </option>
                `).join('')}
            </select>
        `;
    }

    function attachMetricSelectorListener() {
        const selector = document.getElementById('metricSelector');
        selector.addEventListener('change', function() {
            switchMetric(this.value);
        });
    }

    // ============================================
    // DATA EXTRACTION
    // ============================================
    // Reduce every dataset to {identifier, past, plannedFuture} for one metric,
    // so the charts never have to know which metric they are drawing.
    function extractDataForMetric(data, metric) {
        const suffix = METRICS_CONFIG[metric].suffix;
        const idKeys = datasetIdKeys();
        const extracted = {};

        Object.keys(idKeys).forEach(dataset => {
            const idKey = idKeys[dataset];
            const rows = (data[dataset] || []).map(item => {
                const converted = {
                    past: item['past' + suffix] || 0,
                    plannedFuture: item['plannedFuture' + suffix] || 0
                };
                if (item[idKey] !== undefined) converted[idKey] = item[idKey];
                if (item.tripType) converted.tripType = item.tripType;
                DECORATION_FIELDS.forEach(field => {
                    if (item[field] !== undefined) converted[field] = item[field];
                });
                return converted;
            });
            // The time series keeps chronological order; everything else is
            // ranked, biggest first.
            extracted[dataset] = (dataset === 'years' || dataset === 'months')
                ? rows
                : rows.sort((a, b) => (b.past + b.plannedFuture) - (a.past + a.plannedFuture));
        });

        return extracted;
    }

    // ============================================
    // COMBINED MODE DATA MERGING
    // ============================================
    // Fold the per-trip-type payloads into one set of rows, each keeping a
    // per-type breakdown so the bars can stay stacked by trip type.
    function mergeCombinedData(allTypeData) {
        const idKeys = datasetIdKeys();
        const merged = {};
        Object.keys(idKeys).forEach(dataset => { merged[dataset] = {}; });

        Object.keys(allTypeData).forEach(tripType => {
            Object.keys(idKeys).forEach(dataset => {
                if (!datasetApplies(dataset, tripType)) return;
                const idKey = idKeys[dataset];
                // Usually the identifier is the whole identity. Where it isn't —
                // a line, which is only itself within one operator — the spec
                // says what the pair is. The seeded row still takes its
                // identifier from the item, never from the key, so a composite
                // key never ends up in the field the charts read.
                const spec = chartByDataset(dataset);
                const identity = spec && spec.mergeKey;
                (allTypeData[tripType][dataset] || []).forEach(item => {
                    if (item[idKey] === undefined) return;
                    const key = identity ? identity(item) : item[idKey];
                    const row = merged[dataset][key]
                        || (merged[dataset][key] = { [idKey]: item[idKey], tripTypes: {} });
                    // Keep whatever decoration the first contributing type
                    // carried (operator logo, vessel photo), so merged rows can
                    // still show an image.
                    DECORATION_FIELDS.forEach(field => {
                        if (row[field] === undefined && item[field] !== undefined) {
                            row[field] = item[field];
                        }
                    });
                    const bucket = row.tripTypes[tripType]
                        || (row.tripTypes[tripType] = { past: 0, plannedFuture: 0 });
                    bucket.past += item.past || 0;
                    bucket.plannedFuture += item.plannedFuture || 0;
                });
            });
        });

        const result = {};
        Object.keys(idKeys).forEach(dataset => {
            const rows = Object.values(merged[dataset]);
            const idKey = idKeys[dataset];
            result[dataset] = (dataset === 'years' || dataset === 'months')
                ? rows.sort((a, b) => a[idKey] - b[idKey])
                : rows.sort((a, b) => itemTotal(b) - itemTotal(a));
        });
        return result;
    }

    function groupData(data, key) {
        if (data.length <= 10) {
            return data;
        }
        var grouped = data.slice(0, 10);
        
        if (isCombinedMode) {
            // For combined mode, merge tripTypes for "others"
            var others = data.slice(10).reduce((acc, item) => {
                Object.keys(item.tripTypes || {}).forEach(tripType => {
                    if (!acc.tripTypes[tripType]) {
                        acc.tripTypes[tripType] = { past: 0, plannedFuture: 0 };
                    }
                    acc.tripTypes[tripType].past += item.tripTypes[tripType].past || 0;
                    acc.tripTypes[tripType].plannedFuture += item.tripTypes[tripType].plannedFuture || 0;
                });
                return acc;
            }, { [key]: '{{others}}', tripTypes: {} });
            grouped.push(others);
        } else {
            var others = data.slice(10).reduce((acc, item) => {
                acc.past += item.past;
                acc.plannedFuture += item.plannedFuture;
                return acc;
            }, { [key]: '{{others}}', past: 0, plannedFuture: 0 });
            grouped.push(others);
        }
        
        return grouped;
    }

    // ============================================
    // CHART STYLING
    // ============================================
    function createPattern(color) {
        var canvas = document.createElement('canvas');
        canvas.width = 4;
        canvas.height = 4;
        var ctx = canvas.getContext('2d');
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(4, 0);
        ctx.lineTo(0, 4);
        ctx.stroke();
        
        return {
            type: 'pattern',
            image: canvas,
            repeat: 'repeat'
        };
    }

    function getColor(type) {
        var colorMap = {
            'air': 'rgb(64, 185, 31)',
            'helicopter': 'rgb(64, 185, 31)',
            'train': 'rgb(82, 176, 254)',
            'tram': 'rgb(162, 215, 255)',
            'metro': 'rgb(0, 69, 149)',
            'bus': 'rgb(159, 75, 187)',
            'ferry': 'rgb(30, 30, 124)',
            'car': 'rgb(166, 143, 205)',
            'cycle': 'rgb(110, 33, 26)',
            'walk': 'rgb(232, 140, 0)',
            'aerialway': 'rgb(175, 207, 59)',
            'scooter': 'rgb(0, 208, 132)',
            'funicular': 'rgb(100, 149, 237)',
            'rail': 'rgb(126, 200, 255)',
            'ski': 'rgb(184, 230, 240)'
        };
        return colorMap[type] || '#000000';
    }

    // Category charts carry their name as a bar label instead of an axis label.
    // The label hugs the end of its bar, on whichever side has the room —
    // decided per row once the bars have been measured (computeLabelPlacement):
    //  - 'outside':     in the free space right of the bar, nothing covered.
    //  - 'insideEnd':   ending at the end of the past segment, when the space
    //                   right of the bar is too small but the segment is wide
    //                   enough. Stopping at the past segment rather than the
    //                   bar tip keeps the pill off the hatched planned-future
    //                   part, so the past/future boundary stays readable.
    //  - 'insideStart': from the axis line, last resort for a label wider than
    //                   both — right-aligning it would spill past the axis.
    // 'outside' anchors on the last stacked segment (its right edge is the end
    // of the whole bar); the two inside positions anchor on the first segment,
    // which spans the past values from the axis. Labels are emitted on both
    // anchors and hidden per data item, so a row only ever shows one.
    //
    // Combined mode is the exception: past and planned-future segments there
    // alternate per trip type, so there is no single "end of past" to cling to
    // and 'insideEnd' falls back to the end of the whole bar.
    function insideEndAnchorsOnPast() {
        return !isCombinedMode;
    }

    // A background pill keeps an inside label legible regardless of which
    // (possibly dark) bar color ends up underneath it — the visible color at
    // that spot varies per row in combined mode.
    var INSIDE_LABEL_PILL = {
        backgroundColor: 'rgba(255, 255, 255, 0.85)',
        padding: [2, 5],
        borderRadius: 3
    };

    function baseLabelConfig(labelFormatter, position) {
        if (!labelFormatter) return undefined;
        return {
            show: true,
            position: position,
            formatter: labelFormatter,
            color: '#1a1a1a',
            fontSize: 12,
            padding: [2, 5]
        };
    }

    // Both inside positions live on this anchor; 'insideEnd' rows override the
    // position per item.
    function insideLabelConfig(labelFormatter) {
        if (!labelFormatter) return undefined;
        return Object.assign(baseLabelConfig(labelFormatter, 'insideLeft'), INSIDE_LABEL_PILL);
    }

    function barEndLabelConfig(labelFormatter) {
        return baseLabelConfig(labelFormatter, 'right');
    }

    // Per-item override for the first stacked segment, which carries both
    // inside positions (the series default is 'insideLeft').
    function insideLabel(labelFormatter, placement, index) {
        if (!labelFormatter) return undefined;
        const mode = placement ? placement[index].mode : 'insideStart';
        if (mode === 'insideStart') return { label: { show: true } };
        if (mode === 'insideEnd' && insideEndAnchorsOnPast()) {
            return { label: { show: true, position: 'insideRight' } };
        }
        return { label: { show: false } };
    }

    // Per-item override for the bar-end anchor: 'outside' keeps the series
    // default, and in combined mode it also takes 'insideEnd'.
    function barEndLabel(labelFormatter, placement, index) {
        if (!labelFormatter) return undefined;
        const spot = placement ? placement[index] : { mode: 'insideStart' };
        if (spot.mode === 'outside') return { label: { show: true } };
        // Too long for either side: keep it hanging off the bar end, pulled back
        // just far enough to stay in the plot. They then all finish flush at the
        // right edge instead of each starting at the axis and running out to a
        // different place.
        if (spot.mode === 'clampRight') {
            return { label: Object.assign(
                { show: true, offset: [spot.dx, 0] }, INSIDE_LABEL_PILL) };
        }
        if (spot.mode === 'insideEnd' && !insideEndAnchorsOnPast()) {
            return { label: Object.assign({ show: true, position: 'insideRight' }, INSIDE_LABEL_PILL) };
        }
        return { label: { show: false } };
    }

    // With one or two categories ECharts gives each its own band across the
    // whole plot and the bar becomes a slab. Cap the thickness at what a bar
    // would have if the chart held six of them.
    var BAR_REFERENCE_COUNT = 6;
    var BAR_BAND_FILL = 0.6;      // ECharts' default bar width within its band

    function barThicknessCap(element, vertical) {
        const extent = vertical
            ? (element.clientWidth || 400)
            : (element.clientHeight || 400);
        // Title, axis and the grid's own insets are not plotting area.
        const usable = Math.max(120, extent - 70);
        return Math.round(usable / BAR_REFERENCE_COUNT * BAR_BAND_FILL);
    }

    function createSeries(data, color, labelFormatter, placement, barMaxWidth) {
        if (isCombinedMode) {
            return createCombinedSeries(data, labelFormatter, placement, barMaxWidth);
        }

        return [
            {
                name: '{{past}}',
                type: 'bar',
                stack: 'Total',
                barMaxWidth: barMaxWidth,
                label: insideLabelConfig(labelFormatter),
                data: data.map((item, i) => ({
                    value: item.past,
                    itemStyle: { color: color },
                    ...insideLabel(labelFormatter, placement, i)
                }))
            },
            {
                // Last series of the stack, so its right edge is the end of the
                // whole bar — the anchor for tip-hugging labels.
                name: '{{plannedFuture}}',
                type: 'bar',
                stack: 'Total',
                barMaxWidth: barMaxWidth,
                label: barEndLabelConfig(labelFormatter),
                data: data.map((item, i) => ({
                    value: item.plannedFuture,
                    itemStyle: { color: createPattern(color) },
                    ...barEndLabel(labelFormatter, placement, i)
                }))
            }
        ];
    }

    function createCombinedSeries(data, labelFormatter, placement, barMaxWidth) {
        const series = [];
        const lastIndex = AVAILABLE_TRIP_TYPES.length - 1;

        // Create series for each trip type (past and planned future)
        AVAILABLE_TRIP_TYPES.forEach((tripType, typeIndex) => {
            const color = getColor(tripType);
            const label = TRIP_TYPE_LABELS[tripType] || tripType;
            const isFirst = typeIndex === 0;
            const isLast = typeIndex === lastIndex;

            // Past trips for this type
            series.push({
                name: `${label} ({{past}})`,
                type: 'bar',
                stack: 'Total',  // Changed from 'Past' to 'Total'
                barMaxWidth: barMaxWidth,
                label: isFirst ? insideLabelConfig(labelFormatter) : undefined,
                data: data.map((item, i) => {
                    const tripTypeData = item.tripTypes && item.tripTypes[tripType];
                    return {
                        value: tripTypeData ? tripTypeData.past : 0,
                        itemStyle: { color: color },
                        ...(isFirst ? insideLabel(labelFormatter, placement, i) : {})
                    };
                })
            });

            // Planned future trips for this type
            series.push({
                name: `${label} ({{plannedFuture}})`,
                type: 'bar',
                stack: 'Total',  // Changed from 'Future' to 'Total'
                barMaxWidth: barMaxWidth,
                label: isLast ? barEndLabelConfig(labelFormatter) : undefined,
                data: data.map((item, i) => {
                    const tripTypeData = item.tripTypes && item.tripTypes[tripType];
                    return {
                        value: tripTypeData ? tripTypeData.plannedFuture : 0,
                        itemStyle: { color: createPattern(color) },
                        ...(isLast ? barEndLabel(labelFormatter, placement, i) : {})
                    };
                })
            });
        });

        return series;
    }

    // ============================================
    // INLINE BAR LABEL PLACEMENT
    // ============================================
    // Right edge of the plotting area, in canvas pixels.
    function plotAreaRight(chart, fallbackRightInset) {
        try {
            var rect = chart.getModel().getComponent('grid').coordinateSystem.getRect();
            return rect.x + rect.width;
        } catch (e) {
            return chart.getWidth() - (fallbackRightInset || 0);
        }
    }

    function computeLabelPlacement(chart, data, labelFormatter, axisBreak) {
        var yAxis = chart.getOption().yAxis || [];
        var categories = (yAxis[0] && yAxis[0].data) || [];
        var rightEdge = plotAreaRight(chart, 20);

        // A break makes the plot look far roomier than it reads: the axis runs
        // on past the cut, so labels were being placed "outside" into space that
        // is on the other side of the tear, and every one of them crossed it.
        // Treat the cut as the edge of the usable area.
        if (axisBreak) {
            var cutAt = chart.convertToPixel({ xAxisIndex: 0 }, axisBreak.start);
            // The tear is drawn above everything — it has to be, or it could not
            // erase the bar it cuts — so a label can never sit over it. Keep a
            // clear margin rather than relying on them just touching.
            if (isFinite(cutAt)) rightEdge = Math.min(rightEdge, cutAt - 14);
        }

        var barStart = chart.convertToPixel({ xAxisIndex: 0 }, 0);

        // A cut bar runs past the axis, so its value converts to a pixel outside
        // the plot. Clamping to the edge makes the fit decision reason about the
        // bar as drawn, instead of parking its label off-screen.
        function barPixel(value) {
            return Math.min(chart.convertToPixel({ xAxisIndex: 0 }, value), rightEdge);
        }

        return data.map(function (item, i) {
            // The cut bar keeps its name at the start. Anywhere else it anchors
            // to the bar's end, which now lies beyond the tear — in combined
            // mode that dropped the label right on top of the cut, detached
            // from the stack it belongs to.
            if (axisBreak && itemTotal(item) > axisBreak.start) return { mode: 'insideStart' };

            var barEnd = barPixel(itemTotal(item));
            // What an inside label has to fit in: the past segment it clings to.
            var insideEnd = insideEndAnchorsOnPast()
                ? barPixel(item.past || 0)
                : barEnd;
            var text = labelFormatter({ name: categories[i] });
            // 10px label padding + a little breathing room from the bar/edge.
            var needed = measureLabelWidth(text) + 18;
            if ((rightEdge - barEnd) >= needed) return { mode: 'outside' };
            if ((insideEnd - barStart) >= needed) return { mode: 'insideEnd' };
            // Fits nowhere. Rather than starting it at the axis and letting it
            // trail off across the bar's end, clamp it to the right — but never
            // so far that it starts left of the axis, which is how Manchester
            // ended up with its flag hanging outside the chart.
            var dx = Math.min(0, rightEdge - (barEnd + needed));
            return { mode: 'clampRight', dx: Math.max(dx, barStart - barEnd) };
        });
    }

    // Second render pass: now that the bars have real pixel positions, re-emit
    // the series with each label shown on the anchor that fits. Stored on the
    // instance so a resize can redo the decision.
    function applyInlineLabels(chart, data, color, labelFormatter, barMaxWidth, axisBreak) {
        if (!labelFormatter) return;
        chart.relayoutLabels = function () {
            chart.setOption({
                series: createSeries(data, color, labelFormatter,
                    computeLabelPlacement(chart, data, labelFormatter, axisBreak), barMaxWidth)
            });
        };
        chart.relayoutLabels();
    }

    function resizeChart(chart) {
        if (!chart) return;
        chart.resize();
        if (chart.relayoutLabels) chart.relayoutLabels();
    }

    // ============================================
    // CHART RENDERING
    // ============================================
    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // The three states of a tooltip's picture, all the same size on screen so
    // that swapping between them never moves anything.
    //
    // onerror because the artwork set is partial — roughly a hundred aircraft
    // types are drawn, the rest are hand-typed — so a miss is expected rather
    // than exceptional, and a broken-image icon would be worse than nothing.
    function mediaArt(url, loading) {
        if (!url) return loading ? '<div class="statsTipMedia loading"></div>' : '';
        return `<div class="statsTipMedia${loading ? ' loading' : ''}">`
            + `<img class="art" src="${escapeHtml(url)}" alt=""`
            + ` onerror="this.style.visibility='hidden'"></div>`;
    }

    // ── consist strips ──────────────────────────────────────────────────────
    // Sizing a rake correctly is normalizeStrip's job: it puts every wagon on
    // one absolute metres-per-pixel scale from `data-ppm`, so a short coach and
    // a long one keep their real proportions. It needs live DOM and image load
    // events to do that, which a tooltip rebuilt on every mousemove cannot give
    // it. So each strip is sized ONCE in a hidden container, and the result —
    // heights already baked into the markup — is cached as a plain string.
    // Outer width of the strip, its horizontal padding, and what that leaves to
    // lay cars out in. Scaling to the OUTER width is what made a rake that
    // computed to exactly the limit wrap anyway: the flex line only ever gets
    // the content box, and 2px of slack keeps sub-pixel rounding from tipping a
    // full line over.
    var STRIP_MAX_WIDTH = 760;
    var STRIP_PADDING_X = 12;
    // The strip's own margin from the viewport edge, matching the `calc(100vw -
    // 40px)` the narrow-screen rule caps it at. On a phone that cap, not the
    // 760, is what the rake has to be laid out in — computing rows against the
    // desktop width is what pushed the cars out past the tooltip's edge.
    var STRIP_VIEWPORT_MARGIN = 40;

    function stripContentWidth() {
        const viewport = window.innerWidth || STRIP_MAX_WIDTH;
        const outer = Math.min(STRIP_MAX_WIDTH, viewport - STRIP_VIEWPORT_MARGIN);
        // Nothing sensible can be laid out below this, and a floor keeps the
        // arithmetic from going negative on a very narrow viewport.
        return Math.max(160, outer - STRIP_PADDING_X - 2);
    }

    // Below this a car stops reading as a vehicle. A rake too long to fit at
    // this height wraps onto another row rather than shrinking further — the
    // trip pages solve the same problem by scrolling (.compo-container), which
    // a tooltip can't do because the pointer can never reach it. At 20px a
    // seven-car set still fits on one line, which covers most multiple units.
    var STRIP_MIN_CAR_HEIGHT = 20;
    var stripCache = {};
    // Row breaks are baked into the cached markup, so they are only valid for
    // the width they were computed at. A rotation or a resized window has to
    // throw the lot away rather than serve a desktop layout to a phone.
    var stripCacheWidth = 0;
    // The units each cached strip was built from, so a resize can bake them
    // again without waiting for the charts to be rebuilt.
    var stripUnits = {};
    var stripOven = null;

    function ovenElement() {
        if (!stripOven) {
            stripOven = document.createElement('div');
            // visibility:hidden rather than display:none — the boxes still have
            // to be laid out for their measured widths to mean anything.
            stripOven.style.cssText =
                'position:absolute;left:-10000px;top:0;visibility:hidden;';
            document.body.appendChild(stripOven);
        }
        return stripOven;
    }

    // Cut a rake into rows the way the browser would: fill a row, start a new
    // one when the next car no longer fits. Cars keep their order, so this is
    // also the FEWEST rows the rake can occupy at that scale.
    function greedyRows(widths, limit) {
        const rows = [];
        let row = [], width = 0;
        widths.forEach((w, i) => {
            if (row.length && width + w > limit) { rows.push(row); row = []; width = 0; }
            row.push(i);
            width += w;
        });
        if (row.length) rows.push(row);
        return rows;
    }

    // The same cut, but with the rows made as even as they can be. Greedy
    // filling is what strands a single car under a full-width rake; cutting a
    // twelve-car set as 6+6 instead of 11+1 reads as one train seen twice
    // rather than as a train and an afterthought.
    //
    // Cars can't be reordered, so the only freedom is where the breaks go:
    // a small dynamic program over (start car, rows left), scoring each row by
    // how far its length strays from the average row. Squared, so one very
    // short row costs more than two slightly short ones. Rakes are a dozen
    // cars at most, so the table is tiny.
    //
    // Rows rarely come out exactly even, and a train that gets shorter as it
    // goes down looks deliberate where one that grows looks like it overflowed.
    // TOP_HEAVY breaks near-ties towards the wider row on top: weighting each
    // row's width by how many rows are left puts the width early. It has to
    // stay far below the cost of an actually worse split — a couple of pixels
    // of imbalance, not a car's worth.
    var TOP_HEAVY = 1e-3;

    // Used only for rakes too long to search exhaustively; chooseLayout below
    // is what normally decides the breaks.
    function balancedRows(widths, rowCount, limit) {
        const n = widths.length;
        const prefix = [0];
        widths.forEach((w, i) => prefix.push(prefix[i] + w));
        const average = prefix[n] / rowCount;

        // cost[j][i] — best score for cars i.. laid out in j rows, and the car
        // that starts the row after the first of them.
        const cost = [[]], next = [[]];
        for (let i = 0; i <= n; i++) cost[0][i] = (i === n ? 0 : Infinity);

        for (let j = 1; j <= rowCount; j++) {
            cost[j] = []; next[j] = [];
            for (let i = n; i >= 0; i--) {
                let best = Infinity, bestEnd = -1;
                for (let end = i + 1; end <= n; end++) {
                    const width = prefix[end] - prefix[i];
                    if (width > limit) break;          // and only wider from here
                    const rest = cost[j - 1][end];
                    if (rest === Infinity) continue;
                    const score = rest + Math.pow(width - average, 2)
                        - TOP_HEAVY * j * width;
