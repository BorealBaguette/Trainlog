{% extends "bootstrap/layout.html" %}
{% set leaflet = True %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static',filename='styles/new_map.css') }}">
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="{{ url_for('static', filename='js/maplibre-utils.js') }}"></script>
<script src="{{ static_autoversion(filename='js/map.js') }}"></script>

{% include nav %}

<!-- Spinner Overlay -->
<div class="loading-screen position-relative" style="width:100%; height:100vh;">
  <div class="loading-text text-center position-absolute w-100" 
       style="top: 45vh; transform: translateY(-45%);">
    Loading...
  </div>
  <div class="spinner-container position-absolute w-100" 
       style="top: 50vh; transform: translateY(-50%); text-align: center;">
      <div class="lds-spinner">
          <div></div><div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
  </div>
</div>

<div id="map" class="mapUser" style="visibility: hidden;"></div>

<script>
    let map;
    async function initVisitedSquaresMap() {
        const params = new URLSearchParams(window.location.search);
        const serverType = params.get('tileserver') || "{{ tileserver }}";
        const useGlobe = params.has('globe') ? params.get('globe') === 'true' : {{ 'true' if globe else 'false' }};

        map = await MapLibreUtils.initializeMapLibre({
            container: 'map',
            tileserver: serverType,
            useGlobe,
            center: [10, 50],
            zoom: 3
        });

        map.on("load", () => {
            addPercentageControl();
            fetchVisitedSquaresGeoJSON();
        });
    }

    // One line per parallel and meridian, with a vertex every degree so they still bend on the globe
    function gridGeoJSON() {
        const steps = (from, to) => Array.from({ length: to - from + 1 }, (_, i) => from + i);
        const lines = [
            ...steps(-90, 90).map(lat => steps(-180, 180).map(lon => [lon, lat])),
            ...steps(-180, 180).map(lon => steps(-90, 90).map(lat => [lon, lat])),
        ];
        return {
            type: "FeatureCollection",
            features: lines.map(coordinates => ({
                type: "Feature",
                geometry: { type: "LineString", coordinates },
                properties: {}
            }))
        };
    }

    function fetchVisitedSquaresGeoJSON() {
    fetch(`/u/{{username}}/visited_squares_data`)
        .then(r => r.json())
        .then(data => {

        // percentages
        document.getElementById('percentageLand').textContent =
            data.land_percentage.toFixed(2) + '%';
        document.getElementById('percentageAir').textContent =
            data.air_percentage.toFixed(2) + '%';
        document.getElementById('percentageTotal').textContent =
            (data.land_percentage + data.air_percentage).toFixed(2) + '%';

        // --- GRID LAYER (underneath) ---
        {
            map.addSource("grid", {
            type: "geojson",
            data: gridGeoJSON()
            });

            map.addLayer({
            id: "grid-layer",
            type: "line",
            source: "grid",
            paint: {
                "line-color": "#aaaaaa",
                "line-width": 0.5,
                "line-opacity": [
                    "interpolate",
                    ["linear"],
                    ["zoom"],
                    0, 0.1,
                    7, 0.5,
                    10, 0.9
                ]
            }
            });
        }

        // --- VISITED SQUARES ---
        map.addSource("visited", {
            type: "geojson",
            data: data.geojson
        });

        squareFeatures = data.geojson.features;

        map.addLayer({
            id: "visited-fill",
            type: "fill",
            source: "visited",
            paint: {
            "fill-color": squareColor(),
            "fill-opacity": [
                "match",
                ["get", "status"],
                "stopped", STATUS_OPACITY.stopped,
                "air", STATUS_OPACITY.air,
                STATUS_OPACITY.passed
            ]
            }
        });

        map.addLayer({
            id: "visited-outline",
            type: "line",
            source: "visited",
            paint: {
            "line-color": squareColor(),
            "line-width": 1,
            "line-opacity": DARK ? 0.6 : 1
            }
        });

        applySquareColorMode();

        // auto zoom. A globe shows one side only, so squares spread wider than that fit
        // the busiest 60° window instead of a box centred on wherever lies between them
        let shown = data.geojson.features.map(f => f.geometry.coordinates[0][0]);
        const lons = shown.map(([lon]) => lon), lats = shown.map(([, lat]) => lat);
        const projection = map.getProjection && map.getProjection();
        if (projection && projection.type === 'globe'
            && (Math.max(...lons) - Math.min(...lons) > 90 || Math.max(...lats) - Math.min(...lats) > 60)) {
            const bin = ([lon, lat]) => [Math.floor(lon / 20), Math.floor(lat / 20)];
            const counts = {};
            shown.forEach(corner => { const key = bin(corner).join(); counts[key] = (counts[key] || 0) + 1; });
            const [bx, by] = Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b).split(',').map(Number);
            shown = shown.filter(corner => { const [x, y] = bin(corner); return Math.abs(x - bx) <= 1 && Math.abs(y - by) <= 1; });
        }
        const bounds = new maplibregl.LngLatBounds();
        shown.forEach(([lon, lat]) => bounds.extend([lon, lat]).extend([lon + 1, lat + 1]));
        if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 40 });
        document.getElementById("map").style.visibility = "visible";
        $('.loading-screen').hide();
        })
        .catch(err => {
        alert("Error loading map: " + err);
        $('.loading-screen').hide();
        });
    }

    // Full-strength blues and greens glare over a dark map: softer, and less opaque
    const DARK = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    const STATUS_COLORS = DARK
        ? { stopped: "#4f63d6", passed: "#4f8fd6", air: "#3d9a50" }
        : { stopped: "#0000ff", passed: "#3388ff", air: "#00aa00" };
    const STATUS_OPACITY = DARK
        ? { stopped: 0.55, passed: 0.35, air: 0.35 }
        : { stopped: 0.7, passed: 0.5, air: 0.5 };

    let squareFeatures = [];
    let showAir = true;

    function toggleSquareAir() {
        showAir = !showAir;
        document.getElementById('squareAirToggle').classList.toggle('off', !showAir);
        applySquareColorMode();
    }
    let squareYearColors = {};

    function squareColor() {
        if (document.getElementById('squareColorMode').value === 'year') {
            const pairs = Object.entries(squareYearColors).flat();
            return pairs.length ? ["match", ["to-string", ["get", "year"]], ...pairs, "#888888"] : "#888888";
        }
        return ["match", ["get", "status"], "air", STATUS_COLORS.air, "stopped", STATUS_COLORS.stopped, STATUS_COLORS.passed];
    }

    function applySquareColorMode() {
        const byYear = document.getElementById('squareColorMode').value === 'year';

        // Weighted by the squares shown that each year first reached
        const counts = {};
        squareFeatures.forEach(f => {
            const year = f.properties.year;
            if (year && (showAir || f.properties.status !== "air")) counts[year] = (counts[year] || 0) + 1;
        });
        squareYearColors = MapLibreUtils.yearColors(counts);

        if (map.getLayer("visited-fill")) {
            const filter = showAir ? null : ["!=", ["get", "status"], "air"];
            map.setFilter("visited-fill", filter);
            map.setFilter("visited-outline", filter);
            map.setPaintProperty("visited-fill", "fill-color", squareColor());
            map.setPaintProperty("visited-outline", "line-color", squareColor());
        }
        document.getElementById('squareTypeLegend').style.display = byYear ? 'none' : '';
        document.getElementById('squareYearLegend').innerHTML = byYear ? MapLibreUtils.yearLegendHtml(squareYearColors) : '';
        document.getElementById('squareYearSpreadToggle').style.display = byYear ? '' : 'none';
        document.getElementById('squareYearSpread').style.display = byYear ? '' : 'none';
    }

    class PercentageControl {
    onAdd() {
        this._div = document.createElement("div");
        this._div.className = "percentage-control";
        this._div.innerHTML = `
        <h4 class="squares-title" role="button" onclick="this.parentElement.classList.toggle('collapsed')">
            <i class="fa-solid fa-border-all"></i> {{ about_explore_squares_h }} <i class="fa-solid fa-chevron-up squares-chevron"></i>
        </h4>
        <div><i class="fas fa-globe"></i> <span id="percentageLand">...</span></div>
        <div id="squareAirToggle" class="square-air-toggle" role="button" title="{{air}}" onclick="toggleSquareAir()"><i class="fas fa-plane"></i> <span id="percentageAir">...</span></div>
        <div><i class="fas fa-chart-pie"></i> <span id="percentageTotal">...</span></div>

        <div class="squares-body">
        <div class="square-color-mode mt-2">
            <label for="squareColorMode">{{ mapColorBy }}</label>
            <select id="squareColorMode" onchange="applySquareColorMode()">
                <option value="type">{{ squareColorByVisit }}</option>
                <option value="year">{{ year }}</option>
            </select>
            <button type="button" id="squareYearSpreadToggle" class="year-spread-toggle" title="{{ yearColorSpread }}" style="display: none;"
                    onclick="document.getElementById('squareYearSpread').classList.toggle('open')"><i class="fa-solid fa-sliders"></i></button>
        </div>
        <div id="squareYearSpread" class="year-spread">
            <input type="range" min="0" max="1" step="0.05" value="${MapLibreUtils.yearSpread()}" oninput="MapLibreUtils.setYearSpread(this.value); applySquareColorMode()">
            <div class="year-spread-ends"><span>{{ yearSpreadEven }}</span><span>{{ yearSpreadTravel }}</span></div>
        </div>
        <div id="squareYearLegend" class="mt-2"></div>
        <div id="squareTypeLegend" class="legend mt-2">
            <div><span class="legend-color" style="background-color: ${STATUS_COLORS.stopped}; opacity: ${STATUS_OPACITY.stopped};"></span> {{stopped}}</div>
            <div><span class="legend-color" style="background-color: ${STATUS_COLORS.passed}; opacity: ${STATUS_OPACITY.passed};"></span> {{passed}}</div>
            <div><span class="legend-color" style="background-color: ${STATUS_COLORS.air}; opacity: ${STATUS_OPACITY.air};"></span> {{air}}</div>
        </div>
        </div>
        `;
        // Folded on phones, where the open panel would hide most of the map
        if (window.matchMedia('(max-width: 640px)').matches) this._div.classList.add('collapsed');
        return this._div;
    }
    }

    function addPercentageControl() {
    const ctrl = new PercentageControl();
    const el = ctrl.onAdd();
    el.style.position = "absolute";
    el.style.top = "10px";
    el.style.left = "10px";
    el.style.zIndex = 10;
    document.getElementById("map").appendChild(el);
    }

    initVisitedSquaresMap();
</script>

<style>
    /* Leaflet percentage control style */
    .percentage-control {
        padding: 6px 8px;
        font: 12px/14px Arial, Helvetica, sans-serif;
        background: white;
        background: rgba(255,255,255,0.8);
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        border-radius: 5px;
    }

    .percentage-control {
        max-height: calc(100% - 20px);
        overflow-y: auto;
    }

    .percentage-control.collapsed .squares-body {
        display: none;
    }

    .squares-chevron {
        font-size: 10px;
        margin-left: 4px;
        transition: transform 0.2s;
    }

    .percentage-control.collapsed .squares-chevron {
        transform: rotate(180deg);
    }

    /* Map colours showing through make the legend unreadable on a small screen */
    @media (max-width: 640px) {
        .percentage-control,
        [data-bs-theme="dark"] .percentage-control {
            background: rgb(var(--bs-body-bg-rgb));
        }

        .percentage-control .year-legend .year-list {
            max-height: 35vh;
        }
    }

    .legend {
        margin-top: 10px;
    }

    .legend div {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
    }

    .squares-title {
        cursor: pointer;
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
    }

    .square-air-toggle {
        cursor: pointer;
        width: fit-content;
    }

    .square-air-toggle.off {
        opacity: 0.4;
        text-decoration: line-through;
    }

    .square-color-mode {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .legend-color {
        width: 15px;
        height: 15px;
        display: inline-block;
        margin-right: 5px;
    }
</style>

{% endblock %}
