{% extends "bootstrap/layout.html" %}
{% block content %}

{% include "bootstrap/navigation.html"%}

<div class="container">
    <h2>Import checkins from Traewelling</h2>

    <label for="username">Traewelling Username:</label>
    <input type="text" id="username" placeholder="..." />

    <label for="apiToken">Traewelling API Token:</label>
    <input type="password" id="apiToken" placeholder="***********" />

    <button id="fetchBtn">Go!</button>

    <div id="checkins"></div>
    <button id="loadMoreBtn" style="display: none;">Mehr laden</button>
</div>

<script>
    const usernameInput = document.getElementById("username");
    const apiTokenInput = document.getElementById("apiToken");
    const fetchBtn = document.getElementById("fetchBtn");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const checkinsContainer = document.getElementById("checkins");

    let currentUsername = null;
    let currentToken = null;
    let currentPage = 0;
    let hasNextPage = false;
    let allCheckins = [];

    const traewellingToTrainlogUrl = {
        HIGHSPEED_RAIL: "{{ url_for('new', username=username, vehicle_type='train') }}",
        LONG_DISTANCE: "{{ url_for('new', username=username, vehicle_type='train') }}",
        REGIONAL_RAIL: "{{ url_for('new', username=username, vehicle_type='train') }}",
        SUBURBAN: "{{ url_for('new', username=username, vehicle_type='train') }}",
        BUS: "{{ url_for('new', username=username, vehicle_type='bus') }}",
    };

    fetchBtn.addEventListener("click", () => {
        const username = usernameInput.value.trim();
        const token = apiTokenInput.value.trim();

        if (!username || !token) {
            alert("Please enter your Traewelling username and API token!");
            return;
        }

        currentUsername = username;
        currentToken = token;
        currentPage = 0;
        allCheckins = [];
        hasNextPage = false;

        checkinsContainer.innerHTML = "<span>Fetching ...</span>";
        loadMoreBtn.style.display = "none";

        loadPage(page => {
            renderCheckins(allCheckins);
        });
    });

    loadMoreBtn.addEventListener("click", () => {
        loadPage(page => {
            renderCheckins(allCheckins);
        });
    });

    function loadPage(onDone) {
        const url = `https://traewelling.de/api/v1/user/${encodeURIComponent(
            currentUsername
        )}/statuses?page=${currentPage}`;

        fetch(url, {
            headers: {
                Authorization: `Bearer ${currentToken}`,
                Accept: "application/json",
            },
        })
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
            }
            return res.json();
        })
        .then(json => {
            if (!Array.isArray(json.data)) {
                throw new Error("Got invalid data from Traewelling ... :(");
            }

            allCheckins = allCheckins.concat(json.data);

            const links = json.links ?? {};
            hasNextPage = !!links.next;
            currentPage++;

            if (hasNextPage) {
                loadMoreBtn.style.display = "";
            } else {
                loadMoreBtn.style.display = "none";
            }

            if (onDone) onDone();
        })
        .catch(err => {
            console.error(err);
            alert("Error while fetching checkins: " + err.message);
            loadMoreBtn.style.display = "none";
        });
    }

    function renderCheckins(checkins) {
        checkinsContainer.innerHTML = "";

        if (checkins.length === 0) {
            checkinsContainer.textContent = "You don't have any checkins in Traewelling :(";
            return;
        }

        console.log(checkins);

        checkins.forEach((checkin) => {
            const c = checkin.checkin;
            const origin = c.origin;
            const dest = c.destination;

            const time = new Date(c.manualDeparture);
            const date = time.toISOString().split("T")[0];
            const timeStr = time.toISOString().split("T")[1].slice(0, 5);

            const div = document.createElement("div");
            div.className = "checkin";
            div.innerHTML = `
                <strong>${c.category} ${c.lineName}</strong><br/>
                ${origin.name} → ${dest.name}<br/>
                <small>${date} ${timeStr}</small>
            `;

            div.addEventListener("click", () => {
                const params = new URLSearchParams();

                params.set("manual", "true");

                params.set("startDate", date);
                params.set("startTime", timeStr);
                params.set("endDate", date);
                const arrivalTime = new Date(c.manualArrival).toISOString().split("T")[1].slice(0, 5);
                params.set("endTime", arrivalTime);

                params.set("origin", origin.name);
                params.set("destination", dest.name);

                params.set("originManualName", origin.name);
                params.set("originManualLat", origin.latitude);
                params.set("originManualLng", origin.longitude);
                params.set("destinationManualName", dest.name);
                params.set("destinationManualLat", dest.latitude);
                params.set("destinationManualLng", dest.longitude);

                params.set("operator", c.operator?.name || "");
                params.set("lineName", c.lineName || "");

                params.set("reg", "");
                params.set("seat", "");
                params.set("notes", checkin.body || "");
                params.set("price", checkin.ticket?.price?.toString() || "");
                params.set("currency", checkin.ticket?.currency || "");
                params.set("purchasing_date", date);

                params.set("departureDelayMinutes", c.origin?.isDepartureDelayed ? "10" : "0");
                params.set("arrivalDelayMinutes", c.destination?.isArrivalDelayed ? "10" : "0");

                console.log(c.mode);

                const url = `${traewellingToTrainlogUrl[c.mode]}?${params.toString()}`;
                window.open(url, "_blank");
            });

            checkinsContainer.appendChild(div);
        });
    }
</script>

{% endblock %}
